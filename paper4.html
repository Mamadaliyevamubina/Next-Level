ew board object.\n\nWrite your answer in Python.","context_note":"The board objects are placed on a board that is represented by a 0-indexed 2D array:\n\n- the board is a 10 x 10 grid\n- each position on the board is identified by a row and column number\n- rows are numbered 0 to 9 and columns are numbered 0 to 9\n- board objects can be placed at a row and column position\n- each board position is initialised with an empty `BoardObject`; an empty `BoardObject` has Code = \"-\" and Value = 0\n\nThe class `Board` stores the data about the board and where the board objects are placed:\n\n| Member | Description |\n|---|---|\n| TheBoard : ARRAY[0:9, 0:9] of BoardObject | stores the board contents as a 2D array of 10 x 10 elements of type BoardObject |\n| Constructor() | initialises each of TheBoard elements to an empty BoardObject with Code = \"-\" and Value = 0 |\n| GetObject() | takes a row and column number as parameters and returns the BoardObject at the row, column position |\n| SetObject() | takes a BoardObject, row number and column number as parameters. Stores the BoardObject in TheBoard at the given row, column position |\n| DisplayBoard() | outputs the code of each BoardObject stored in TheBoard, one row at a time |\n\nAssume the classes `BoardObject` and `Board` exist, and the main program already contains these objects:\n\n```python\nObject1 = BoardObject(\"A\", 2)\nObject2 = BoardObject(\"B\", 3)\nObject3 = BoardObject(\"C\", 5)\nObject4 = BoardObject(\"D\", 2)\nObject5 = BoardObject(\"E\", 7)\n```","answer_type":"code","criteria":[{"point":"Creates an instance of Board and stores it in a variable","key_terms":["Board()","GameBoard ="]},{"point":"Stores all five objects in the correct positions using SetObject(): Object1 (0,0), Object2 (9,9), Object3 (4,5), Object4 (2,2), Object5 (8,7)","key_terms":["SetObject(Object1, 0, 0)","SetObject(Object2, 9, 9)","SetObject(Object3, 4, 5)","SetObject(Object4, 2, 2)","SetObject(Object5, 8, 7)"]},{"point":"Calls DisplayBoard() on the new board","key_terms":["GameBoard.DisplayBoard()"]}],"max_note":"max 3 (1 mark each)","rejects":["Row comes first, then column, in each SetObject() call (e.g. Object3 goes to row 4, column 5).","All five positions must be correct for the second mark.","Any variable name for the Board is accepted."],"final_answer":"GameBoard = Board()                   # new Board instance stored in a variable\nGameBoard.SetObject(Object1, 0, 0)    # each object stored at its row, column\nGameBoard.SetObject(Object2, 9, 9)\nGameBoard.SetObject(Object3, 4, 5)\nGameBoard.SetObject(Object4, 2, 2)\nGameBoard.SetObject(Object5, 8, 7)\nGameBoard.DisplayBoard()              # display the board","confidence":"high"},{"id":"w25-43-1di","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"1(d)(i)","marks":4,"chapter":19,"subtopic":"validation","prompt":"Amend the main program to:\n\n- repeatedly take a row position as input until it is between 0 and 9 inclusive\n- repeatedly take a column position as input until it is between 0 and 9 inclusive\n- use the appropriate method(s) to identify if there is an object in the array position input\n- output \"Miss\" if there is an empty `BoardObject` in that position\n- output the Code and Value if there is a non-empty `BoardObject` in that position.\n\nAll outputs must include appropriate messages.\n\nWrite your answer in Python.","context_note":"The board objects are placed on a board that is represented by a 0-indexed 2D array:\n\n- the board is a 10 x 10 grid\n- each position on the board is identified by a row and column number\n- rows are numbered 0 to 9 and columns are numbered 0 to 9\n- board objects can be placed at a row and column position\n- each board position is initialised with an empty `BoardObject`; an empty `BoardObject` has Code = \"-\" and Value = 0\n\nThe class `Board` stores the data about the board and where the board objects are placed:\n\n| Member | Description |\n|---|---|\n| TheBoard : ARRAY[0:9, 0:9] of BoardObject | stores the board contents as a 2D array of 10 x 10 elements of type BoardObject |\n| Constructor() | initialises each of TheBoard elements to an empty BoardObject with Code = \"-\" and Value = 0 |\n| GetObject() | takes a row and column number as parameters and returns the BoardObject at the row, column position |\n| SetObject() | takes a BoardObject, row number and column number as parameters. Stores the BoardObject in TheBoard at the given row, column position |\n| DisplayBoard() | outputs the code of each BoardObject stored in TheBoard, one row at a time |\n\nThe classes `BoardObject` (with `GetCode()` and `GetValue()`) and `Board` exist. The main program already has a `Board` stored in `GameBoard` with the five objects placed on it (A at row 0 col 0, B at 9,9, C at 4,5, D at 2,2, E at 8,7); every other position holds an empty `BoardObject` (Code \"-\", Value 0).","answer_type":"code","criteria":[{"point":"Takes the row and the column as input repeatedly until each value is between 0 and 9 inclusive","key_terms":["while","< 0","> 9","int(input("]},{"point":"Calls GameBoard.GetObject() with the input row and column values ...","key_terms":["GameBoard.GetObject(InputRow, InputColumn)"]},{"point":"... checks whether an object exists (e.g. if the Code is \"-\")","key_terms":["GetCode() == \"-\"","GetCode() !="]},{"point":"... outputs \"Miss\" if there is no BoardObject, and outputs the Code and Value in an appropriate message if there is a BoardObject","key_terms":["\"Miss\"","GetCode()","GetValue()","print("]}],"max_note":"max 4 (1 mark each)","rejects":["Each input must be converted with int() and validated separately; row is requested before column.","The empty-object test should use the Code being \"-\" (the scheme's check); testing Value == 0 on its own is not reliable because a real object could have a value of 0.","The Code and Value must be output with explanatory text, not as bare values.","Attributes should be read with GetCode() and GetValue()."],"final_answer":"InputRow = -1\nwhile InputRow < 0 or InputRow > 9:                                       # repeat until row between 0 and 9\n    InputRow = int(input(\"Enter the row position between 0 and 9: \"))\nInputColumn = -1\nwhile InputColumn < 0 or InputColumn > 9:                                 # repeat until column between 0 and 9\n    InputColumn = int(input(\"Enter the column position between 0 and 9: \"))\nGuessObject = GameBoard.GetObject(InputRow, InputColumn)                  # get the object at that position\nif GuessObject.GetCode() == \"-\":                                          # empty object?\n    print(\"Miss\")\nelse:\n    print(\"You found\", GuessObject.GetCode(), \"with value\", GuessObject.GetValue())   # code and value in a message","confidence":"high"},{"id":"w25-43-2a","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"2(a)","marks":2,"chapter":19,"subtopic":"queue","prompt":"Write program code to declare and initialise `Queue`, `QueueHead`, `QueueTail` and `NumberItems`.\n\nWrite your answer in Python.","context_note":"A program reads string data from a text file into a linear queue and then compresses the data.\n\nThe queue is created using the global 1D array `Queue`. The queue can store up to 100 elements. Each element is initialised to the empty string `\"\"`.\n\nThe queue has two pointers that are global to the program:\n\n- `QueueHead` points to the index of the first element in the queue, initialised to -1\n- `QueueTail` points to the index of the last element in the queue, initialised to -1\n\nThe global variable `NumberItems` stores the number of elements stored in the queue, initialised to 0.","answer_type":"code","criteria":[{"point":"Queue declared as a (global) 1D array of 100 string elements, all initialised to \"\"","key_terms":["Queue = []","range(100)","append(\"\")","[\"\"] * 100"]},{"point":"QueueHead and QueueTail initialised to -1, and NumberItems initialised to 0","key_terms":["QueueHead = -1","QueueTail = -1","NumberItems = 0"]}],"max_note":"max 2 (1 mark each)","rejects":["The queue needs exactly 100 elements, each the empty string (not None, not 0).","The variables must be at module (global) level.","Accept [\"\"] * 100 or an append loop; a list of strings is fine, a list of length other than 100 is not."],"final_answer":"Queue = []\nfor x in range(100):      # 1D array of 100 elements, each initialised to the empty string\n    Queue.append(\"\")\nQueueHead = -1            # pointers initialised to -1\nQueueTail = -1\nNumberItems = 0           # item count initialised to 0","confidence":"high"},{"id":"w25-43-2b","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"2(b)","marks":5,"chapter":19,"subtopic":"queue","prompt":"The function `Enqueue()` takes a string as a parameter. The function checks if the queue is full, and returns Boolean `False` if the queue is full.\n\nIf the queue is not full, the parameter is inserted into the next position in `Queue`. The function updates the appropriate pointer(s), updates `NumberItems` and then returns Boolean `True`.\n\nWrite program code for `Enqueue()`.\n\nWrite your answer in Python.","context_note":"A program reads string data from a text file into a linear queue and then compresses the data.\n\nThe queue is created using the global 1D array `Queue`. The queue can store up to 100 elements. Each element is initialised to the empty string `\"\"`.\n\nThe queue has two pointers that are global to the program:\n\n- `QueueHead` points to the index of the first element in the queue, initialised to -1\n- `QueueTail` points to the index of the last element in the queue, initialised to -1\n\nThe global variable `NumberItems` stores the number of elements stored in the queue, initialised to 0.\n\nThe global variables are declared and initialised as:\n\n```python\nQueue = [\"\"] * 100\nQueueHead = -1\nQueueTail = -1\nNumberItems = 0\n```","answer_type":"code","criteria":[{"point":"Function header (and end where appropriate) taking one (string) parameter, checking whether the queue is full and returning False","key_terms":["def Enqueue(TheData)","return False"]},{"point":"(Otherwise) storing the parameter in Queue at QueueTail + 1","key_terms":["Queue[QueueTail + 1] = TheData"]},{"point":"Incrementing QueueTail and NumberItems","key_terms":["QueueTail = QueueTail + 1","QueueTail += 1","NumberItems += 1","NumberItems = NumberItems + 1"]},{"point":"(Dealing with the first element) if QueueHead = -1, storing 0 in QueueHead (incrementing QueueHead)","key_terms":["QueueHead == -1","QueueHead = 0"]},{"point":"Returning True whenever the item is inserted","key_terms":["return True"]}],"max_note":"max 5 (1 mark each)","rejects":["The queue is linear (not circular): it is full when QueueTail has reached 99 (index of the last element). The question does not define the test, so accept any valid full test for this linear queue (QueueTail == 99, or NumberItems == 100 when nothing has been dequeued).","The scheme's printed example has the full test written the wrong way round (it accepts items only when QueueTail >= 99); mark by the bullet points above, not by that example.","Python needs 'global' for QueueHead, QueueTail and NumberItems inside the function, since they are reassigned.","The function must return True or False (Booleans), not strings."],"final_answer":"def Enqueue(TheData):\n    global Queue, QueueHead, QueueTail, NumberItems\n    if QueueTail == 99:                 # queue full: return FALSE\n        return False\n    Queue[QueueTail + 1] = TheData      # store in the next position (QueueTail + 1)\n    QueueTail = QueueTail + 1           # increment QueueTail\n    NumberItems = NumberItems + 1       # increment NumberItems\n    if QueueHead == -1:                 # first element: QueueHead becomes 0\n        QueueHead = 0\n    return True                         # TRUE when inserted","confidence":"high"},{"id":"w25-43-2c","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"2(c)","marks":3,"chapter":19,"subtopic":"queue","prompt":"The function `Dequeue()` returns the string \"False\" if the queue is empty.\n\nIf the queue is not empty, the function returns the next element in the queue. The function updates the appropriate pointer(s) and updates `NumberItems`.\n\nWrite program code for `Dequeue()`.\n\nWrite your answer in Python.","context_note":"A program reads string data from a text file into a linear queue and then compresses the data.\n\nThe queue is created using the global 1D array `Queue`. The queue can store up to 100 elements. Each element is initialised to the empty string `\"\"`.\n\nThe queue has two pointers that are global to the program:\n\n- `QueueHead` points to the index of the first element in the queue, initialised to -1\n- `QueueTail` points to the index of the last element in the queue, initialised to -1\n\nThe global variable `NumberItems` stores the number of elements stored in the queue, initialised to 0.\n\nItems are added by `Enqueue()` at `QueueTail + 1`; the first item is at index `QueueHead`.","answer_type":"code","criteria":[{"point":"Function header (and end), checking whether the queue is empty (NumberItems = 0 or QueueHead > QueueTail) and returning \"False\"","key_terms":["def Dequeue()","NumberItems == 0","return \"False\""]},{"point":"(Otherwise) returning Queue[QueueHead]","key_terms":["Queue[QueueHead]","return"]},{"point":"Incrementing QueueHead and decrementing NumberItems","key_terms":["QueueHead += 1","QueueHead = QueueHead + 1","NumberItems -= 1","NumberItems = NumberItems - 1"]}],"max_note":"max 3 (1 mark each)","rejects":["The empty-queue value is the string \"False\" (in quotes), not the Boolean False.","The element at QueueHead must be saved before QueueHead is incremented, then returned (code after a return statement never runs).","Python needs 'global' for QueueHead and NumberItems inside the function."],"final_answer":"def Dequeue():\n    global Queue, QueueHead, QueueTail, NumberItems\n    if NumberItems == 0:                # queue empty: return \"False\"\n        return \"False\"\n    ReturnData = Queue[QueueHead]       # return the element at the head\n    QueueHead = QueueHead + 1           # increment QueueHead\n    NumberItems = NumberItems - 1       # decrement NumberItems\n    return ReturnData","confidence":"high"},{"id":"w25-43-2d","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"2(d)","marks":5,"chapter":20,"subtopic":"text-file-read","prompt":"The text file `BinaryData.txt` stores individual binary digits, '1' and '0'. Each digit is on a new line. For example, the first line in the text file stores '1', the second line stores '1'.\n\nThe procedure `ReadData()` reads in each line from the text file `BinaryData.txt` and inserts it into the queue using the appropriate method.\n\nThe procedure needs to work for a text file with any number of lines up to a maximum of 100.\n\nWrite program code for `ReadData()`.\n\nWrite your answer in Python.","context_note":"A program reads string data from a text file into a linear queue and then compresses the data.\n\nThe queue is created using the global 1D array `Queue`. The queue can store up to 100 elements. Each element is initialised to the empty string `\"\"`.\n\nThe queue has two pointers that are global to the program:\n\n- `QueueHead` points to the index of the first element in the queue, initialised to -1\n- `QueueTail` points to the index of the last element in the queue, initialised to -1\n\nThe global variable `NumberItems` stores the number of elements stored in the queue, initialised to 0.\n\n`Enqueue(TheData)` already exists: it inserts a string into the queue and returns `True`, or returns `False` if the queue is full. The file `BinaryData.txt` is supplied in the exam (one binary digit per line).","answer_type":"code","criteria":[{"point":"Procedure header (and end where appropriate)","key_terms":["def ReadData()"]},{"point":"Opens the file and closes the file (in an appropriate place)","key_terms":["open(\"BinaryData.txt\"","close()","with open"]},{"point":"Loops until end of file / through each line ...","key_terms":["for Line in","while"]},{"point":"... reads in each value ...","key_terms":["for Line in","readline()","Line.strip()"]},{"point":"... calls Enqueue() with the value read in, and stores/uses the return value","key_terms":["Enqueue(Line.strip())","ReturnValue ="]},{"point":"Exception handling with try / except and an appropriate output, with all file access within the try","key_terms":["try:","except","print("]}],"max_note":"1 mark each to max 5 (6 mark points listed)","rejects":["The newline at the end of each line should be removed (strip()), otherwise the queue holds '1\\n' instead of '1' and the compression later gives wrong results.","The procedure must work for any number of lines up to 100: loop over the lines of the file, not a fixed count.","A 'with open(...)' block counts as opening and closing the file.","The Enqueue() mark needs the return value to be stored or used (for example to stop reading when the queue is full)."],"final_answer":"def ReadData():\n    try:                                          # exception handling, all file access inside try\n        TheFile = open(\"BinaryData.txt\", \"r\")     # open the file\n        for Line in TheFile:                      # loop through each line\n            ReturnValue = Enqueue(Line.strip())   # read value and call Enqueue() with it, using the return value\n            if ReturnValue == False:              # stop if the queue is full\n                break\n        TheFile.close()                           # close the file\n    except:\n        print(\"Cannot open or read the file\")     # appropriate message","confidence":"high"},{"id":"w25-43-2e","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"2(e)","marks":6,"chapter":19,"subtopic":"string-handling","prompt":"The string data in the text file is compressed.\n\nThe compression algorithm counts the number of times each binary digit appears consecutively, then stores the binary digit followed by the number of times it appears. The algorithm stores the compressed data in a single string.\n\nFor example, if the text file contains the data:\n\n```\n1\n1\n0\n0\n0\n1\n1\n1\n```\n\nThe compression algorithm will create the string `\"120313\"` because there are two '1' digits, followed by three '0' digits, followed by three '1' digits.\n\nThe procedure `Compress()` uses `Dequeue()` to remove each element from the queue in turn. The procedure then compresses the data following the compression algorithm described. The new compressed string is stored in the global variable `NewString`.\n\nYou can assume that one binary digit will never appear more than nine times consecutively in the sequence.\n\nYou can assume that there will always be at least one item in the queue.\n\nWrite program code for `Compress()`.\n\nWrite your answer in Python.","context_note":"A program reads string data from a text file into a linear queue and then compresses the data.\n\nThe queue is created using the global 1D array `Queue`. The queue can store up to 100 elements. Each element is initialised to the empty string `\"\"`.\n\nThe queue has two pointers that are global to the program:\n\n- `QueueHead` points to the index of the first element in the queue, initialised to -1\n- `QueueTail` points to the index of the last element in the queue, initialised to -1\n\nThe global variable `NumberItems` stores the number of elements stored in the queue, initialised to 0.\n\nThe queue already holds the binary digits (as strings '1' and '0') read from the file. `Dequeue()` returns the next element, or the string \"False\" when the queue is empty. `NewString` is a global string variable.","answer_type":"code","criteria":[{"point":"Procedure header (and end where appropriate), storing the final compressed string in the global variable NewString","key_terms":["def Compress()","global NewString","NewString"]},{"point":"Calls Dequeue() and stores the return value ...","key_terms":["Dequeue()","= Dequeue()"]},{"point":"... repeatedly until the return value is \"False\"","key_terms":["while","!= \"False\""]},{"point":"Compares the new value with the previous one ...","key_terms":["Item == Current","NextChar == First"]},{"point":"... maintains a counter of the number of occurrences ...","key_terms":["Count = Count + 1","Count += 1"]},{"point":"... appends the digit and the number of occurrences to the string without overwriting it (the count converted to a string)","key_terms":["NewString = NewString +","str(Count)"]}],"max_note":"max 6 (1 mark each)","rejects":["The count must be converted with str() before it is joined to the digit string (a number cannot be concatenated to a string in Python).","The last run of digits must also be appended after the loop ends (or equivalent); missing it gives a wrong final string.","Appending must add to NewString (NewString = NewString + ...), not overwrite it.","Python needs 'global NewString' inside the procedure so the result is stored in the global variable.","Run lengths can be assumed to be at most 9 (each count is a single digit)."],"final_answer":"def Compress():\n    global NewString\n    NewString = \"\"\n    Current = Dequeue()                                  # first digit\n    Count = 1\n    Item = Dequeue()                                     # call Dequeue() repeatedly ...\n    while Item != \"False\":                               # ... until \"False\" is returned\n        if Item == Current:                              # compare with the previous digit\n            Count = Count + 1                            # count consecutive occurrences\n        else:\n            NewString = NewString + Current + str(Count) # append digit then count to the string\n            Current = Item\n            Count = 1\n        Item = Dequeue()\n    NewString = NewString + Current + str(Count)         # append the final run","confidence":"high"},{"id":"w25-43-2fi","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"2(f)(i)","marks":2,"chapter":19,"subtopic":"main-program","prompt":"Write program code for the main program to:\n\n- call `ReadData()`\n- call `Compress()`\n- output the content of the compressed string.\n\nWrite your answer in Python.","context_note":"A program reads string data from a text file into a linear queue and then compresses the data.\n\nThe queue is created using the global 1D array `Queue`. The queue can store up to 100 elements. Each element is initialised to the empty string `\"\"`.\n\nThe queue has two pointers that are global to the program:\n\n- `QueueHead` points to the index of the first element in the queue, initialised to -1\n- `QueueTail` points to the index of the last element in the queue, initialised to -1\n\nThe global variable `NumberItems` stores the number of elements stored in the queue, initialised to 0.\n\nThe queue variables and `NewString` (initialised to \"\") are declared and initialised at the start of the main program, and the procedures `ReadData()` and `Compress()` already exist. The compressed string is stored in the global variable `NewString`.","answer_type":"code","criteria":[{"point":"Calls ReadData() then Compress() (in that order)","key_terms":["ReadData()","Compress()"]},{"point":"Outputs the compressed string (NewString)","key_terms":["print(NewString)"]}],"max_note":"max 2 (1 mark each)","rejects":["ReadData() must be called before Compress(); the other way round compresses an empty queue.","The compressed string in NewString must be output (print). The scheme's main program also re-initialises the queue variables before the calls; that is not needed for the marks here."],"final_answer":"ReadData()          # fill the queue from the file\nCompress()          # compress the queue contents into NewString\nprint(NewString)    # output the compressed string","confidence":"high"},{"id":"w25-43-3ai","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"3(a)(i)","marks":6,"chapter":19,"subtopic":"recursion","prompt":"A recursive function `RecursiveCount()` takes three parameters:\n\n- `ArrayCopy`, an array of integers\n- `NumberElements`, the number of elements in the array of integers\n- `DataToFind`, an integer data to find in the array.\n\nThe function counts and returns the number of times `DataToFind` is in `ArrayCopy`.\n\nThe recursive algorithm:\n\n- returns 0 if there are no elements in `ArrayCopy`\n- compares the first element in `ArrayCopy` with `DataToFind`\n  - if the element matches, the function returns 1 added to the return value from a recursive call (passing the array without the first element)\n  - if the element does not match, the function returns the return value from a recursive call (passing the array without the first element).\n\nWrite program code for `RecursiveCount()`.\n\nWrite your answer in Python.","context_note":"A 1D array stores 10 integers. The parameters may be written in any order; in the exam's main program the function is called with the data to find first, then the array, then the number of elements, so the definition `RecursiveCount(DataToFind, ArrayCopy, NumberElements)` is used here.","answer_type":"code","criteria":[{"point":"Function header (and end) taking three parameters","key_terms":["def RecursiveCount(","DataToFind","ArrayCopy","NumberElements"]},{"point":"Checks the number of elements for 0 and returns 0 (e.g. NumberElements == 0 or len(ArrayCopy) == 0)","key_terms":["NumberElements > 0","NumberElements == 0","len(ArrayCopy) == 0","return 0"]},{"point":"(Otherwise) compares the first array element to the parameter DataToFind ...","key_terms":["ArrayCopy[0] == DataToFind"]},{"point":"... if match, returns a recursive call with 1 added","key_terms":["return 1 + RecursiveCount("]},{"point":"... if no match, returns a recursive call without adding 1","key_terms":["return RecursiveCount("]},{"point":"... all recursive calls pass the array without the first element, NumberElements - 1 and DataToFind","key_terms":["ArrayCopy[1:]","NumberElements - 1","DataToFind"]}],"max_note":"max 6 (1 mark each)","rejects":["The function must be recursive (calls itself); a loop that counts does not earn the recursive-call marks.","Parameter order is free as long as the calls are consistent with the student's own definition (the question lists ArrayCopy, NumberElements, DataToFind; the scheme's own code uses DataToFind, ArrayCopy, NumberElements).","Every recursive call must pass a shorter array and NumberElements - 1, otherwise the recursion never ends.","Accept slicing ArrayCopy[1:], or building a new list without the first element."],"final_answer":"def RecursiveCount(DataToFind, ArrayCopy, NumberElements):\n    if NumberElements > 0:                                                      # base case when no elements: return 0 below\n        NewArray = ArrayCopy[1:]                                                # array without the first element\n        if ArrayCopy[0] == DataToFind:                                          # compare first element with DataToFind\n            return 1 + RecursiveCount(DataToFind, NewArray, NumberElements - 1) # match: 1 + recursive call\n        else:\n            return RecursiveCount(DataToFind, NewArray, NumberElements - 1)     # no match: recursive call only\n    else:\n        return 0                                                                # no elements: return 0","confidence":"high"},{"id":"w25-43-3aii","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"3(a)(ii)","marks":3,"chapter":19,"subtopic":"main-program","prompt":"The main program stores the following data in a 1D array of integers in the order given:\n\n`0 5 1 2 5 9 9 6 5 0`\n\nThe main program calls `RecursiveCount()` with the parameters:\n\n- 0 as the data to find\n- 10 as the number of elements\n- the array of 10 integers.\n\nThe return value is output.\n\nWrite program code for the main program.\n\nWrite your answer in Python.","context_note":"The recursive function `RecursiveCount(DataToFind, ArrayCopy, NumberElements)` already exists and returns how many times `DataToFind` appears in `ArrayCopy`.","answer_type":"code","criteria":[{"point":"Stores the correct data in an array: 0, 5, 1, 2, 5, 9, 9, 6, 5, 0 in that order","key_terms":["[0,5,1,2,5,9,9,6,5,0]","[0, 5, 1, 2, 5, 9, 9, 6, 5, 0]"]},{"point":"Calls RecursiveCount() with the correct parameters: 0 as the data to find, the array, and 10 elements","key_terms":["RecursiveCount(0, MyArray, 10)"]},{"point":"Outputs the return value","key_terms":["print("]}],"max_note":"max 3 (1 mark each)","rejects":["The parameters must be passed in the order of the student's own definition (the scheme calls RecursiveCount(0, MyArray, 10)).","The value returned (2) must be output with print."],"final_answer":"MyArray = [0, 5, 1, 2, 5, 9, 9, 6, 5, 0]       # 1D array with the data in the order given\nprint(RecursiveCount(0, MyArray, 10))           # call with data to find 0, the array, 10 elements; output the return value","confidence":"high"},{"id":"w25-43-3bii","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"3(b)(ii)","marks":6,"chapter":19,"subtopic":"string-handling","prompt":"The function `SplitData()` splits a string parameter into four individual lines of code.\n\nThe function creates an array of the strings where each line is stored in a new array element without the semi-colon.\n\nThe function returns the array of strings.\n\nDo not use an inbuilt function to split the string.\n\nWrite program code for `SplitData()`.\n\nWrite your answer in Python.","context_note":"The program stores the string `\"x=0;y=1;x=x+y;y++;\"`. The string has four statements that are each terminated by a semi-colon ';'.","answer_type":"code","criteria":[{"point":"Function header, taking one string parameter","key_terms":["def SplitData(DataString)"]},{"point":"Loop, e.g. four times / through each character in the parameter","key_terms":["for Character in DataString","for x in range(4)","while"]},{"point":"Comparing a character from the parameter to ';' ...","key_terms":["Character == \";\"","Character != \";\""]},{"point":"... concatenating the current character to a string until ';' is found ...","key_terms":["TempString = TempString + Character"]},{"point":"... when ';' is found, storing the string in the array","key_terms":["SplitDataArray.append(TempString)"]},{"point":"Returning the string array without semi-colons","key_terms":["return SplitDataArray"]}],"max_note":"max 6 (1 mark each)","rejects":["No inbuilt splitting function or method may be used (split(), partition(), re.split() and similar earn no marks for the character-by-character logic).","The strings stored in the array must not contain the ';'.","A temporary string must be reset after each ';' is found, otherwise the elements grow into each other.","Accept looping by index (for i in range(len(DataString))) as well as looping over characters."],"final_answer":"def SplitData(DataString):\n    SplitDataArray = []                    # array of strings to return\n    TempString = \"\"\n    for Character in DataString:           # loop through each character\n        if Character == \";\":               # compare character with ';'\n            SplitDataArray.append(TempString)   # ';' found: store the string in the array (without the semi-colon)\n            TempString = \"\"\n        else:\n            TempString = TempString + Character # otherwise add the character to the current string\n    return SplitDataArray                  # return the array of strings","confidence":"high"},{"id":"w25-43-3biii","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"3(b)(iii)","marks":2,"chapter":19,"subtopic":"main-program","prompt":"The main program needs to call `SplitData()` with the string from part 3(b)(i). The main program then needs to output each element from the returned array on a new line.\n\nWrite program code to amend the main program.\n\nWrite your answer in Python.","context_note":"The main program already stores the string in a local variable: `Code = \"x=0;y=1;x=x+y;y++;\"`. The function `SplitData(DataString)` returns an array (list) of the four strings without the semi-colons.","answer_type":"code","criteria":[{"point":"Calls SplitData() with the string as argument, and stores/uses the return value","key_terms":["SplitData(Code)","SplitDataArray ="]},{"point":"Outputs each element of the returned array on a new line","key_terms":["for","print("]}],"max_note":"max 2 (1 mark each)","rejects":["Each element must be output on its own line (one print per element, or print('\\n'.join(...)); printing the whole list in brackets on one line does not earn the mark.","Accept looping over the list directly or by index (range(4) or range(len(...)))."],"final_answer":"SplitDataArray = SplitData(Code)     # call SplitData() with the string and store the returned array\nfor Element in SplitDataArray:       # output each element on a new line\n    print(Element)","confidence":"high"}],"papers":{"s21-41":{"code":"9618/41 May/June 2021","qp":"https://pastpapers.papacambridge.com/directories/CAIE/CAIE-pastpapers/upload/9618_s21_qp_41.pdf","ms":"https://pastpapers.papacambridge.com/directories/CAIE/CAIE-pastpapers/upload/9618_s21_ms_41.pdf"},"s23-41":{"code":"9618/41 May/June 2023","qp":"https://pastpapers.papacambridge.com/directories/CAIE/CAIE-pastpapers/upload/9618_s23_qp_41.pdf","ms":"https://pastpapers.papacambridge.com/directories/CAIE/CAIE-pastpapers/upload/9618_s23_ms_41.pdf"},"s23-42":{"code":"9618/42 May/June 2023","qp":"https://pastpapers.papacambridge.com/directories/CAIE/CAIE-pastpapers/upload/9618_s23_qp_42.pdf","ms":"https://pastpapers.papacambrid   function tmState(sec, marks){ var r = sec / Math.max(1, marks * 120); return r <= 1 ? "ok" : r <= 1.5 ? "warn" : "bad"; }

  function tmFmt(sec){ sec = Math.round(sec); return Math.floor(sec/60) + ":" + ("0"+(sec%60)).slice(-2); }
  function timeBoxes(it, r){
    var sec = tmSecOf(r); if(!(sec > 0)) return "";
    var pace = it.marks * 120, st = tmState(sec, it.marks), diff = Math.round(sec - pace), perMark = Math.round(sec / it.marks);
    var word = {ok:"On pace", warn:"A bit slow", bad:"Too slow"}[st];
    var h = "<div class='tbs' role='group' aria-label='Time result'>"+
      "<div class='tb "+st+"' title='"+(r.ms!=null?Math.round(r.ms)+" ms":"")+"'><b>"+tmFmt(sec)+"</b><span>Time spent · "+word+"</span></div>"+
      "<div class='tb info'><b>"+tmFmt(pace)+"</b><span>Exam pace for "+it.marks+(it.marks===1?" mark":" marks")+"</span></div>"+
      "<div class='tb "+st+"'><b>"+(diff<=0?"−":"+")+tmFmt(Math.abs(diff))+"</b><span>"+(diff<=0?"under":"over")+" the pace</span></div>"+
      "<div class='tb "+st+"'><b>"+perMark+" s</b><span>per mark (target 120 s)</span></div></div>";
    var note = "";
    if(sec < pace * 0.35 && r.awarded < r.marks) note = "Very quick and marks were lost. Read the question twice and write one point per mark before you press Mark.";
    else if(st === "bad") note = "Over time. In the exam this question would have eaten into the next one. Practise writing the same answer faster, with fewer words per point.";
    else if(st === "warn") note = "Slightly over the pace. Fine for learning, but aim to finish inside "+tmFmt(pace)+".";
    else note = "Inside the exam pace.";
    h += "<div class='tbn'>"+note+"</div>";
    var tries = attempts.filter(function(a){ return a.id === it.id && tmSecOf(a) > 0; }).sort(function(x,y){ return x.ts - y.ts; });
    if(tries.length > 1){
      h += "<div class='tries' aria-label='Time on each try'>"+tries.map(function(a,i){ var s = tmState(tmSecOf(a), a.marks); return "<span class='try "+s+(a.k===r.k?" cur":"")+"'>Try "+(i+1)+" · "+a.awarded+"/"+a.marks+" · "+tmFmt(tmSecOf(a))+"</span>"; }).join("")+"</div>";
    }
    return h;
  }

    L.push("");

    L.push("");
    L.push("MARK SCHEME POINTS:");

    if(it.rejects && it.rejects.length) L.push("NEVER CREDIT: "+it.rejects.join(" ; "));
    L.push("");
    L.push("STUDENT ANSWER:\n\"\"\"\n"+ans+"\n\"\"\"");
    L.push("");
    L.push("CHECK THESE CLAIMS:");

      else { L.push("- Slip "+x.n+": "+res.slips[x.n]+" ("+x.why+")"); }

var P4GUIDE = [{"id": "g1", "title": "How Paper 4 works", "blocks": [["p", "Paper 4 is a **computer-based practical**: 2 hours 30 minutes, 75 marks, three questions, and you write real Python (console mode) with no internet. In the real exam you save each program, paste the code into the evidence document and paste a screenshot of the test output. Work that is not in the evidence document earns nothing. On this site you type only the code; the screenshot and test parts are left out."], ["p", "From the past papers: every paper has exactly three questions, and the same building blocks come back each time: a **class** (constructor, get and set methods, inheritance), **reading or writing a text file**, a **stack, queue, linked list or binary tree**, a **search or sort**, and **recursion**. The parts of a question build on each other, so a program that works in (b) is used in (c) and (d). Get part (a) and (b) working first."], ["ul", ["Time: 2 minutes a mark on average (150 minutes for 75). A 6-mark function is about 12 minutes including testing.", "Each mark is one thing your code **does**: declare it, loop the right number of times, test the right condition, update a pointer, return the value. Read the bullet list in the question: each bullet is normally a mark.", "Use the names the question gives (`Enqueue`, `HeadPointer`, `GetName`). A wrong name can lose the mark even when the logic is right.", "Always run your code before you move on. A program that crashes loses the marks that depend on it."]]]}, {"id": "g19", "title": "19. Algorithms and data structures", "blocks": [["h3", "Stack (last in, first out)"], ["p", "An array plus a pointer to the top. **Check full before Push, check empty before Pop.** In Python a function that assigns to a global variable must say `global`."], ["code", "Stack = [\"\"] * 10                       # 1D array of 10 items\nTopOfStack = -1                         # -1 means empty (use 0 if the question starts at 1)\nNumberItems = 0\n\ndef Push(newData):\n    global TopOfStack, NumberItems      # needed because we ASSIGN to these globals\n    if NumberItems == 10:               # check full first\n        return False\n    TopOfStack = TopOfStack + 1\n    Stack[TopOfStack] = newData\n    NumberItems = NumberItems + 1\n    return True\n\ndef Pop():\n    global TopOfStack, NumberItems\n    if NumberItems == 0:                # check empty first\n        return \"Stack empty\"\n    item = Stack[TopOfStack]\n    TopOfStack = TopOfStack - 1\n    NumberItems = NumberItems - 1\n    return item"], ["h3", "Circular queue (first in, first out)"], ["p", "Head points at the next item to leave, Tail at the last item added. Both move on by 1 and **wrap round with `% 20`**. `NumberItems` tells you if it is full or empty."], ["code", "Queue = [-1] * 20\nHeadPointer = -1\nTailPointer = -1\nNumberItems = 0\n\ndef Enqueue(newData):\n    global HeadPointer, TailPointer, NumberItems\n    if NumberItems == 20:               # full\n        return False\n    if HeadPointer == -1:               # first item ever stored\n        HeadPointer = 0\n    TailPointer = (TailPointer + 1) % 20    # wrap round: 19 -> 0\n    Queue[TailPointer] = newData\n    NumberItems = NumberItems + 1\n    return True\n\ndef Dequeue():\n    global HeadPointer, NumberItems\n    if NumberItems == 0:\n        return -1\n    item = Queue[HeadPointer]\n    Queue[HeadPointer] = -1\n    HeadPointer = (HeadPointer + 1) % 20\n    NumberItems = NumberItems - 1\n    return item"], ["h3", "Linked list (parallel arrays)"], ["p", "Each node has a data value and a pointer to the next node. A **free list** chains the unused nodes. To add a node: take the first free node, move `FreePointer` on, fill the node, then link it in. To read the list: start at `StartPointer` and follow the pointers until you reach `-1`. **Never add 1 to the pointer.**"], ["code", "# linked list in parallel arrays (the usual exam layout)\nData = [\"\"] * 10\nPointer = [-1] * 10\nStartPointer = -1\nFreePointer = 0\nfor i in range(9):                      # chain the free list: 0 -> 1 -> 2 ... -> -1\n    Pointer[i] = i + 1\n\ndef AddNode(newData):                   # adds at the front\n    global StartPointer, FreePointer\n    if FreePointer == -1:\n        return False                    # list full\n    newNode = FreePointer\n    FreePointer = Pointer[newNode]      # read the next free node BEFORE you overwrite it\n    Data[newNode] = newData\n    Pointer[newNode] = StartPointer\n    StartPointer = newNode\n    return True\n\ndef PrintList():\n    current = StartPointer\n    while current != -1:                # follow the pointers, never current + 1\n        print(Data[current])\n        current = Pointer[current]"], ["h3", "Binary tree"], ["p", "Smaller values go left, larger values go right, starting at the root every time. An **in-order** traversal (left, node, right) visits the values in sorted order. It is naturally recursive."], ["code", "# binary tree in arrays: LeftPointer / RightPointer, -1 = no child\nTree = [None] * 10\nLeftPointer = [-1] * 10\nRightPointer = [-1] * 10\nRoot = -1\nNextFree = 0\n\ndef AddNode(value):\n    global Root, NextFree\n    Tree[NextFree] = value\n    new = NextFree\n    NextFree = NextFree + 1\n    if Root == -1:\n        Root = new\n        return\n    current = Root\n    while True:\n        if value < Tree[current]:       # smaller: go left\n            if LeftPointer[current] == -1:\n                LeftPointer[current] = new\n                return\n            current = LeftPointer[current]\n        else:                           # larger or equal: go right\n            if RightPointer[current] == -1:\n                RightPointer[current] = new\n                return\n            current = RightPointer[current]\n\ndef InOrder(node):                      # left, node, right: gives sorted order\n    if node != -1:\n        InOrder(LeftPointer[node])\n        print(Tree[node])\n        InOrder(RightPointer[node])"], ["h3", "Searching"], ["code", "def LinearSearch(arr, target):\n    for i in range(len(arr)):           # range(n) gives 0 to n-1\n        if arr[i] == target:\n            return i\n    return -1                           # not found\n\ndef BinarySearch(arr, target):          # arr must be sorted\n    low = 0\n    high = len(arr) - 1\n    while low <= high:\n        mid = (low + high) // 2         # // is integer division\n        if arr[mid] == target:\n            return mid\n        elif arr[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1"], ["h3", "Sorting"], ["code", "def BubbleSort(arr):\n    n = len(arr)\n    for i in range(n - 1):              # passes\n        for j in range(n - 1 - i):      # compare neighbours; the end is already sorted\n            if arr[j] > arr[j + 1]:\n                temp = arr[j]           # swap using a temporary variable\n                arr[j] = arr[j + 1]\n                arr[j + 1] = temp\n    return arr\n\ndef InsertionSort(arr):\n    for i in range(1, len(arr)):\n        key = arr[i]\n        j = i - 1\n        while j >= 0 and arr[j] > key:  # shift larger items one place right\n            arr[j + 1] = arr[j]\n            j = j - 1\n        arr[j + 1] = key\n    return arr"], ["h3", "Recursion"], ["p", "A recursive function has a **base case** (stops) and a **recursive case** (calls itself with a smaller problem). Every call is pushed on the call stack and they finish in reverse order. If you forget the base case it never stops."], ["code", "def CountDown(n):\n    if n == 0:                          # base case: stops the recursion\n        return 0\n    return n + CountDown(n - 1)         # recursive case: a smaller version of the same problem\n\nprint(CountDown(4))                     # 4+3+2+1+0 = 10"]]}, {"id": "g20", "title": "20. Further programming: classes, files and exceptions", "blocks": [["h3", "Classes and objects"], ["p", "Attributes are **private** (`self.__Name`), so outside code can only use the **get** and **set** methods. A constructor is `__init__`. Creating an object is **instantiation**."], ["code", "class Pet:\n    def __init__(self, name, age):      # constructor\n        self.__Name = name              # private attribute: two underscores\n        self.__Age = age\n\n    def GetName(self):                  # get method returns the attribute\n        return self.__Name\n\n    def SetAge(self, newAge):           # set method takes a parameter\n        self.__Age = newAge\n\n    def Describe(self):\n        return self.__Name + \" is \" + str(self.__Age)\n\np = Pet(\"Rex\", 3)                       # instantiate (create the object)\np.SetAge(4)\nprint(p.Describe())"], ["h3", "Inheritance and polymorphism"], ["p", "A child class takes the attributes and methods of the parent (`class Dog(Pet)`). Call `super().__init__(...)` to run the parent constructor. A child method with the **same name** overrides the parent method, so the same call does different things for different objects (**polymorphism**)."], ["code", "class Pet:\n    def __init__(self, name, age):\n        self.__Name = name\n        self.__Age = age\n    def Speak(self):\n        return \"...\"\n\nclass Dog(Pet):                         # Dog inherits from Pet\n    def __init__(self, name, age, breed):\n        super().__init__(name, age)     # run the parent constructor first\n        self.__Breed = breed            # then the new attribute\n    def Speak(self):                    # same name: overrides the parent method\n        return \"Woof\"\n\nanimals = [Pet(\"Tom\", 2), Dog(\"Rex\", 3, \"Collie\")]\nfor a in animals:\n    print(a.Speak())                    # polymorphism: each object uses its own Speak()"], ["h3", "Reading a text file (with an exception handler)"], ["p", "Open, read line by line, `strip()` the newline, convert with `int()` if you need a number, close. An **exception** is an error at run time (file not found, bad number). `try / except` catches it so the program does not crash."], ["code", "def ReadData(fileName):\n    DataArray = []\n    try:\n        file = open(fileName, \"r\")\n        line = file.readline()\n        while line != \"\":               # readline() returns \"\" at the end of the file\n            DataArray.append(int(line.strip()))   # strip() removes the newline\n            line = file.readline()\n        file.close()                    # always close\n    except FileNotFoundError:\n        print(\"File not found\")\n    return DataArray"], ["h3", "Writing a text file"], ["code", "def WriteData(fileName, DataArray):\n    file = open(fileName, \"w\")          # \"w\" creates or overwrites, \"a\" appends\n    for item in DataArray:\n        file.write(str(item) + \"\\n\")    # write needs a string, and you add the newline\n    file.close()"], ["h3", "Strings"], ["code", "text = \"Hello World\"\nprint(len(text))                # 11\nprint(text[0], text[-1])        # H d   (first and last character)\nprint(text[0:5])                # Hello (start included, end excluded)\nprint(text.upper(), text.lower())\nwords = text.split(\" \")         # ['Hello', 'World']\nprint(text.find(\"World\"))       # 6, or -1 if not found\nprint(\"\".join(reversed(text)))  # dlroW olleH\nprint(ord(\"A\"), chr(66))        # 65 B"]]}, {"id": "g21", "title": "Python slips that cost marks", "blocks": [["tbl", ["Slip", "What happens", "Fix"], [["Assigning to a global inside a function with no `global` line", "UnboundLocalError, or the global never changes (the queue pointers do not move)", "Write `global HeadPointer, TailPointer, NumberItems` as the first line"], ["`range(1, 10)` when you wanted 1 to 10", "The end value is **excluded**", "`range(1, 11)` for 1 to 10; `range(n)` is 0 to n-1"], ["Forgetting `int()` on `input()`", "`input()` always gives a string; `\"5\" + 1` crashes", "`n = int(input(\"Enter a number: \"))`"], ["Missing colon or wrong indentation", "SyntaxError or IndentationError", "Colon after `if`, `else`, `for`, `while`, `def`, `class`; indent the whole body the same amount"], ["`=` where you meant `==`", "A syntax error or an accidental assignment", "`==` compares, `=` assigns"], ["`/` when you need a whole number", "`7 / 2` is 3.5", "`//` for integer division, `%` for the remainder"], ["Not stripping the newline from file lines", "`\"5\\n\"` is not equal to `\"5\"`", "`line.strip()`"], ["Not closing the file", "Lost marks for the close; written data may not be saved", "`file.close()`"], ["Function never `return`s its value", "It gives `None` and the next part fails", "End with `return result`"], ["Pointer or counter updated in the wrong order", "Lost items, or an overwritten pointer (in the linked list, read `Pointer[newNode]` before you change it)", "Write the order of updates on paper first"], ["Array index out of range (off by one)", "IndexError", "A 20-item array has indexes 0 to 19; test the first and last item"]]], ["h3", "The global trap, in code"], ["code", "Count = 0\ndef Add():\n    Count = Count + 1           # WRONG: UnboundLocalError. Python thinks Count is a new local variable\ndef AddOk():\n    global Count                # RIGHT: say you are changing the global\n    Count = Count + 1\nAddOk()\nprint(Count)"]]}, {"id": "g22", "title": "Exam routine", "blocks": [["ul", ["**First 5 minutes:** skim all three questions and the source file names. Do not start with the question you like; start with Question 1 part (a), because the later parts depend on it.", "**For each part:** underline the function name, the parameters, what it returns and what it outputs. Write the skeleton (`def Name(parameters):`) first, then fill each bullet in order.", "**Test as you go.** Run the program after every part. Use the exact test data the question gives. Read your own output against the example in the question.", "**Stuck on a part:** write the structure anyway (the loop, the condition, the return). Method marks are for each thing the code
