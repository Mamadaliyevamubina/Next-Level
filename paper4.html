ack at the incremented TopOfStack and returning integer 1","key_terms":["Stack[TopOfStack]","return 1"]}],"max_note":"max 4","rejects":["Python needs `global` for TopOfStack (and Stack if it is reassigned) - accept if the code works","Accept len(Stack) - 1 instead of the literal 19"],"final_answer":"def Push(Data):                       # function header taking one string parameter\n    global Stack, TopOfStack\n    if TopOfStack == 19:              # check if stack is full ...\n        return -1                     # ... and return -1\n    else:\n        TopOfStack = TopOfStack + 1   # otherwise increment TopOfStack\n        Stack[TopOfStack] = Data      # store parameter at TopOfStack\n        return 1                      # and return 1\n","confidence":"high"},{"id":"s25-42-1c","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"1(c)","marks":4,"chapter":19,"subtopic":"stack","prompt":"The function Pop() returns the next item from the stack.\n\nThe function returns \"-1\" if the stack is empty.\n\nWrite program code for Pop().\n\nWrite your answer in Python.","context_note":"A program reads data from a text file and stores it in a stack. The stack `Stack` is stored as a 1D array of up to 20 elements. The pointer `TopOfStack` stores the index of the last element stored in the stack.\n\nStack and TopOfStack are the global variables from part (a); Push() from part (b) stores items and moves TopOfStack up by one.","answer_type":"code","criteria":[{"point":"Function header (and end where appropriate) and returning a value in all cases","key_terms":["def Pop(","return"]},{"point":"Checking if the stack is empty (TopOfStack is -1) and returning the string \"-1\"","key_terms":["TopOfStack == -1","\"-1\""]},{"point":"(Otherwise) decrementing TopOfStack","key_terms":["TopOfStack -= 1","TopOfStack = TopOfStack - 1"]},{"point":"Returning the element in the stack at TopOfStack, taken before TopOfStack is decremented","key_terms":["Stack[TopOfStack]","ReturnValue"]}],"max_note":"max 4","rejects":["The empty-stack value must be the string \"-1\""],"final_answer":"def Pop():                            # function header, returns a value in all cases\n    global Stack, TopOfStack\n    if TopOfStack == -1:              # check if stack is empty ...\n        return \"-1\"                   # ... and return the string \"-1\"\n    else:\n        ReturnValue = Stack[TopOfStack]   # item at TopOfStack, taken before it is decremented\n        TopOfStack = TopOfStack - 1       # decrement TopOfStack\n        return ReturnValue\n","confidence":"high"},{"id":"s25-42-1d","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"1(d)","marks":6,"chapter":20,"subtopic":"text-file-read","prompt":"The text file StackData.txt stores numbers and mathematical operators. Each number and operator are on a new line in the text file.\n\nThe procedure ReadData():\n\n- takes a string filename as a parameter\n- opens the file and reads in each line of data\n- uses the Push() function to insert each line of data onto the stack\n- outputs \"Stack full\" if any data cannot be stored on the stack because the stack is full\n- uses exception handling when opening and reading from the text file.\n\nThe procedure needs to work for a file that contains an unknown number of lines.\n\nWrite program code for ReadData().\n\nWrite your answer in Python.","context_note":"A program reads data from a text file and stores it in a stack. The stack `Stack` is stored as a 1D array of up to 20 elements. The pointer `TopOfStack` stores the index of the last element stored in the stack.\n\nAlready written (global, you may call them):\n\n```python\nStack = [\"-1\"] * 20      # 20 strings, all \"-1\"\nTopOfStack = -1          # index of last element stored, -1 when empty\n\ndef Push(Data):          # returns -1 if stack full, otherwise stores Data and returns 1\n    ...\ndef Pop():               # returns the top item and moves TopOfStack down; returns \"-1\" if the stack is empty\n    ...\n```\n\nThe mathematical operators used are + (addition), - (subtraction), / (division), * (multiplication) and ^ (power of). The file StackData.txt is supplied in the exam; each number and each operator is on its own line of the text file.","answer_type":"code","criteria":[{"point":"Procedure header taking one (string) parameter","key_terms":["def ReadData(","FileName"]},{"point":"Opening the file using the filename parameter and closing the file in an appropriate place","key_terms":["open(FileName","close()","with open"]},{"point":"Looping through to the end of the file, reading in each line","key_terms":["for Line in","readline","while"]},{"point":"Calling Push() once with each value read in (e.g. with the new line removed)","key_terms":["Push(","strip()"]},{"point":"If the return value from Push() is -1, outputting \"Stack full\"","key_terms":["== -1","print(\"Stack full\")"]},{"point":"Exception handling for opening and reading from the file, with an appropriate except/catch and output","key_terms":["try","except","print"]}],"max_note":"max 6","rejects":["Accept `with open(...)` as the way of closing the file","Accept any valid loop that reads to the end of the file (for line in file, while with readline, readlines)","All file access should be inside the try block"],"final_answer":"def ReadData(FileName):                       # procedure header with one string parameter\n    try:                                      # exception handling for opening and reading\n        File = open(FileName, \"r\")            # open the file using the parameter\n        for Line in File:                     # loop to end of file, reading each line\n            ReturnValue = Push(Line.strip())  # call Push() once with each value\n            if ReturnValue == -1:             # Push() returned -1 ...\n                print(\"Stack full\")           # ... output \"Stack full\"\n        File.close()                          # close the file\n    except IOError:                           # catch with appropriate output\n        print(\"Cannot open or read file\")\n","confidence":"high"},{"id":"s25-42-1e","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"1(e)","marks":7,"chapter":19,"subtopic":"stack","prompt":"The values stored in the stack are used to perform mathematical operations.\n\nA total is initialised to the first value in the stack. The first value in the stack will always be a number.\n\nThe next value will be a mathematical operator and the next value will be the number to apply to the calculation. This is repeated until there are no values left in the stack. There will always be a number following a mathematical operator.\n\nFor example, the contents of a stack are (top of stack first):\n\n```\n10   <- TopOfStack\n+\n3\n-\n2\n```\n\n- The total is initialised to the first value in the stack: 10, so total = 10\n- The next two values are: + 3, so total = 10 + 3 = 13\n- The next two values are: - 2, so total = 13 - 2 = 11\n\nThe final total is 11 and this is returned.\n\nWrite program code for the function Calculate() to:\n\n- take each value from the stack\n- calculate and return the final total.\n\nWrite your answer in Python.","context_note":"A program reads data from a text file and stores it in a stack. The stack `Stack` is stored as a 1D array of up to 20 elements. The pointer `TopOfStack` stores the index of the last element stored in the stack.\n\nAlready written (global, you may call them):\n\n```python\nStack = [\"-1\"] * 20      # 20 strings, all \"-1\"\nTopOfStack = -1          # index of last element stored, -1 when empty\n\ndef Push(Data):          # returns -1 if stack full, otherwise stores Data and returns 1\n    ...\ndef Pop():               # returns the top item and moves TopOfStack down; returns \"-1\" if the stack is empty\n    ...\n```\n\nOperators used: + (addition), - (subtraction), / (division), * (multiplication), ^ (power of). Every value in the stack is a string. Pop() returns the string \"-1\" when the stack is empty.","answer_type":"code","criteria":[{"point":"Calculate() function header (and end where appropriate)","key_terms":["def Calculate("]},{"point":"Looping until the stack is empty","key_terms":["while","\"-1\"","TopOfStack"]},{"point":"Calling Pop() repeatedly within the loop and storing/using the return value","key_terms":["Pop()"]},{"point":"Working out if the value returned by Pop() is an operator or a number / alternating between operator and number","key_terms":["Operator","flag","isdigit","in \"+"]},{"point":"Selecting which operator it is (+, -, /, * or ^) and attempting the matching calculation","key_terms":["if","elif","\"+\"","\"-\"","\"*\"","\"/\"","\"^\""]},{"point":"Performing the correct calculation using the operator and the number (converted from string to a number; ^ as ** or pow)","key_terms":["int(","**","pow(","Total +","Total -"]},{"point":"Updating the total from previous loops and returning this final value","key_terms":["Total =","return Total"]}],"max_note":"1 mark each, max 7","rejects":["Accept any valid way of alternating between operator and number (a flag variable, or popping two values per loop)","The numbers must be converted from strings before calculating","Python ^ is bitwise XOR; power must be ** or pow()"],"final_answer":"def Calculate():                      # function header\n    Total = int(Pop())                # first value in the stack is the starting total\n    Operator = Pop()                  # call Pop() repeatedly, storing the return value\n    while Operator != \"-1\":           # loop until the stack is empty\n        Number = int(Pop())           # alternate: operator first, then the number to apply\n        if Operator == \"+\":           # select the matching operator ...\n            Total = Total + Number    # ... and do the correct calculation\n        elif Operator == \"-\":\n            Total = Total - Number\n        elif Operator == \"*\":\n            Total = Total * Number\n        elif Operator == \"/\":\n            Total = Total / Number\n        elif Operator == \"^\":\n            Total = Total ** Number\n        Operator = Pop()              # next operator (or \"-1\" if nothing left)\n    return Total                      # return the final total (updated in each loop)\n","confidence":"high"},{"id":"s25-42-1fi","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"1(f)(i)","marks":2,"chapter":19,"subtopic":"main-program","prompt":"Write program code to extend the main program to:\n\n- take a filename as input from the user\n- call ReadData() with the input filename\n- call Calculate()\n- output the final total.\n\nWrite your answer in Python.","context_note":"A program reads data from a text file and stores it in a stack. The stack `Stack` is stored as a 1D array of up to 20 elements. The pointer `TopOfStack` stores the index of the last element stored in the stack.\n\nAlready written: `ReadData(FileName)` reads the file and pushes each line on to the stack; `Calculate()` takes the values from the stack and returns the final total.","answer_type":"code","criteria":[{"point":"Taking a filename as input and calling ReadData() with the input","key_terms":["input(","ReadData("]},{"point":"Calling Calculate() and outputting the return value","key_terms":["Calculate()","print("]}],"max_note":"max 2","rejects":["Accept any prompt text for the input"],"final_answer":"FileName = input(\"Enter the filename: \")   # take a filename as input and call ReadData() with it\nReadData(FileName)\nTotal = Calculate()                        # call Calculate() ...\nprint(Total)                               # ... and output the final total\n","confidence":"high"},{"id":"s25-42-2a","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"2(a)","marks":2,"chapter":20,"subtopic":"record-type","prompt":"The pseudocode record format is:\n\n```\nTYPE NewRecord\n   DECLARE Key : INTEGER\n   DECLARE Item1 : INTEGER\n   DECLARE Item2 : INTEGER\nENDTYPE\n```\n\nWrite program code to declare the record type NewRecord.\n\nIf your chosen programming language does not support record formats, a class can be used instead.\n\nWrite your answer in Python.","context_note":"A program stores data in a 1D array of records, `HashTable`. The array has space for 200 records. Each data item is stored in a specific index of the array that is calculated using an algorithm. The index is calculated from the key field using the formula: Key MOD 200\n\nIf two key fields generate the same index, there is a collision. Any records that have a collision are stored in a second array, `Spare`. This array has space for 100 records. When a collision is detected, the record is stored in the next free space in `Spare`.","answer_type":"code","criteria":[{"point":"Record/class NewRecord declared","key_terms":["class NewRecord","NewRecord"]},{"point":"3 variables within the structure (Key, Item1, Item2), all integer","key_terms":["Key","Item1","Item2","#integer","int"]}],"max_note":"max 2","rejects":["A class with a constructor taking the three values is the normal Python way; the scheme sample also adds GetKey(), GetItem1() and GetItem2()","Attribute declarations by comment (# integer) are accepted for the data types"],"final_answer":"class NewRecord:                       # record/class NewRecord declared\n    def __init__(self, pKey, pItem1, pItem2):\n        self.__Key = pKey          # integer\n        self.__Item1 = pItem1      # integer\n        self.__Item2 = pItem2      # integer\n    def GetKey(self):\n        return self.__Key\n    def GetItem1(self):\n        return self.__Item1\n    def GetItem2(self):\n        return self.__Item2\n","confidence":"high"},{"id":"s25-42-2bii","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"2(b)(ii)","marks":2,"chapter":19,"subtopic":"array-1d","prompt":"An empty record has the integer -1 stored in each field.\n\nThe procedure Initialise() stores an empty record in each element in HashTable and Spare.\n\nWrite program code for Initialise().\n\nWrite your answer in Python.","context_note":"A program stores data in a 1D array of records, `HashTable`. The array has space for 200 records. Each data item is stored in a specific index of the array that is calculated using an algorithm. The index is calculated from the key field using the formula: Key MOD 200\n\nIf two key fields generate the same index, there is a collision. Any records that have a collision are stored in a second array, `Spare`. This array has space for 100 records. When a collision is detected, the record is stored in the next free space in `Spare`.\n\nThe record type is available as a class (from part (a)):\n\n```python\nclass NewRecord:\n    def __init__(self, pKey, pItem1, pItem2): ...   # fields Key, Item1, Item2 (all integers)\n    def GetKey(self): ...                            # also GetItem1(), GetItem2()\n```\n\nThe two global arrays are declared like this (part (b)(i)):\n\n```python\nHashTable = []   # will hold 200 NewRecord objects\nSpare = []       # will hold 100 NewRecord objects\n```","answer_type":"code","criteria":[{"point":"Procedure Initialise() header (and end where appropriate) that initialises all elements in both arrays (200 in HashTable, 100 in Spare) ...","key_terms":["def Initialise(","range(200)","range(100)","append"]},{"point":"... to an empty record with -1 in each of the 3 fields","key_terms":["NewRecord(-1, -1, -1)","-1,-1,-1","-1"]}],"max_note":"max 2","rejects":["Accept any valid way of filling the lists (append in a loop, list comprehension, multiplication)"],"final_answer":"def Initialise():\n    global HashTable, Spare\n    for X in range(200):\n        HashTable.append(NewRecord(-1, -1, -1))\n    for X in range(100):\n        Spare.append(NewRecord(-1, -1, -1))\n","confidence":"high"},{"id":"s25-42-2c","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"2(c)","marks":2,"chapter":19,"subtopic":"other","prompt":"The hash value is calculated from the key field using the formula: Key MOD 200\n\nThe function CalculateHash() takes a key field as a parameter and calculates and returns the hash value for the key field.\n\nWrite program code for CalculateHash().\n\nWrite your answer in Python.","context_note":"A program stores data in a 1D array of records, `HashTable`. The array has space for 200 records. Each data item is stored in a specific index of the array that is calculated using an algorithm. The index is calculated from the key field using the formula: Key MOD 200\n\nIf two key fields generate the same index, there is a collision. Any records that have a collision are stored in a second array, `Spare`. This array has space for 100 records. When a collision is detected, the record is stored in the next free space in `Spare`.","answer_type":"code","criteria":[{"point":"Function header (and close where appropriate), taking one (integer) parameter and returning the calculated value","key_terms":["def CalculateHash(","return"]},{"point":"Calculation of parameter MOD 200","key_terms":["% 200"]}],"max_note":"max 2","rejects":["MOD is % in Python; accept any equivalent calculation giving the same result"],"final_answer":"def CalculateHash(Key):     # function header with one integer parameter, returns the value\n    return Key % 200        # Key MOD 200\n","confidence":"high"},{"id":"s25-42-2d","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"2(d)","marks":6,"chapter":19,"subtopic":"array-1d","prompt":"The procedure InsertIntoHash():\n\n- takes a record of type NewRecord as a parameter\n- uses CalculateHash() to calculate the hash value for the key field in the record\n- checks if the hash value index in HashTable currently stores an empty record\n  - if the index stores an empty record, store the parameter in this index\n  - if the index does not store an empty record, store the parameter in Spare\n\nYou can assume there will always be enough space in Spare to store any collisions.\n\nWrite program code for InsertIntoHash().\n\nWrite your answer in Python.","context_note":"A program stores data in a 1D array of records, `HashTable`. The array has space for 200 records. Each data item is stored in a specific index of the array that is calculated using an algorithm. The index is calculated from the key field using the formula: Key MOD 200\n\nIf two key fields generate the same index, there is a collision. Any records that have a collision are stored in a second array, `Spare`. This array has space for 100 records. When a collision is detected, the record is stored in the next free space in `Spare`.\n\nThe record type is available as a class (from part (a)):\n\n```python\nclass NewRecord:\n    def __init__(self, pKey, pItem1, pItem2): ...   # fields Key, Item1, Item2 (all integers)\n    def GetKey(self): ...                            # also GetItem1(), GetItem2()\n```\n\nAlready written (global): `HashTable` (200 records) and `Spare` (100 records), every element initially an empty record with -1 in all three fields (set up by `Initialise()`), and `CalculateHash(Key)` which returns Key MOD 200.","answer_type":"code","criteria":[{"point":"Procedure header (and end where appropriate) taking one record as a parameter","key_terms":["def InsertIntoHash("]},{"point":"Calling CalculateHash() with the key from the parameter record and storing/using the return value","key_terms":["CalculateHash(","GetKey()"]},{"point":"Checking if HashTable at the index returned by CalculateHash() is an empty record (key -1) ...","key_terms":["HashTable[","== -1"]},{"point":"... if it is empty, storing the parameter in that location","key_terms":["HashTable[HashValue] = "]},{"point":"... otherwise, locating the next free space in Spare ...","key_terms":["Spare[","== -1","for","while"]},{"point":"... and storing the record in that index only (not in all the free spaces)","key_terms":["Spare[X] =","break"]}],"max_note":"max 6","rejects":["The record must be stored in ONE free Spare position only: a loop that fills every free space (no break/exit) does not earn the last mark","Accept a Spare index counter that moves on by one each time instead of searching for a free element"],"final_answer":"def InsertIntoHash(TheRecord):                          # header taking one record parameter\n    global HashTable, Spare\n    HashValue = CalculateHash(TheRecord.GetKey())       # call CalculateHash() with the key and store the result\n    if HashTable[HashValue].GetKey() == -1:             # is the HashTable location an empty record?\n        HashTable[HashValue] = TheRecord                # if empty, store the parameter there\n    else:\n        for X in range(100):                            # otherwise find the next free space in Spare ...\n            if Spare[X].GetKey() == -1:\n                Spare[X] = TheRecord                    # ... and store it in that index only\n                break\n","confidence":"high"},{"id":"s25-42-2e","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"2(e)","marks":5,"chapter":20,"subtopic":"text-file-read","prompt":"The text file HashData.txt stores up to 200 rows of data to be stored into the hash table. Each row contains three integer numbers separated by commas.\n\nThe first number is the key field, the second number is item 1 and the third number is item 2.\n\nFor example: the first row in the text file contains: 646, 12, 568. The key field is 646, item 1 is 12 and item 2 is 568.\n\nThe procedure CreateHashTable():\n\n- opens the file HashData.txt\n- creates a record for each row of data in the file\n- calls InsertIntoHash() with each record.\n\nWrite program code for CreateHashTable().\n\nWrite your answer in Python.","context_note":"A program stores data in a 1D array of records, `HashTable`. The array has space for 200 records. Each data item is stored in a specific index of the array that is calculated using an algorithm. The index is calculated from the key field using the formula: Key MOD 200\n\nIf two key fields generate the same index, there is a collision. Any records that have a collision are stored in a second array, `Spare`. This array has space for 100 records. When a collision is detected, the record is stored in the next free space in `Spare`.\n\nThe record type is available as a class (from part (a)):\n\n```python\nclass NewRecord:\n    def __init__(self, pKey, pItem1, pItem2): ...   # fields Key, Item1, Item2 (all integers)\n    def GetKey(self): ...                            # also GetItem1(), GetItem2()\n```\n\nAlready written: `InsertIntoHash(TheRecord)` stores a NewRecord in HashTable (or in Spare after a collision). The file HashData.txt is supplied in the exam.","answer_type":"code","criteria":[{"point":"Procedure header (and end where appropriate), opening and closing the file HashData.txt","key_terms":["def CreateHashTable(","open(\"HashData.txt\"","close()"]},{"point":"Reading in all lines of data ...","key_terms":["for Line in","readline","readlines"]},{"point":"... splitting each line by commas","key_terms":["split(\",\"","split(',"]},{"point":"Creating a record with the correct values (converted to integers) for each line read in","key_terms":["NewRecord(","int("]},{"point":"Calling InsertIntoHash() with each record created","key_terms":["InsertIntoHash("]},{"point":"Exception handling for opening and reading from the file, with an appropriate catch and output","key_terms":["try","except","print"]}],"max_note":"1 mark each, max 5","rejects":["Six mark points are listed in the scheme but the part is capped at 5 marks","Accept `with open(...)` instead of an explicit close()"],"final_answer":"def CreateHashTable():                                   # procedure header\n    try:                                                 # exception handling for file access\n        File = open(\"HashData.txt\", \"r\")                 # open the file\n        for Line in File:                                # read in all lines of data\n            Data = Line.strip().split(\",\")               # split each line by commas\n            NewOne = NewRecord(int(Data[0]), int(Data[1]), int(Data[2]))   # create a record with the three values\n            InsertIntoHash(NewOne)                       # call InsertIntoHash() with each record\n        File.close()                                     # close the file\n    except IOError:                                      # catch with appropriate output\n        print(\"Cannot open or read file\")\n","confidence":"high"},{"id":"s25-42-2fi","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"2(f)(i)","marks":2,"chapter":19,"subtopic":"array-1d","prompt":"The procedure PrintSpare() outputs the key field of each element in the array Spare that does not contain an empty record.\n\nWrite program code for PrintSpare().\n\nWrite your answer in Python.","context_note":"A program stores data in a 1D array of records, `HashTable`. The array has space for 200 records. Each data item is stored in a specific index of the array that is calculated using an algorithm. The index is calculated from the key field using the formula: Key MOD 200\n\nIf two key fields generate the same index, there is a collision. Any records that have a collision are stored in a second array, `Spare`. This array has space for 100 records. When a collision is detected, the record is stored in the next free space in `Spare`.\n\nThe record type is available as a class (from part (a)):\n\n```python\nclass NewRecord:\n    def __init__(self, pKey, pItem1, pItem2): ...   # fields Key, Item1, Item2 (all integers)\n    def GetKey(self): ...                            # also GetItem1(), GetItem2()\n```\n\n`Spare` is a global array of 100 NewRecord objects. An empty record has -1 stored in each field.","answer_type":"code","criteria":[{"point":"Procedure header (and end where appropriate) and looping through each element in Spare ...","key_terms":["def PrintSpare(","for","while","range(100)"]},{"point":"... checking if the record is empty and outputting the key field if it is not empty","key_terms":["GetKey()","!= -1","print("]}],"max_note":"max 2","rejects":["Accept stopping at the first empty record (the scheme sample does this) or checking every element"],"final_answer":"def PrintSpare():                           # procedure header\n    global Spare\n    for X in range(100):                    # loop through each element in Spare\n        if Spare[X].GetKey() != -1:         # check it is not an empty record ...\n            print(Spare[X].GetKey())        # ... and output its key field\n","confidence":"high"},{"id":"s25-42-3ai","session":"s25","variant":"42","paper_code":"9618/42 May/June 2025","q":"3(a)(i)","marks":4,"chapter":20,"subtopic":"class-definition","prompt":"Write program code to declare the class Animal and its constructor.\n\nDo not declare the other methods.\n\nUse your programming language appropriate constructor.\n\nIf you are writing in Python, include attribute declarations using comments.\n\nWrite your answer in Python.","context_note":"A program stores data about animals using Object-Oriented Programming (OOP).\n\nThe class `Animal` stores the data about animals:\n\n| Animal | |\n|---|---|\n| Name : String | stores the name of the animal |\n| Sound : String | stores the sound the animal makes |\n| Size : Integer | stores the size of the animal as an integer between 1 (smallest) and 10 (largest) |\n| Intelligence : Integer | stores the intelligence of the animal as an integer between 1 (least) and 10 (most) |\n| Constructor() | initialises all attributes to its parameter values |\n| Description() | returns a string message that contains the data from the attributes |","answer_type":"code","criteria":[{"point":"Class header (and end when appropriate)","key_terms":["class Animal"]},{"point":"Four attributes (Name, Sound, Size, Inte is correct)","key_terms":["Queue[TailPointer","Queue[TailPointer + 1]"]},{"point":"Incrementing TailPointer","key_terms":["TailPointer += 1","TailPointer = TailPointer + 1"]},{"point":"Checking if this is the first element and incrementing/storing 0 in HeadPointer","key_terms":["HeadPointer == -1","HeadPointer = 0"]}],"max_note":"max 6","rejects":["Python needs `global` for the pointers","The queue is a linear queue (not circular): it is full when TailPointer reaches the last index (49)"],"final_answer":"def Enqueue(Data):                    # function header taking one integer parameter\n    global Queue, HeadPointer, TailPointer\n    if TailPointer == 49:             # check if the queue is full ...\n        return False                  # ... return False if full\n    else:\n        TailPointer = TailPointer + 1 # increment TailPointer\n        Queue[TailPointer] = Data     # store the item at TailPointer + 1 (the new tail position)\n        if HeadPointer == -1:         # first element in the queue?\n            HeadPointer = 0           # set HeadPointer to 0\n        return True                   # return True if stored\n","confidence":"high"},{"id":"s25-43-1c","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"1(c)","marks":5,"chapter":19,"subtopic":"queue","prompt":"The function Dequeue():\n\n- returns the next item in the queue, if the queue is not empty\n- returns -1 if the queue is empty\n- updates the pointers where appropriate.\n\nWrite program code for Dequeue().\n\nWrite your answer in Python.","context_note":"A program reads data from a text file and stores it in a queue. The linear queue `Queue` is stored as a 1D array of up to 50 elements. The queue has the following pointers:\n\n- `HeadPointer` - stores the index of the first element in the queue, initialised to -1\n- `TailPointer` - stores the index of the last element in the queue, initialised to -1\n\nAlready written (global):\n\n```python\nQueue = [-1] * 50      # 50 integers, all -1 (empty)\nHeadPointer = -1       # index of the first element, -1 when the queue is empty\nTailPointer = -1       # index of the last element, -1 when the queue is empty\n```\n\nEnqueue() (already written) adds an item at TailPointer + 1 and sets HeadPointer to 0 when the first item is added.","answer_type":"code","criteria":[{"point":"Function Dequeue() header (and close) and returning an appropriate value in all cases","key_terms":["def Dequeue(","return"]},{"point":"Checking if the queue is empty ...","key_terms":["HeadPointer == -1","HeadPointer > TailPointer"]},{"point":"... and returning -1 if empty","key_terms":["return -1"]},{"point":"Accessing and returning the element at Queue[HeadPointer] (before HeadPointer is incremented)","key_terms":["Queue[HeadPointer]"]},{"point":"Incrementing HeadPointer","key_terms":["HeadPointer += 1","HeadPointer = HeadPointer + 1"]}],"max_note":"max 5","rejects":["An empty queue includes the case where every item has already been removed (HeadPointer has passed TailPointer), not just the start-up state"],"final_answer":"def Dequeue():                                            # function header, returns a value in all cases\n    global Queue, HeadPointer, TailPointer\n    if HeadPointer == -1 or HeadPointer > TailPointer:    # check if the queue is empty ...\n        return -1                                         # ... and return -1\n    else:\n        ReturnValue = Queue[HeadPointer]                  # access the element at HeadPointer before it is incremented\n        HeadPointer = HeadPointer + 1                     # increment HeadPointer\n        return ReturnValue\n","confidence":"high"},{"id":"s25-43-1d","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"1(d)","marks":6,"chapter":20,"subtopic":"text-file-read","prompt":"The text file QueueData.txt stores positive integers. Each integer is on a new line in the file.\n\nThe procedure CreateQueue():\n\n- opens the file QueueData.txt\n- reads in each line from the text file and uses Enqueue() to insert each line into the queue\n- outputs \"Queue full\" if any item cannot be inserted into the queue\n- uses exception handling when opening and reading from the text file.\n\nThe procedure needs to work for a file that contains an unknown number of lines.\n\nWrite program code for CreateQueue().\n\nWrite your answer in Python.","context_note":"A program reads data from a text file and stores it in a queue. The linear queue `Queue` is stored as a 1D array of up to 50 elements. The queue has the following pointers:\n\n- `HeadPointer` - stores the index of the first element in the queue, initialised to -1\n- `TailPointer` - stores the index of the last element in the queue, initialised to -1\n\nAlready written (global):\n\n```python\nQueue = [-1] * 50      # 50 integers, all -1 (empty)\nHeadPointer = -1       # index of the first element, -1 when the queue is empty\nTailPointer = -1       # index of the last element, -1 when the queue is empty\n```\n\nAlready written: `Enqueue(Data)` takes an integer, returns True if it was stored and False if the queue is full. The file QueueData.txt is supplied in the exam: it holds positive integers, one per line.","answer_type":"code","criteria":[{"point":"CreateQueue() header (and end), opening the file QueueData.txt to read, and closing the file in an appropriate place","key_terms":["def CreateQueue(","open(\"QueueData.txt\"","close()","with open"]},{"point":"Looping until the end of the file","key_terms":["for Line in","while","readline"]},{"point":"Reading in each/all lines (converting to integer and removing the new line)","key_terms":["int(","strip()"]},{"point":"... calling Enqueue() once with each value ...","key_terms":["Enqueue("]},{"point":"... checking the return value and outputting \"Queue full\" if full (can output once or many times)","key_terms":["== False","not ","print(\"Queue full\")"]},{"point":"Exception handling (try/except) with appropriate outpu eateQueue()` reads QueueData.txt and enqueues each integer; `Dequeue()` returns the next item in the queue, or -1 when the queue is empty. All the integers in the file are positive.","answer_type":"code","criteria":[{"point":"Calling CreateQueue()","key_terms":["CreateQueue()"]},{"point":"Calling Dequeue() and storing/using the return value ...","key_terms":["Dequeue()"]},{"point":"... repeatedly until the return value is -1","key_terms":["while","!= -1","> -1"]},{"point":"... adding together all the return values to create a total within the loop ...","key_terms":["Total","+"]},{"point":"... outputting the total","key_terms":["print("]}],"max_note":"max 5","rejects":["Do not add the final -1 to the total","Accept any valid loop structure that stops when Dequeue() returns -1"],"final_answer":"CreateQueue()                              # call CreateQueue()\nTotal = 0\nReturnValue = Dequeue()                    # call Dequeue(), storing/using the return value\nwhile ReturnValue != -1:                   # repeat until the return value is -1\n    Total = Total + ReturnValue            # add all return values together within the loop\n    ReturnValue = Dequeue()\nprint(\"The total is\", Total)               # output the total\n","confidence":"high"},{"id":"s25-43-2b","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"2(b)","marks":5,"chapter":19,"subtopic":"insertion-sort","prompt":"The function InsertionSort() takes an array of integers as a parameter. The function sorts the data in the array into ascending numerical order using an insertion sort. The function returns the sorted array.\n\nWrite program code for InsertionSort().\n\nYou must not use any inbuilt sorting functions for your programming language.\n\nWrite your answer in Python.","context_note":"A program sorts the data in the 1D array `DataArray` and searches `DataArray` for specific values.\n\n`DataArray` stores 14 integer values and is declared local to the main program.\n\n`DataArray` holds these 14 values in this order: `0 3 4 56 67 44 43 32 31 345 45 6 54 1`","answer_type":"code","criteria":[{"point":"InsertionSort() header (and close) taking an array as a parameter and returning the (attempt at a) sorted array","key_terms":["def InsertionSort(","return"]},{"point":"Looping through / for each element","key_terms":["for","range(1"]},{"point":"Extracting an element and comparing it to the sorted list ...","key_terms":["CurrentValue","key","<",">"]},{"point":"... moving elements in the sorted list along","key_terms":["DataArray[Y + 1] = DataArray[Y]","[j+1] = ","while"]},{"point":"... and inserting the element in the correct position (ascending order)","key_terms":["DataArray[Y + 1] = CurrentValue","insert("]}],"max_note":"max 5","rejects":["No inbuilt sorting (sort(), sorted()) may be used","Must be an insertion sort, not a bubble sort"],"final_answer":"def InsertionSort(DataArray):                       # header taking an array, returns the array\n    for X in range(1, len(DataArray)):              # loop through each element\n        CurrentValue = DataArray[X]                 # extract the element to insert\n        Y = X - 1\n        while Y >= 0 and CurrentValue < DataArray[Y]:   # compare with the sorted part ...\n            DataArray[Y + 1] = DataArray[Y]         # ... moving larger elements along\n            Y = Y - 1\n        DataArray[Y + 1] = CurrentValue             # insert in the correct position (ascending)\n    return DataArray                                # return the sorted array\n","confidence":"high"},{"id":"s25-43-2c","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"2(c)","marks":2,"chapter":19,"subtopic":"array-1d","prompt":"The procedure OutputArray() takes an array of integers as a parameter. The procedure outputs each element in the array from the first element to the last element. The output is on one line with a space between each number.\n\nAn example output is:\n\n`0 3 4 56 67 44 43 32 31 345 45 6 54 1`\n\nWrite program code for OutputArray().\n\nWrite your answer in Python.","context_note":"A program sorts the data in the 1D array `DataArray` and searches `DataArray` for specific values.\n\n`DataArray` stores 14 integer values and is declared local to the main program.\n\n`DataArray` holds these 14 values in this order: `0 3 4 56 67 44 43 32 31 345 45 6 54 1`","answer_type":"code","criteria":[{"point":"OutputArray() header (and close) taking an array parameter and outputting the array contents ...","key_terms":["def OutputArray(","print(","for"]},{"point":"... in the correct format (one line, space between each number)","key_terms":["\" \"","end=","join"]}],"max_note":"max 2","rejects":["A trailing space at the end of the line is acceptable (the scheme sample leaves one)","Accept print(*DataArray) or \" \".join(...) with str() conversion"],"final_answer":"def OutputArray(DataArray):                 # header taking an array parameter\n    Output = \"\"\n    for Item in DataArray:                  # output every element from first to last ...\n        Output = Output + str(Item) + \" \"   # ... on one line with a space between each number\n    print(Output)\n","confidence":"high"},{"id":"s25-43-2di","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"2(d)(i)","marks":2,"chapter":19,"subtopic":"main-program","prompt":"The main program needs extending to:\n\n- output the content of the unsorted array using OutputArray()\n- sort the array using InsertionSort()\n- output the content of the sorted array using OutputArray()\n\nWrite program code to extend the main program.\n\nWrite your answer in Python.","context_note":"A program sorts the data in the 1D array `DataArray` and searches `DataArray` for specific values.\n\n`DataArray` stores 14 integer values and is declared local to the main program.\n\n`DataArray` holds these 14 values in this order: `0 3 4 56 67 44 43 32 31 345 45 6 54 1`\n\nAlready written: `DataArray` (the 14 integers), `InsertionSort(DataArray)` which returns the sorted array, and `OutputArray(DataArray)` which prints the array on one line.","answer_type":"code","criteria":[{"point":"Calling InsertionSort() with the array as the parameter and storing/using the returned array","key_terms":["InsertionSort(","DataArray ="]},{"point":"... calling OutputArray() with the array before and after the sort","key_terms":["OutputArray("]}],"max_note":"max 2","rejects":["OutputArray() must be called twice: once before and once after InsertionSort()"],"final_answer":"OutputArray(DataArray)                     # output the unsorted array\nDataArray = InsertionSort(DataArray)       # call InsertionSort() with the array and store the returned array\nOutputArray(DataArray)                     # output the sorted array\n","confidence":"high"},{"id":"s25-43-2e","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"2(e)","marks":6,"chapter":19,"subtopic":"binary-search","prompt":"The function Search() performs a binary search to find ItemToFind in DataArray.\n\nThe function takes two parameters:\n\n- DataArray, an array of integers\n- ItemToFind, an integer to find in DataArray\n\nThe function returns:\n\n- the index of ItemToFind if it is in DataArray\n- -1 if ItemToFind is not in DataArray\n\nWrite program code for Search().\n\nYou must not use any inbuilt searching functions for your programming language.\n\nWrite your answer in Python.","context_note":"A program sorts the data in the 1D array `DataArray` and searches `DataArray` for specific values.\n\n`DataArray` stores 14 integer values and is declared local to the main program.\n\nDataArray is already sorted into ascending order before Search() is called.","answer_type":"code","criteria":[{"point":"Search() header (and close) taking an array and an integer as parameters","key_terms":["def Search("]},{"point":"Looping (or recursive calls) until no elements are left (Low <= High), and returning -1 if not found","key_terms":["while Low <= High","return -1","Low","High"]},{"point":"... calculating the middle index and accessing this value","key_terms":["(Low + High) // 2","// 2","Middle","mid"]},{"point":"... comparing the array value at the middle index to the integer parameter","key_terms":["DataArray[Middle]","==","<",">"]},{"point":"... if they are equal, returning the middle index","key_terms":["return Middle","return mid"]},{"point":"... if array[mid] < parameter, updating low to middle + 1; if array[mid] > parameter, updating high to middle - 1 (or the equivalent recursive call with the updated low/high)","key_terms":["Low = Middle + 1","High = Middle - 1"]}],"max_note":"max 6","rejects":["No inbuilt searching (index(), in, bisect) may be used","Accept an iterative or a recursive binary search","Integer division must be used for the middle index (// in Python)"],"final_answer":"def Search(DataArray, ItemToFind):                # header taking the array and the item\n    Low = 0\n    High = len(DataArray) - 1\n    while Low <= High:                            # loop until no elements left (Low > High)\n        Middle = (Low + High) // 2                # calculate the middle index\n        if DataArray[Middle] == ItemToFind:       # compare the middle value to the item ...\n            return Middle                         # ... if equal return the index\n        elif DataArray[Middle] < ItemToFind:\n            Low = Middle + 1                      # item is above: Low = Middle + 1\n        else:\n            High = Middle - 1                     # item is below: High = Middle - 1\n    return -1                                     # not found\n","confidence":"high"},{"id":"s25-43-2fi","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"2(f)(i)","marks":2,"chapter":19,"subtopic":"binary-search","prompt":"The main program needs extending to call Search() with the sorted array four times:\n\n- the first time to find the index of the integer 0\n- the second time to find the index of the integer 345\n- the third time to find the index of the integer 67\n- the fourth time to find the index of the integer 2\n\nIf the integer is found in the array, output an appropriate message that includes the index.\n\nIf the integer is not found, output that it was not found.\n\nWrite program code to extend the main program.\n\nWrite your answer in Python.","context_note":"A program sorts the data in the 1D array `DataArray` and searches `DataArray` for specific values.\n\n`DataArray` stores 14 integer values and is declared local to the main program.\n\nAlready written: `DataArray` (sorted, ascending) and `Search(DataArray, ItemToFind)`, which returns the index of ItemToFind or -1 if it is not in the array.","answer_type":"code","criteria":[{"point":"Calling Search() with all four values: 0, 345, 67 and 2","key_terms":["Search(DataArray, 0)","Search(DataArray, 345)","Search(DataArray, 67)","Search(DataArray, 2)"]},{"point":"... outputting \"not found\" or the index in an appropriate message each time","key_terms":["== -1","print(","not found"]}],"max_note":"max 2","rejects":["Accept a loop over a list of the four values instead of four separate calls","The message for a found value must include the index"],"final_answer":"Location = Search(DataArray, 0)                  # call Search() with each of the four values: 0, 345, 67, 2\nif Location == -1:\n    print(\"Data not found\")                      # output not found ...\nelse:\n    print(\"Data found at\", Location)             # ... or a message including the index\nLocation = Search(DataArray, 345)\nif Location == -1:\n    print(\"Data not found\")\nelse:\n    print(\"Data found at\", Location)\nLocation = Search(DataArray, 67)\nif Location == -1:\n    print(\"Data not found\")\nelse:\n    print(\"Data found at\", Location)\nLocation = Search(DataArray, 2)\nif Location == -1:\n    print(\"Data not found\")\nelse:\n    print(\"Data found at\", Location)\n","confidence":"high"},{"id":"s25 )(i)","marks":2,"chapter":20,"subtopic":"linked-list","prompt":"Write program code to declare the class LinkedList and its constructor.\n\nDo not declare the other methods.\n\nUse your programming language appropriate constructor.\n\nIf you are writing in Python, include attribute declarations using comments.\n\nWrite your answer in Python.","context_note":"A program stores data in a linked list that is designed using Object-Oriented Programming (OOP).\n\nThe class `LinkedList` stores the linked list:\n\n| LinkedList | |\n|---|---|\n| HeadNode : Node | stores the first node in the linked list |\n| Constructor() | initialises HeadNode to a null value |\n| InsertNode() | creates a new node using its integer parameter. Sets this node as the new head node and updates NextNode |\n| RemoveNode() | finds the first node that contains its integer parameter and removes this node from the linked list |\n| Traverse() | concatenates and returns the integer data in each node in the linked list |\n\nThe class Node (with GetData(), GetNextNode() and SetNextNode()) has already been written.","answer_type":"code","criteria":[{"point":"Class LinkedList header (and close) and constructor header with no parameter (other than self) ...","key_terms":["class LinkedList","def __init__(self)"]},{"point":"... declaring HeadNode as type Node (Python: comment) and storing a null value (None) in it in the constructor","key_terms":["HeadNode","None","#"]}],"max_note":"max 2","rejects":["Public or private HeadNode accepted"],"final_answer":"class LinkedList:                     # class header and constructor header with no parameter (other than self)\n    def __init__(self):\n        self.__HeadNode = None        # Node - HeadNode set to null (None) in the constructor\n","confidence":"high"},{"id":"s25-43-3bii","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"3(b)(ii)","marks":4,"chapter":20,"subtopic":"linked-list","prompt":"The method InsertNode():\n\n- takes an integer as a parameter\n- creates a new node with the parameter as the integer data\n- uses the new node's method SetNextNode() to store the current HeadNode as the next node\n- replaces HeadNode with the current node.\n\nWrite program code for InsertNode().\n\nWrite your answer in Python.","context_note":"A program stores data in a linked list that is designed using Object-Oriented Programming (OOP).\n\nThe class `LinkedList` stores the linked list:\n\n| LinkedList | |\n|---|---|\n| HeadNode : Node | stores the first node in the linked list |\n| Constructor() | initialises HeadNode to a null value |\n| InsertNode() | creates a new node using its integer parameter. Sets this node as the new head node and updates NextNode |\n| RemoveNode() | finds the first node that contains its integer parameter and removes this node from the linked list |\n| Traverse() | concatenates and returns the integer data in each node in the linked list |\n\nAlready written:\n\n```python\nclass Node:      # Node(NodeData); methods GetData(), GetNextNode(), SetNextNode(pNextNode)\nclass LinkedList:\n    def __init__(self):\n        self.__HeadNode = None     # Node\n```","answer_type":"code","criteria":[{"point":"InsertNode() method header (and close) taking one (integer) parameter","key_terms":["def InsertNode(self,"]},{"point":"Creating a new instance of Node with the parameter as the argument","key_terms":["Node("]},{"point":"Calling SetNextNode() for the new node with HeadNode as the parameter","key_terms":["SetNextNode(","HeadNode"]},{"point":"Replacing HeadNode with the new node","key_terms":["HeadNode = "]}],"max_note":"max 4","rejects":["The new node goes at the front of the list: the old HeadNode must be linked to it before HeadNode is replaced"],"final_answer":"class LinkedList:\n    def __init__(self):\n        self.__HeadNode = None\n    def InsertNode(self, NodeData):          # method header taking one integer parameter\n        TheNode = Node(NodeData)             # create a new Node using the parameter\n        TheNode.SetNextNode(self.__HeadNode) # SetNextNode() stores the current HeadNode as the next node\n        self.__HeadNode = TheNode            # replace HeadNode with the new node\n","confidence":"high"},{"id":"s25-43-3biii","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"3(b)(iii)","marks":3,"chapter":20,"subtopic":"linked-list","prompt":"The method Traverse() concatenates the integer data from the nodes in the linked list, starting with the node stored in HeadNode. The method returns the final string with each integer data separated with a space.\n\nWrite program code for Traverse().\n\nWrite your answer in Python.","context_note":"A program stores data in a linked list that is designed using Object-Oriented Programming (OOP).\n\nThe class `LinkedList` stores the linked list:\n\n| LinkedList | |\n|---|---|\n| HeadNode : Node | stores the first node in the linked list |\n| Constructor() | initialises HeadNode to a null value |\n| InsertNode() | creates a new node using its integer parameter. Sets this node as the new head node and updates NextNode |\n| RemoveNode() | finds the first node that contains its integer parameter and removes this node from the linked list |\n| Traverse() | concatenates and returns the integer data in each node in the linked list |\n\nAlready written:\n\n```python\nclass Node:      # Node(NodeData); methods GetData(), GetNextNode(), SetNextNode(pNextNode)\nclass LinkedList:\n    def __init__(self):\n        self.__HeadNode = None     # Node\n```\n\nInsertNode() is also already written (it adds new nodes at the front of the list).","answer_type":"code","criteria":[{"point":"Traverse() method header (and close) with no parameter, returning the created string","key_terms":["def Traverse(self","return"]},{"point":"Starting at the head node and following the nodes using GetNextNode() until there are no nodes left ...","key_terms":["HeadNode","GetNextNode()","while"]},{"point":"... concatenating the data from each node and formatting correctly (separated with a space)","key_terms":["GetData()","str(","\" \""]}],"max_note":"max 3","rejects":["A trailing space after the last number is acceptable (the scheme sample leaves one)"],"final_answer":"class LinkedList:\n    def __init__(self):\n        self.__HeadNode = None\n    def InsertNode(self, NodeData):\n        TheNode = Node(NodeData)\n        TheNode.SetNextNode(self.__HeadNode)\n        self.__HeadNode = TheNode\n    def Traverse(self):                                     # method header, no parameter, returns a string\n        ReturnValue = \"\"\n        CurrentNode = self.__HeadNode                       # start at the head node\n        while CurrentNode != None:                          # follow GetNextNode() until no nodes are left\n            ReturnValue = ReturnValue + str(CurrentNode.GetData()) + \" \"   # concatenate each node's data with a space\n            CurrentNode = CurrentNode.GetNextNode()\n        return ReturnValue                                  # return the created string\n","confidence":"high"},{"id":"s25-43-3biv","session":"s25","variant":"43","paper_code":"9618/43 May/June 2025","q":"3(b)(iv)","marks":6,"chapter":20,"subtopic":"linked-list","prompt":"The method RemoveNode() takes an integer parameter to search for and remove from the linked list.\n\nThe method first checks if the linked list is empty. If the linked list is empty the method returns FALSE.\n\nIf the linked list is not empty, the integer data in HeadNode is compared to the parameter. If it matches the parameter, HeadNode is changed to store the next node.\n\nIf the parameter does not match, the nodes are followed until either:\n\n- the node with matching integer data is found. This node is removed, the appropriate nodes updated and TRUE returned\n- or none of the nodes contain matching integer data to the parameter. No nodes are removed and FALSE is returned.\n\nWrite program code for RemoveNode().\n\nWrite your answer in Python.","context_note":"A program stores data in a linked list that is designed using Object-Oriented Programming (OOP).\n\nThe class `LinkedList` stores the linked list:\n\n| LinkedList | |\n|---|---|\n| HeadNode : Node | stores the first node in the linked list |\n| Constructor() | initialises HeadNode to a null value |\n| InsertNode() | creates a new node using its integer parameter. Sets this node as the new head node and updates NextNode |\n| RemoveNode() | finds the first node that contains its integer parameter and removes this node from the linked list |\n| Traverse() | concatenates and returns the integer data in each node in the linked list |\n\nAlready written:\n\n```python\nclass Node:      # Node(NodeData); methods GetData(), GetNextNode(), SetNextNode(pNextNode)\nclass LinkedList:\n    def __init__(self):\n        self.__HeadNode = None     # Node\n```\n\nThe Node methods GetData(), GetNextNode() and SetNextNode() are available.","answer_type":"code","criteria":[{"point":"RemoveNode() method header (and close) taking an (integer) parameter and returning a Boolean in all cases","key_terms":["def RemoveNode(self,","return True","return False"]},{"point":"Checking if the head node is null (empty list) and returning FALSE","key_terms":["HeadNode == None","is None","return False"]},{"point":"Checking if the head node data equals the parameter and returning TRUE if so ...","key_terms":["HeadNode.GetData()","== DataToRemove","return True"]},{"point":"... and updating HeadNode to HeadNode.GetNextNode()","key_terms":["HeadNode = ","GetNextNode()"]},{"point":"Following the nodes, comparing the data from each node to the parameter ...","key_terms":["while","GetNextNode()","GetData()"]},{"point":"... if found, updating the next node (bypassing the removed node) and returning TRUE","key_terms":["SetNextNode(","return True"]},{"point":"... if the end of the list is reached, returning FALSE","key_terms":["return False"]}],"max_note":"1 mark each, max 6","rejects":["Seven mark points are listed in the scheme but the part is capped at 6 marks","Accept keeping a previous-node pointer instead of looking ahead with GetNextNode()","Only the first matching node is removed"],"final_answer":"class LinkedList:\n    def __init__(self):\n        self.__HeadNode = None\n    def InsertNode(self, NodeData):\n        TheNode = Node(NodeData)\n        TheNode.SetNextNode(self.__HeadNode)\n        self.__HeadNode = TheNode\n    def Traverse(self):\n        ReturnValue = \"\"\n        CurrentNode = self.__HeadNode\n        while CurrentNode != None:\n            ReturnValue = ReturnValue + str(CurrentNode.GetData()) + \" \"\n            CurrentNode = CurrentNode.GetNextNode()\n        return ReturnValue\n    def RemoveNode(self, DataToRemove):                     # method header taking an integer, returns Boolean in all cases\n        if self.__HeadNode == None:                         # empty list ...\n            return False                                    # ... return False\n        if self.__HeadNode.GetData() == DataToRemove:       # head node matches the parameter ...\n            self.__HeadNode = self.__HeadNode.GetNextNode() # ... HeadNode becomes the next node\n            return True                                     # ... and return True\n        CurrentNode = self.__HeadNode\n        while CurrentNode.GetNextNode() != None:            # follow the nodes, comparing each node's data to the parameter\n            if CurrentNode.GetNextNode().GetData() == DataToRemove:\n                CurrentNode.SetNextNode(CurrentNode.GetNextNode().GetNextNode())   # found: bypass the node\n                return True                                 # ... and return True\n            CurrentNode = CurrentNode.GetNextNode()\n        return False                                        # reached the end of the list: return False\n","confidence":"high"},{"id":"s25-43-3ci","session":"s25","variant":"43","paper_code":"9618/43 May/June 202 unction Enqueue():\n\n- takes an integer parameter\n- checks if the queue is full\n- returns Boolean FALSE, if the queue is full\n- stores the parameter in the queue, updates the appropriate pointer(s) and returns Boolean TRUE, if the queue is not full.\n\nWrite program code for Enqueue().\n\nWrite your answer in Python.","context_note":"A program stores integer data in a linear queue. The queue is created as a global 1D array (a list in Python) with space for 10 elements. The queue has a global head pointer, initialised to -1, that points to the first element in the queue. The queue has a global tail pointer, initialised to -1, that points to the last element in the queue. Suggested identifiers (as used in the official mark scheme): Queue, HeadPointer, TailPointer. The queue and pointers already exist as global variables, set up as in part (a): Queue = [-1] * 10, HeadPointer = -1, TailPointer = -1.","answer_type":"code","criteria":[{"point":"Function header for Enqueue taking one (integer) parameter","key_terms":["def Enqueue(","Data"]},{"point":"Checks whether the queue is full (e.g. TailPointer == 9 or TailPointer < 9) ...","key_terms":["TailPointer","9","if"]},{"point":"... and returns False when the queue is full","key_terms":["return False"]},{"point":"Otherwise stores the parameter in the position after the tail pointer (tail pointer + 1)","key_terms":["Queue[TailPointer","TailPointer + 1"]},{"point":"Increments the tail pointer","key_terms":["TailPointer = TailPointer + 1","TailPointer += 1"]},{"point":"... and returns True when the item has been stored","key_terms":["return True"]},{"point":"Deals with the first element: when the queue was empty, changes the head pointer to 0","key_terms":["HeadPointer == -1","HeadPointer = 0"]}],"max_note":"max 7","rejects":["Accept the pointer being incremented before or after it is used, as long as the item is stored at the correct index and the queue is not overrun.","The queue is a linear (not circular) queue: do not require wrap-around.","Accept an equivalent full-test such as TailPointer == 9 or TailPointer >= 9 (zero-based array of 10)."],"final_answer":"# Q1(b)\nQueue = [-1] * 10\nHeadPointer = -1\nTailPointer = -1\n\ndef Enqueue(Data):                 # header with one parameter\n    global Queue, HeadPointer, TailPointer\n    if TailPointer < 9:            # queue is NOT full\n        TailPointer = TailPointer + 1   # increment tail pointer\n        Queue[TailPointer] = Data       # store parameter at tail pointer + 1\n        if HeadPointer == -1:           # first element: head becomes 0\n            HeadPointer = 0\n        return True                     # stored, return True\n    else:\n        return False                    # full, return False\n\n# quick test\nresults = [Enqueue(i) for i in range(1, 12)]\nprint(results)\nprint(Queue, HeadPointer, TailPointer)\n","confidence":"high"},{"id":"s26-41-1ci","session":"s26","variant":"41","paper_code":"9618/41 May/June 2026","q":"1(c)(i)","marks":5,"chapter":19,"subtopic":"queue","prompt":"Write program code to extend the main program to:\n\n- take 11 integers as input from the user\n- use the appropriate function to insert each integer into the queue\n- output a message if at any point the queue is full\n- output the final content of the queue array. Do not dequeue the data.\n\nYou do not need to validate the data input.\n\nWrite your answer in Python.","context_note":"A program stores integer data in a linear queue. The queue is created as a global 1D array (a list in Python) with space for 10 elements. The queue has a global head pointer, initialised to -1, that points to the first element in the queue. The queue has a global tail pointer, initialised to -1, that points to the last element in the queue. Suggested identifiers (as used in the official mark scheme): Queue, HeadPointer, TailPointer. The function Enqueue(Data) already exists (written in part (b)): it stores Data in the queue and returns True, or returns False if the queue is full. The global Queue list, HeadPointer and TailPointer already exist.","answer_type":"code","criteria":[{"point":"Takes 11 (integer) values as input (e.g. a loop that runs 11 times, with int(input(...)))","key_terms":["range(11)","int(input","input("]},{"point":"... calling Enqueue() with each input value","key_terms":["Enqueue("]},{"point":"Checks/stores the value returned by Enqueue()","key_terms":["Returned","if not","== False","if Enqueue("]},{"point":"... and outputs a message if False is returned (queue full)","key_terms":["print(","full"]},{"point":"Outputs the content of the queue array in any form","key_terms":["print(Queue)","for","Queue"]}],"max_note":"max 5","rejects":["Any form of output of the array contents is accepted (print the list, or loop and print each element).","The loop may use any valid construct as long as exactly 11 integers are read.","No dequeuing is allowed before the final output."],"final_answer":"# Q1(c)(i) - supporting code from earlier parts (assumed already written)\nQueue = [-1] * 10\nHeadPointer = -1\nTailPointer = -1\n\ndef Enqueue(Data):\n    global Queue, HeadPointer, TailPointer\n    if TailPointer < 9:\n        TailPointer = TailPointer + 1\n        Queue[TailPointer] = Data\n        if HeadPointer == -1:\n            HeadPointer = 0\n        return True\n    else:\n        return False\n\n# main program extension\nfor x in range(11):                                   # take 11 integers\n    Returned = Enqueue(int(input(\"Enter a number \")))   # call Enqueue with each input and keep the return value\n    if not Returned:                                    # False means the queue is full\n        print(\"Queue full\")                             # output a message\nprint(Queue)                                            # output final content of the queue array\n","confidence":"high"},{"id":"s26-41-1d","session":"s26","variant":"41","paper_code":"9618/41 May/June 2026","q":"1(d)","marks":6,"chapter":19," inter = -1\nTailPointer = -1\n\ndef Enqueue(Data):\n    global Queue, HeadPointer, TailPointer\n    if TailPointer < 9:\n        TailPointer = TailPointer + 1\n        Queue[TailPointer] = Data\n        if HeadPointer == -1:\n            HeadPointer = 0\n        return True\n    else:\n        return False\n\ndef Dequeue():                                   # header, no parameter\n    global Queue, HeadPointer, TailPointer\n    if HeadPointer > -1 and HeadPointer <= TailPointer:   # queue is NOT empty\n        ReturnValue = Queue[HeadPointer]         # access data at head pointer\n        HeadPointer = HeadPointer + 1            # increment head pointer before returning\n        return ReturnValue                       # return the item\n    else:\n        return -1                                # empty: return -1\n\n# quick test\nfor v in (7, 8):\n    Enqueue(v)\nprint(Dequeue(), Dequeue(), Dequeue())\n","confidence":"high"},{"id":"s26-41-1ei","session":"s26","variant":"41","paper_code":"9618/41 May/June 2026","q":"1(e)(i)","marks":3,"chapter":19,"subtopic":"queue","prompt":"Write program code to amend the main program to:\n\n- take 6 integers as input from the user and store them in the queue using the appropriate function\n- use the appropriate function to remove 4 elements from the queue\n- output each removed element from the queue.\n\nWrite your answer in Python.","context_note":"A program stores integer data in a linear queue. The queue is created as a global 1D array (a list in Python) with space for 10 elements. The queue has a global head pointer, initialised to -1, that points to the first element in the queue. The queue has a global tail pointer, initialised to -1, that points to the last element in the queue. Suggested identifiers (as used in the official mark scheme): Queue, HeadPointer, TailPointer. The functions Enqueue(Data) (stores Data, returns True, or False if the queue is full) and Dequeue() (returns the next item, or -1 if the queue is empty) ur answer in Python.","context_note":"A program stores data about toys that are made from bricks. The toys are stored in a record structure with four fields: ToyName (the string name of the toy), NumberBricks (the integer number of bricks in the toy), Difficulty (the string difficulty level of the toy: easy, medium or expert) and Category (the string category of the toy, for example town, display, play). A class declaration can be used to declare a record.","answer_type":"code","criteria":[{"point":"A record structure / class with the identifier ToyRecord is declared (in Python a class needs a constructor, parameters may be ignored)","key_terms":["class ToyRecord","def __init__"]},{"point":"Four fields declared/initialised: ToyName, NumberBricks, Difficulty, Category","key_terms":["ToyName","NumberBricks","Difficulty","Category"]}],"max_note":"max 2","rejects":["In Python the class needs a constructor to earn the first mark; the constructor's parameters may be allowed or ignored.","Fields may be declared as attributes with a comment giving the data type."],"final_answer":"# Q2(a)\nclass ToyRecord:                                   # record structure with identifier ToyRecord\n    def __init__(self, pName, pNumBricks, pDifficulty, pCategory):   # constructor\n        self.ToyName = pName              # string          (field 1)\n        self.NumberBricks = pNumBricks    # integer         (field 2)\n        self.Difficulty = pDifficulty     # string          (field 3)\n        self.Category = pCategory         # string          (field 4)\n\nt = ToyRecord('Fire Station', 3981, 'Expert', 'Town')\nprint(t.ToyName, t.NumberBricks, t.Difficulty, t.Category)\n","confidence":"high"},{"id":"s26-41-2bi","session":"s26","variant":"41","paper_code":"9618/41 May/June 2026","q":"2(b)(i)","marks":8,"chapter":20,"subtopic":"text-file-read","prompt":"The function ReadData():\n\n- takes an array of type ToyRecord as a parameter\n- opens the file Toys.txt and reads in the data\n- creat er\n- prompts the user to enter the difficulty level\n- takes the difficulty level as input until it is valid\n- creates a new array containing the ToyRecord objects that match the difficulty level input\n- returns the populated array.\n\nWrite program code for SearchToys().\n\nWrite your answer in Python.","context_note":"A program stores data about toys that are made from bricks. The toys are stored in a record structure with four fields: ToyName (the string name of the toy), NumberBricks (the integer number of bricks in the toy), Difficulty (the string difficulty level of the toy: easy, medium or expert) and Category (the string category of the toy, for example town, display, play). A class declaration can be used to declare a record.\n\nValid difficulty levels are easy, medium and expert. In Toys.txt they are stored with a capital first letter (for example Expert). The record is declared as a class ToyRecord whose constructor is ToyRecord(pName, pNumBricks, pDifficulty, pCategory) and whose attributes are ToyName, NumberBricks, Difficulty and Category (as in the official mark scheme example):\n\n```python\nclass ToyRecord:\n    def __init__(self, pName, pNumBricks, pDifficulty, pCategory):\n        self.ToyName = pName              # string\n        self.NumberBricks = pNumBricks    # integer\n        self.Difficulty = pDifficulty     # string\n        self.Category = pCategory         # string\n```","answer_type":"code","criteria":[{"point":"Function header taking an array of ToyRecord and returning a populated (new) array","key_terms":["def SearchToys(","return"]},{"point":"Prompts for and reads the difficulty level as input ...","key_terms":["input("]},{"point":"... repeatedly until it is valid (one of the 3 levels)","key_terms":["while","easy","medium","expert"]},{"point":"Iterates through each element of the array and compares its Difficulty with the input ...","key_terms":["for",".Difficulty","=="]},{"point":"... and appends those that match to the new array","key_terms":["append("]}],"max_note":"max 5","rejects":["Allow any input method (typed word, or a menu number 1/2/3) as long as it equates to the 3 levels and is repeated until valid.","The comparison must allow for the capital letter used in the file (e.g. Medium vs medium) - accept a lower-case/upper-case conversion or a mapped choice.","The returned array must be a new array, not the original."],"final_answer":"# Q2(c)(i) - ToyRecord class from part (a), assumed already written\nclass ToyRecord:\n    def __init__(self, pName, pNumBricks, pDifficulty, pCategory):\n        self.ToyName = pName              # string\n        self.NumberBricks = pNumBricks    # integer\n        self.Difficulty = pDifficulty     # string\n        self.Category = pCategory         # string\n\ndef SearchToys(TheToys):                     # header: array parameter, returns new array\n    SelectedToys = []                        # new array for the matches\n    Choice = \"\"\n    while Choice not in (\"easy\", \"medium\", \"expert\"):          # repeat until valid\n        Choice = input(\"Enter the difficulty (easy, medium or expert) \").lower()   # prompt + input\n    for Item in TheToys:                     # iterate through each element\n        if Item.Difficulty.lower() == Choice:     # compare difficulty with the input\n            SelectedToys.append(Item)        # append matches to the new array\n    return SelectedToys                      # return the populated array\n\n# quick test (first input is invalid on purpose)\nL = [ToyRecord('Castle', 2500, 'Medium', 'Display'), ToyRecord('Train', 860, 'Medium', 'Play'), ToyRecord('Van', 420, 'Easy', 'Town')]\nR = SearchToys(L)\nprint([t.ToyName for t in R])\n","confidence":"high"},{"id":"s26-41-2cii","session":"s26","variant":"41","paper_code":"9618/41 May/June 2026","q":"2(c)(ii)","marks":3,"chapter":20,"subtopic":"text-file-write","prompt":"The procedure WriteToys():\n\n- takes an array of type ToyRecord as a parameter\n- create cts":["Declaring an empty list then appending the nine strings in order is also acceptable.","The identifier must be TheData."],"final_answer":"# Q1(a)\nTheData = [\"laptop\", \"tablet\", \"printer\", \"computer\", \"processor\", \"monitor\", \"memory\", \"cable\", \"touchscreen\"]   # array of 9 strings stored in the order given\nprint(len(TheData), TheData[0], TheData[8])\n","confidence":"high"},{"id":"s26-42-1bi","session":"s26","variant":"42","paper_code":"9618/42 May/June 2026","q":"1(b)(i)","marks":5,"chapter":19,"subtopic":"string-handling","prompt":"The procedure FindLongestShortest():\n\n- takes an array of strings as a parameter\n- finds and outputs the longest string in the array of strings\n- finds and outputs the shortest string in the array of strings.\n\nAll outputs must have appropriate messages. Do not use in-built functions to find the longest and shortest string in the array. You may use an in-built length function to find the length of a string.\n\nYou can assume that there will only be one string that has the shortest length. You can assume that there will only be one string that has the longest length.\n\nWrite program code for FindLongestShortest().\n\nWrite your answer in Python.","context_note":"A program stores nine lower-case strings in a 1D array TheData. The following strings are stored in the order shown: laptop, tablet, printer, computer, processor, monitor, memory, cable, touchscreen. The array is called TheData.","answer_type":"code","criteria":[{"point":"Procedure header (and end where appropriate) taking one (string array) parameter","key_terms":["def FindLongestShortest("]},{"point":"Loops through each string in the array","key_terms":["for"]},{"point":"Finds the shortest string (comparing lengths, keeping the shortest so far)","key_terms":["len(","<","Shortest"]},{"point":"Finds the longest string (comparing lengths, keeping the longest so far)","key_terms":["len(",">","Longest"]},{"point":"Outputs the longest and the shortest string, each in an appropriate message","key_terms":["print(","longest","shortest"]}],"max_note":"max 5","rejects":["No use of max(), min(), sorted() or similar in-built functions to find the longest/shortest string; len() is allowed.","Starting values must work for the data (e.g. start from the first element, or a large/small initial length)."],"final_answer":"# Q1(b)(i)\ndef FindLongestShortest(TheData):               # header, one array parameter\n    LongestWord = TheData[0]\n    ShortestWord = TheData[0]\n    for Word in TheData:                         # loop through each string\n        if len(Word) > len(LongestWord):         # find the longest\n            LongestWord = Word\n        if len(Word) < len(ShortestWord):        # find the shortest\n            ShortestWord = Word\n    print(\"The longest string is\", LongestWord)      # output with messages\n    print(\"The shortest string is\", ShortestWord)\n\nTheData = [\"laptop\", \"tablet\", \"printer\", \"computer\", \"processor\", \"monitor\", \"memory\", \"cable\", \"touchscreen\"]\nFindLongestShortest(TheData)\n","confidence":"high"},{"id":"s26-42-1ci","session":"s26","variant":"42","paper_code":"9618/42 May/June 2026","q":"1(c)(i)","marks":5,"chapter":19,"subtopic":"insertion-sort","prompt":"The function InsertionSort():\n\n- takes an array of strings as a parameter\n- sorts the strings in the array into ascending alphabetical order using an insertion sort\n- returns the sorted array.\n\nThe function must work for an array of any length. Do not use an in-built function to sort the array.\n\nWrite program code for InsertionSort().\n\nWrite your answer in Python.","context_note":"A program stores nine lower-case strings in a 1D array TheData. The following strings are stored in the order shown: laptop, tablet, printer, computer, processor, monitor, memory, cable, touchscreen. The function must work for an array of any length.","answer_type":"code","criteria":[{"point":"Function header (and end where appropriate) taking a (string array) parameter","key_terms":["def InsertionSort("]},{"point":"Loops through each element in the array (from the second element) ...","key_terms":["for","range(1"]},{"point":"... using the insertion sort method, e.g. taking the element out and moving the larger elements down/along to make room for it","key_terms":["Temp","while","TheData[y+1] = TheData[y]","TheData[y + 1] = TheData[y]"]},{"point":"Uses an appropriate string comparison (Python < or > on strings)","key_terms":["<",">","Temp <"]},{"point":"Returns a correctly sorted array","key_terms":["return"]}],"max_note":"max 5","rejects":["No use of sort(), sorted() or similar in-built sorting functions.","The function must work for any array length, including an empty array or one with a single element."],"final_answer":"# Q1(c)(i)\ndef InsertionSort(TheData):                    # header, array parameter\n    ArrayLength = len(TheData)\n    for x in range(1, ArrayLength):              # loop through each element from the second\n        Temp = TheData[x]                        # take the element out\n        y = x - 1\n        while y >= 0 and Temp < TheData[y]:      # string comparison; move larger elements down\n            TheData[y + 1] = TheData[y]\n            y = y - 1\n        TheData[y + 1] = Temp                    # insert the element in its place\n    return TheData                               # return the sorted array\n\nprint(InsertionSort([\"laptop\", \"tablet\", \"printer\", \"computer\", \"processor\", \"monitor\", \"memory\", \"cable\", \"touchscreen\"]))\nprint(InsertionSort([]), InsertionSort(['b']))\n","confidence":"high"},{"id":"s26-42-1cii","session":"s26","variant":"42","paper_code":"9618/42 May/June 2026","q":"1(c)(ii)","marks":3,"chapter":19,"subtopic":"main-program","prompt":"Write program code to extend the main program to perform the following in the order shown:\n\n- output the string \"Before sorting\"\n- output the contents of the array TheData\n- call I
