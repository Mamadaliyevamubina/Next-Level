uestion also asks for comment declarations of the attributes (Python); the scheme's Python sample earns the marks without them, so do not deduct for their absence but accept them when present."],"final_answer":"class Tree:\n    # private TreeName : STRING\n    # private HeightGrowth : INTEGER\n    # private MaxHeight : INTEGER\n    # private MaxWidth : INTEGER\n    # private Evergreen : STRING\n    def __init__(self, Name, HGrowth, MaxH, MaxW, PEvergreen):   # constructor with 5 parameters\n        self.__TreeName = Name                      # assign parameters to private attributes\n        self.__HeightGrowth = HGrowth\n        self.__MaxHeight = MaxH\n        self.__MaxWidth = MaxW\n        self.__Evergreen = PEvergreen\n","confidence":"high"},{"id":"s24-41-2aii","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"2(a)(ii)","marks":3,"chapter":20,"subtopic":"getters-setters","prompt":"The get methods `GetTreeName()`, `GetGrowth()`, `GetMaxHeight()`, `GetMaxWidth()` and `GetEvergreen()` each return the relevant attribute.\n\nWrite program code for the get methods. Write your answer in Python.","context_note":"The class `Tree` stores data about trees. All attributes are private.\n\n| Attribute / method | Description |\n|---|---|\n| TreeName : STRING | name of the tree |\n| HeightGrowth : INTEGER | number of cm the tree grows each year |\n| MaxHeight : INTEGER | maximum height in cm |\n| MaxWidth : INTEGER | maximum width in cm |\n| Evergreen : STRING | \"Yes\" if the tree keeps its leaves, \"No\" if it loses them |\n| Constructor() | initialises TreeName, HeightGrowth, MaxHeight, MaxWidth and Evergreen to its parameter values |\n| GetTreeName(), GetGrowth(), GetMaxHeight(), GetMaxWidth(), GetEvergreen() | each returns the relevant attribute |\n\nThe constructor stores its parameters in the private attributes `self.__TreeName`, `self.__HeightGrowth`, `self.__MaxHeight`, `self.__MaxWidth` and `self.__Evergreen`. The get methods go inside the class `Tree`.","answer_type":"code","criteria":[{"point":"One get method with no parameter (other than self) ...","key_terms":["def GetTreeName(self):"]},{"point":"... that returns the correct attribute","key_terms":["return self.__TreeName"]},{"point":"The remaining 4 get methods are correct","key_terms":["GetGrowth","GetMaxHeight","GetMaxWidth","GetEvergreen"]}],"max_note":"max 3","rejects":["Method names must be exactly those in the question (GetTreeName, GetGrowth, GetMaxHeight, GetMaxWidth, GetEvergreen).","GetGrowth returns HeightGrowth; GetEvergreen returns the string \"Yes\"/\"No\"."],"final_answer":"    def GetTreeName(self):               # get method, no parameter, returns correct attribute\n        return self.__TreeName\n    def GetGrowth(self):                 # remaining four methods\n        return self.__HeightGrowth\n    def GetMaxHeight(self):\n        return self.__MaxHeight\n    def GetMaxWidth(self):\n        return self.__MaxWidth\n    def GetEvergreen(self):\n        return self.__Evergreen\n","confidence":"high"},{"id":"s24-41-2b","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"2(b)","marks":7,"chapter":20,"subtopic":"text-file-read","prompt":"The function `ReadData()`:\n\n- creates an array of type `Tree`\n- reads the data from the file\n- raises an exception if the file is not found\n- creates a new object of type `Tree` for each tree in the file\n- appends each object to the array\n- returns the array.\n\nWrite program code for `ReadData()`. Write your answer in Python.","context_note":"The text file `Trees.txt` stores data about 9 trees, one per line, in the format: Tree name,Height growth each year,Maximum height,Maximum width,Evergreen. The first line is `Beech,30,400,200,No` (a Beech grows 30 cm a year, maximum height 400 cm, maximum width 200 cm, not evergreen). The file is supplied in the exam.\n\nClass `Tree` (already written) has the constructor `Tree(Name, HGrowth, MaxH, MaxW, PEvergreen)`; HGrowth, MaxH and MaxW must be integers.","answer_type":"code","criteria":[{"point":"Appropriate use of exception handling, with a catch/except and an output message (file not found)","key_terms":["try:","except","FileNotFoundError","IOError"]},{"point":"Function header ReadData and declaration of the array (list) of Tree objects","key_terms":["def ReadData():","= []"]},{"point":"Opens the text file Trees.txt to read and closes it","key_terms":["open(\"Trees.txt\"","close()","with open"]},{"point":"Reads each line of the file (until end of file, or 9 times)","key_terms":["for Line in","readline","read()"]},{"point":"Splits each line into the 5 elements","key_terms":["split(\",\")"]},{"point":"Casts height growth, maximum height and maximum width to integers","key_terms":["int("]},{"point":"Creates a new Tree object with the 5 values","key_terms":["Tree("]},{"point":"Stores (appends) each object in the array and returns the array","key_terms":["append(","return"]}],"max_note":"max 7: 1 mark for exception handling, plus 1 mark each to a maximum of 6 from the other seven points","rejects":["Accept any way of reading the lines (readlines, read().split('\\n'), a for loop over the file, readline until empty).","Accept except FileNotFoundError, IOError, OSError or a general except, as long as a message is output.","The array must be a list of Tree objects, not a list of lists."],"final_answer":"def ReadData():                                      # header\n    TreeObjects = []                                # array of Tree objects\n    try:                                            # exception handling\n        File = open(\"Trees.txt\", \"r\")              # open file to read\n        for Line in File:                           # read each line\n            Line = Line.strip()\n            if Line != \"\":\n                Item = Line.split(\",\")              # split into 5 elements\n                TreeObjects.append(Tree(Item[0], int(Item[1]), int(Item[2]), int(Item[3]), Item[4]))   # cast to int, create object, append\n        File.close()                                # close file\n    except FileNotFoundError:\n        print(\"File not found\")                     # output message when file missing\n    return TreeObjects                              # return the array\n","confidence":"high"},{"id":"s24-41-2c","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"2(c)","marks":4,"chapter":20,"subtopic":"class-definition","prompt":"The procedure `PrintTrees()` takes a `Tree` object as a parameter and outputs the tree's name, height growth each year, maximum height, maximum width and whether it is evergreen.\n\nThe output message changes depending on whether it is evergreen.\n\nIf it is evergreen, it is in the format:\n\n```\nTreeName has a maximum height MaxHeight a maximum width MaxWidth and grows HeightGrowth cm a year. It does not lose its leaves.\n```\n\nIf it is not evergreen, it is in the format:\n\n```\nTreeName has a maximum height MaxHeight a maximum width MaxWidth and grows HeightGrowth cm a year. It loses its leaves each year.\n```\n\nWrite program code for `PrintTrees()`. Write your answer in Python.","context_note":"The class `Tree` stores data about trees. All attributes are private.\n\n| Attribute / method | Description |\n|---|---|\n| TreeName : STRING | name of the tree |\n| HeightGrowth : INTEGER | number of cm the tree grows each year |\n| MaxHeight : INTEGER | maximum height in cm |\n| MaxWidth : INTEGER | maximum width in cm |\n| Evergreen : STRING | \"Yes\" if the tree keeps its leaves, \"No\" if it loses them |\n| Constructor() | initialises TreeName, HeightGrowth, MaxHeight, MaxWidth and Evergreen to its parameter values |\n| GetTreeName(), GetGrowth(), GetMaxHeight(), GetMaxWidth(), GetEvergreen() | each returns the relevant attribute |\n\nThe attributes are private, so the get methods must be used.","answer_type":"code","criteria":[{"point":"Procedure heading taking one parameter (a Tree object) and using the get methods to access the tree name, height, width and growth","key_terms":["def PrintTrees(","GetTreeName()","GetMaxHeight()","GetMaxWidth()","GetGrowth()"]},{"point":"Outputs all 4 attributes (TreeName, MaxHeight, MaxWidth, HeightGrowth) in the required message","key_terms":["print(","has a maximum height"]},{"point":"Checks whether the tree is evergreen (GetEvergreen() compared with \"Yes\"/\"No\")","key_terms":["GetEvergreen()","\"No\"","\"Yes\""]},{"point":"Outputs the correct ending message for evergreen (does not lose its leaves) and for not evergreen (loses its leaves each year)","key_terms":["It does not lose its leaves","It loses its leaves each year"]}],"max_note":"max 4","rejects":["Accept the message built with commas, + concatenation (with str() for numbers) or f-strings, provided the words and values are in the required order.","Minor spacing/punctuation differences are acceptable if the meaning of the message is unambiguous."],"final_answer":"def PrintTrees(Item):                               # heading, one parameter\n    if Item.GetEvergreen() == \"Yes\":                # check evergreen\n        Final = \"does not lose its leaves.\"\n    else:\n        Final = \"loses its leaves each year.\"\n    print(Item.GetTreeName(), \"has a maximum height\", Item.GetMaxHeight(),\n          \"a maximum width\", Item.GetMaxWidth(), \"and grows\",\n          Item.GetGrowth(), \"cm a year. It\", Final)   # output all four attributes and message\n","confidence":"high"},{"id":"s24-41-2di","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"2(d)(i)","marks":2,"chapter":20,"subtopic":"main-program","prompt":"The main program calls `ReadData()`, stores the return value and calls `PrintTrees()` with the first object in the returned array.\n\nWrite program code for the main program. Write your answer in Python.","context_note":"`ReadData()` returns an array (list) of `Tree` objects read from the file Trees.txt. `PrintTrees(Item)` takes one `Tree` object and outputs its details.","answer_type":"code","criteria":[{"point":"Calls ReadData() and stores/uses the return value (as an array of Tree objects)","key_terms":["= ReadData()"]},{"point":"Calls PrintTrees() with the first object in the returned array as the parameter","key_terms":["PrintTrees(TreeObjects[0])"]}],"max_note":"max 2","rejects":["The first object is index 0 of the returned list."],"final_answer":"TreeObjects = ReadData()          # call ReadData and store the returned array\nPrintTrees(TreeObjects[0])      # call PrintTrees with the first object\n","confidence":"high"},{"id":"s24-41-2ei","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"2(e)(i)","marks":6,"chapter":20,"subtopic":"array-1d","prompt":"The procedure `ChooseTree()` takes an array of `Tree` objects as a parameter.\n\nThe procedure prompts the user to input their requirements for a tree. The user needs to enter:\n\n- the maximum height the tree can be in cm\n- the maximum width the tree can be in cm\n- whether they want the tree to be evergreen, or not evergreen.\n\nA tree meets the requirements if:\n\n- the tree's maximum height is not more than the user's input\n\nand\n\n- the tree's maximum width is not more than the user's input\n\nand\n\n- the tree matches their evergreen input.\n\nThe procedure creates a new array of all the `Tree` objects that meet all the requirements.\n\nThe procedure calls `PrintTrees()` for each `Tree` object that meets all the requirements. If there are no trees that meet all the requirements, a suitable message is output.\n\nWrite program code for `ChooseTree()`. Write your answer in Python.","context_note":"The class `Tree` stores data about trees. All attributes are private.\n\n| Attribute / method | Description |\n|---|---|\n| TreeName : STRING | name of the tree |\n| HeightGrowth : INTEGER | number of cm the tree grows each year |\n| MaxHeight : INTEGER | maximum height in cm |\n| MaxWidth : INTEGER | maximum width in cm |\n| Evergreen : STRING | \"Yes\" if the tree keeps its leaves, \"No\" if it loses them |\n| Constructor() | initialises TreeName, HeightGrowth, MaxHeight, MaxWidth and Evergreen to its parameter values |\n| GetTreeName(), GetGrowth(), GetMaxHeight(), GetMaxWidth(), GetEvergreen() | each returns the relevant attribute |\n\nThe tree's Evergreen attribute holds \"Yes\" or \"No\". `PrintTrees(Item)` (part 2(c)) outputs the details of one `Tree` object.","answer_type":"code","criteria":[{"point":"Procedure header taking the array of Tree objects as a parameter and reads the evergreen preference, maximum height and maximum width once each as input from the user","key_terms":["def ChooseTree(","input(","int(input("]},{"point":"Loops through each object in the array","key_terms":["for"]},{"point":"Compares the tree's maximum height and maximum width with the user's input (tree's value not more than the user's)","key_terms":["GetMaxHeight() <=","GetMaxWidth() <="]},{"point":"Compares the user's evergreen input with the tree's Evergreen attribute","key_terms":["GetEvergreen()"]},{"point":"When all the requirements are true, appends the object to a new array","key_terms":["append("]},{"point":"Calls PrintTrees() with each valid object","key_terms":["PrintTrees("]},{"point":"Outputs a suitable message if no trees are appropriate","key_terms":["len(","== 0","No suitable"]}],"max_note":"max 6 (seven points are listed in the scheme)","rejects":["The scheme writes the comparison from the user's side (input >= MaxHeight / MaxWidth); this is the same test as the tree's value being not more than the input, so equal values must be accepted.","The question does not fix how the evergreen answer is typed: accept any sensible input (e.g. Yes/No, keep/lose, evergreen/not) that is correctly converted to compare with the stored \"Yes\"/\"No\".","The new array of matching trees must be created (a list built with append); printing without storing does not earn the append mark."],"final_answer":"def ChooseTree(Trees):                              # header, array parameter\n    Height = int(input(\"Maximum height in cm: \"))   # inputs read once\n    Width = int(input(\"Maximum width in cm: \"))\n    Answer = input(\"Evergreen? (Yes/No): \")\n    Options = []                                    # new array of suitable trees\n    for Item in Trees:                              # loop through each object\n        if (Item.GetMaxHeight() <= Height and Item.GetMaxWidth() <= Width\n                and Item.GetEvergreen() == Answer):   # compare height, width, evergreen\n            Options.append(Item)                    # store matching tree\n            PrintTrees(Item)                        # print each valid tree\n    if len(Options) == 0:\n        print(\"No suitable trees\")                  # no tree met the requirements\n","confidence":"high"},{"id":"s24-41-2eii","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"2(e)(ii)","marks":2,"chapter":20,"subtopic":"array-1d","prompt":"The procedure `ChooseTree()` needs amending. After the procedure has output the list of trees that meet all the requirements, the procedure needs to:\n\n- take as input the name of one of the trees that the user would like to buy from those that meet all the requirements\n- take as input the height of the tree in cm when it is bought\n- calculate and output how many years it will take the tree to grow to its maximum height.\n\nFor example, the user inputs the tree, Beech. The tree's height is 40 cm when bought. The tree will take 12 years to reach its maximum height of 400 cm.\n\nWrite program code to amend `ChooseTree()`. Write your answer in Python.","context_note":"The class `Tree` stores data about trees. All attributes are private.\n\n| Attribute / method | Description |\n|---|---|\n| TreeName : STRING | name of the tree |\n| HeightGrowth : INTEGER | number of cm the tree grows each year |\n| MaxHeight : INTEGER | maximum height in cm |\n| MaxWidth : INTEGER | maximum width in cm |\n| Evergreen : STRING | \"Yes\" if the tree keeps its leaves, \"No\" if it loses them |\n| Constructor() | initialises TreeName, HeightGrowth, MaxHeight, MaxWidth and Evergreen to its parameter values |\n| GetTreeName(), GetGrowth(), GetMaxHeight(), GetMaxWidth(), GetEvergreen() | each returns the relevant attribute |\n\nInside `ChooseTree()`, the list `Options` already holds the `Tree` objects that met all the requirements (built in part 2(e)(i)). The new code goes at the end of `ChooseTree()`, after the suitable trees have been printed.","answer_type":"code","criteria":[{"point":"Takes the tree name and the starting height as input","key_terms":["input(\"","int(input("]},{"point":"Finds the chosen tree in the suitable trees, calculates the years to maximum height ((MaxHeight - start) / growth) and outputs it","key_terms":["GetMaxHeight()","GetGrowth()","print("]}],"max_note":"max 2","rejects":["Accept the result shown as a decimal (e.g. 3.75), rounded, or rounded up (e.g. 3.75 or 4 years) as the scheme accepts 3 years / 3.75 / 4 years for Blue Conifer from 100 cm.","Accept a loop that repeats until a valid name is entered, or a single input with no repeat."],"final_answer":"# (added at the end of ChooseTree, after the matching trees are printed)\nChoice = input(\"Enter the name of the tree you want: \")          # tree name\nStart = int(input(\"Enter its height in cm when bought: \"))        # starting height\nfor Item in Options:\n    if Item.GetTreeName() == Choice:                                 # find the chosen tree\n        Years = (Item.GetMaxHeight() - Start) / Item.GetGrowth()     # years to reach maximum height\n        print(\"It will take\", Years, \"years to reach its maximum height\")\n","confidence":"high"},{"id":"s24-41-3b","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"3(b)","marks":4,"chapter":19,"subtopic":"queue","prompt":"The function `Enqueue()` takes the data to insert into the queue as a parameter.\n\nIf the queue is not full, it inserts the parameter in the queue, updates the appropriate pointer(s) and returns TRUE. If the queue is full, it returns FALSE.\n\nWrite program code for `Enqueue()`. Write your answer in Python.","context_note":"The queue is a linear queue stored in the global 1D array `QueueData` of string values with space for 20 elements. The global variable `QueueHead` stores the index of the first element in the queue and `QueueTail` stores the index of the last element in the queue. In the main program all the elements of `QueueData` are set to \"\" (a null value) and `QueueHead` and `QueueTail` are both set to -1 (an empty queue).","answer_type":"code","criteria":[{"point":"Function header taking one parameter, returning a Boolean value in all cases","key_terms":["def Enqueue(DataToInsert):","return True","return False"]},{"point":"Checks if the queue is full (QueueTail is 19) and returns False","key_terms":["QueueTail == 19","return False"]},{"point":"If not full, inserts the data item at position QueueTail + 1, increments QueueTail and returns True","key_terms":["QueueTail = QueueTail + 1","QueueData[QueueTail]","return True"]},{"point":"Sets QueueHead to 0 when the first element is entered (this can come from incrementing)","key_terms":["QueueHead = 0"]}],"max_note":"max 4","rejects":["The scheme's Python sample uses QueueData.append(); the item should be placed in the array at the position QueueTail (the array has 20 pre-set elements). Accept either if the queue behaves correctly.","Accept a full-queue test of QueueTail >= 19 or QueueTail == len(QueueData) - 1.","A circular queue is not asked for: the queue is full when QueueTail reaches 19."],"final_answer":"def Enqueue(DataToInsert):                          # one parameter\n    global QueueData, QueueHead, QueueTail\n    if QueueTail == 19:                             # queue full\n        return False\n    if QueueHead == -1:                             # first element entered\n        QueueHead = 0\n    QueueTail = QueueTail + 1                       # move tail on\n    QueueData[QueueTail] = DataToInsert             # insert at QueueTail\n    return True\n","confidence":"high"},{"id":"s24-41-3c","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"3(c)","marks":3,"chapter":19,"subtopic":"queue","prompt":"The function `Dequeue()` returns \"false\" if the queue is empty. If the queue is not empty, it returns the next item in the queue and updates the appropriate pointer(s).\n\nWrite program code for `Dequeue()`. Write your answer in Python.","context_note":"The queue is a linear queue stored in the global 1D array `QueueData` of string values with space for 20 elements. The global variable `QueueHead` stores the index of the first element in the queue and `QueueTail` stores the index of the last element in the queue. In the main program all the elements of `QueueData` are set to \"\" (a null value) and `QueueHead` and `QueueTail` are both set to -1 (an empty queue). Items are added by `Enqueue()`, which increments `QueueTail` (and sets `QueueHead` to 0 when the first item is added).","answer_type":"code","criteria":[{"point":"Function header Dequeue returning a string in all cases","key_terms":["def Dequeue():","return"]},{"point":"Checks if the queue is empty and returns \"false\"","key_terms":["QueueHead == -1","QueueHead > QueueTail","return \"false\""]},{"point":"Otherwise removes (reads) the value at QueueHead, increments QueueHead and returns the value from the array","key_terms":["QueueHead = QueueHead + 1","return"]}],"max_note":"max 3","rejects":["The scheme's Python sample returns the Boolean False; the question asks for the string \"false\". Accept either as the 'empty' return, but the other mark points still apply.","Empty means QueueHead is -1 or QueueHead is greater than QueueTail; either test (or both) is acceptable."],"final_answer":"def Dequeue():                                      # no parameter\n    global QueueData, QueueHead, QueueTail\n    if QueueHead == -1 or QueueHead > QueueTail:    # queue empty\n        return \"false\"\n    Item = QueueData[QueueHead]                     # value at QueueHead\n    QueueHead = QueueHead + 1                       # move head on\n    return Item\n","confidence":"high"},{"id":"s24-41-3di","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"3(d)(i)","marks":6,"chapter":19,"subtopic":"validation","prompt":"The string values to be stored in the queue are 7 characters long. The first 6 characters are digits and the 7th character is a check digit. The check digit is calculated from the first 6 digits using this algorithm:\n\n- multiply the digits in position 0, position 2 and position 4 by 1\n- multiply the digits in position 1, position 3 and position 5 by 3\n- calculate the sum of the products (add together the results from all of the multiplications)\n- divide the sum of the products by 10 and round the result down to the nearest integer to get the check digit\n- if the check digit equals 10 then it is replaced with 'X'.\n\nExample: data is 954123\n\n| Character position | 0 | 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|---|\n| Digit | 9 | 5 | 4 | 1 | 2 | 3 |\n| Multiplier | 1 | 3 | 1 | 3 | 1 | 3 |\n| Product | 9 | 15 | 4 | 3 | 2 | 9 |\n\nSum of products = 9 + 15 + 4 + 3 + 2 + 9 = 42. Divide the sum by 10: 42 / 10 = 4 (rounded down). The check digit = 4, inserted into character position 6, so the data including the check digit is 9541234.\n\nA 7-character string is valid if the 7th character matches the check digit for that data. For example, the data 9541235 is invalid because the 7th character (5) does not match the check digit for 954123.\n\nThe subroutine `StoreItems()` takes ten 7-character strings as input from the user and uses the check digit to validate each input.\n\nEach valid input has the check digit removed and is stored in the queue using `Enqueue()`. An appropriate message is output if the item is inserted. An appropriate message is output if the queue is already full.\n\nInvalid inputs are not stored in the queue.\n\nThe subroutine counts and outputs the number of invalid items that were entered.\n\n`StoreItems()` can be a procedure or a function as appropriate.\n\nWrite program code for `StoreItems()`. Write your answer in Python.","context_note":"`Enqueue(DataToInsert)` (part 3(b)) inserts the item into the linear queue and returns True, or returns False if the queue is full.","answer_type":"code","criteria":[{"point":"StoreItems header (function or procedure) and takes 10 inputs","key_terms":["def StoreItems():","for","range(10)","input("]},{"point":"Splits the input and uses the first 6 characters in the calculation as integers","key_terms":["int(Data[0])","Data[0:6]"]},{"point":"Multiplies by 1 and 3 alternately, adds to a total, divides by 10 and rounds down (// or int())","key_terms":["* 3","// 10","int("]},{"point":"Compares the check digit with the character in position 6","key_terms":["Data[6]"]},{"point":"Includes the comparison for 'X' when the check digit is 10","key_terms":["\"X\"","== 10"]},{"point":"Calls Enqueue with the first 6 characters when valid","key_terms":["Enqueue(Data[0:6])","Enqueue(Data[:6])"]},{"point":"Outputs an appropriate message on return, both for inserted and for queue full","key_terms":["print(","Inserted","full"]},{"point":"Counts and outputs the number of invalid inputs","key_terms":["Count + 1","invalid"]}],"max_note":"max 6 (eight points are listed in the scheme)","rejects":["The scheme's Java/VB samples in places enqueue the whole 7-character string; the question says the check digit is removed, so the first 6 characters (Data[0:6]) should be passed to Enqueue().","Accept strings checked with str(CheckDigit) == Data[6] or int(Data[6]) == CheckDigit; accept the 10 -> 'X' replacement before or after the comparison.","Accept a procedure or a function."],"final_answer":"def StoreItems():                                   # procedure, no parameter\n    Invalid = 0\n    for X in range(10):                             # ten inputs\n        Data = input(\"Enter 7-character item: \")\n        Total = 0\n        for Pos in range(6):                        # first 6 characters as integers\n            if Pos % 2 == 0:\n                Total = Total + int(Data[Pos]) * 1  # multiply by 1 (positions 0, 2, 4)\n            else:\n                Total = Total + int(Data[Pos]) * 3  # multiply by 3 (positions 1, 3, 5)\n        Check = Total // 10                         # divide by 10, round down\n        if Check == 10:\n            Check = \"X\"                              # 10 replaced by X\n        if str(Check) == Data[6]:                   # compare with 7th character\n            if Enqueue(Data[0:6]):                  # store first 6 characters\n                print(\"Item inserted\")\n            else:\n                print(\"Queue is full\")\n        else:\n            Invalid = Invalid + 1                   # count invalid items\n    print(\"Number of invalid items:\", Invalid)\n","confidence":"high"},{"id":"s24-42-1a","session":"s24","variant":"42","paper_code":"9618/42 May/June 2024","q":"1(a)","marks":6,"chapter":20,"subtopic":"text-file-read","prompt":"The procedure `ReadWords()`:\n\n- takes a file name as a parameter\n- opens the file and reads in the data\n- stores the main word in the first element in `WordArray`\n- stores each answer in a new element in `WordArray`\n- counts and stores the number of answers.\n\nWrite program code for the procedure `ReadWords()`. Write your answer in Python.","context_note":"A program outputs a main word and asks the user to enter the different words of 3 or more letters that can be made from the letters in the main word (the answers). There are 3 files: `Easy.txt`, `Medium.txt` and `Hard.txt` (supplied in the exam). Each file has the main word on the first line (for example the main word in Easy.txt is `house`) and each answer on a new line after it (Easy.txt has 14 answers). The words read from the file are stored in the global array `WordArray`; the number of answers is stored in the global variable `NumberWords`.","answer_type":"code","criteria":[{"point":"Procedure declaration taking a (string) file name parameter","key_terms":["def ReadWords(FileName):"]},{"point":"Declaration of the array (list) used to store the data read","key_terms":["WordArray = []"]},{"point":"Opens the file to read","key_terms":["open(FileName"]},{"point":"Uses exception handling (try / except) with an output message, e.g. file not found","key_terms":["try:","except","print("]},{"point":"Reads in the data for each line of the file and stores it in the array (main word first, then each answer in a new element)","key_terms":["for","append(","readlines","split"]},{"point":"Removes the newline / carriage-return character from each line","key_terms":["strip()","rstrip","replace(\"\\n\""]},{"point":"Counts the number of words (answers)","key_terms":["NumberWords","len("]},{"point":"Closes the file (may be done by the with statement)","key_terms":["close()","with open"]}],"max_note":"max 6 (eight points are listed in the scheme)","rejects":["The scheme's Python sample sets NumberWords = len(WordArray), which counts the main word as well; the question says the number of ANSWERS is stored, so accept NumberWords = len(WordArray) - 1 or the total including the main word if later code is consistent.","Accept any way of reading the lines (for loop over the file, readlines(), read().split()).","The main word must be in WordArray[0] and the answers in the following elements."],"final_answer":"WordArray = []                                      # array to store the data\nNumberWords = 0\n\ndef ReadWords(FileName):                            # takes the file name\n    global WordArray, NumberWords\n    WordArray = []\n    NumberWords = 0\n    try:                                            # exception handling\n        File = open(FileName, \"r\")                  # open file to read\n        for Line in File:\n            Word = Line.strip()                     # remove newline / carriage return\n            if Word != \"\":\n                WordArray.append(Word)              # main word first, then each answer\n        File.close()                                # close the file\n        NumberWords = len(WordArray) - 1            # number of answers (main word not counted)\n    except FileNotFoundError:\n        print(\"File not found\")\n","confidence":"high"},{"id":"s24-42-1b","session":"s24","variant":"42","paper_code":"9618/42 May/June 2024","q":"1(b)","marks":4,"chapter":19,"subtopic":"main-program","prompt":"The main program asks the user to enter \"easy\", \"medium\" or \"hard\" and calls `ReadWords()` with the filename that matches the user's input. For example, if the user enters \"easy\", the parameter is \"Easy.txt\".\n\nWrite program code for the main program. Write your answer in Python.","context_note":"A program outputs a main word and asks the user to enter the different words of 3 or more letters that can be made from the letters in the main word (the answers). There are 3 files: `Easy.txt`, `Medium.txt` and `Hard.txt` (supplied in the exam). Each file has the main word on the first line (for example the main word in Easy.txt is `house`) and each answer on a new line after it (Easy.txt has 14 answers). The words read from the file are stored in the global array `WordArray`; the number of answers is stored in the global variable `NumberWords`. `ReadWords(FileName)` (part 1(a)) reads the named file into `WordArray` and `NumberWords`.","answer_type":"code","criteria":[{"point":"Outputs a message asking the user to enter easy, medium or hard","key_terms":["print(","input(\"","easy"]},{"point":"Takes the input from the user","key_terms":["input("]},{"point":"Converts the input into the correct file name (Easy.txt / Medium.txt / Hard.txt)","key_terms":["Easy.t ers the user got right, and every answer that was entered is replaced by \"\" in `WordArray`. The new code goes after the loop that ends when the user enters \"no\".","answer_type":"code","criteria":[{"point":"Calculates and outputs the percentage of answers found (when 'no' is entered): found / number of answers x 100","key_terms":["/ NumberWords","* 100","print("]},{"point":"Has a method of identifying the answers not found, e.g. looping through the array and skipping the null values","key_terms":["for","!= \"\""]},{"point":"... and outputs those answers","key_terms":["print(WordArray["]}],"max_note":"max 3","rejects":["Accept the amended part on its own or the whole procedure.","The scheme's sample divides by NumberWords - 1 because its NumberWords includes the main word; accept either if consistent with the student's ReadWords.","Percentage may be shown as a decimal, rounded or with a % sign; do not accept a fraction/ratio with no x100.","The main word (index 0) must not be listed as a missed answer."],"final_answer":"def Play():\n    global WordArray, NumberWords\n    print(\"The main word is\", WordArray[0])                    # main word\n    print(\"There are\", NumberWords, \"answers\")                  # number of answers\n    WordArray[0] = \"\"\n    Found = 0\n    Entry = \"\"\n    while Entry != \"no\":                                        # until the user enters no\n        Entry = input(\"Enter a word or no to stop: \").lower()\n        if Entry != \"no\":\n            Correct = False\n            for Index in range(1, NumberWords + 1):             # compare with each answer, not the main word\n                if Entry != \"\" and Entry == WordArray[Index]:\n                    WordArray[Index] = \"\"                        # replace with null value\n                    Found = Found + 1                            # count answers found\n                    Correct = True\n            if Correct:\n                print(\"Correct, that is an answer\") umberArray` holds 100, 85, 644, 22, 15, 8, 1 in that order. (In the pseudocode, `<-` is the assignment arrow.)","answer_type":"code","criteria":[{"point":"Recursive function written with the recursive call RecursiveInsertion(IntegerArray, NumberElements - 1)","key_terms":["def RecursiveInsertion(","RecursiveInsertion(IntegerArray, NumberElements - 1)"]},{"point":"Correct base case (NumberElements <= 1) and return of the array","key_terms":["NumberElements <= 1","return IntegerArray"]},{"point":"Correct while loop control and internal statements (shifting items right, decrementing CheckItem, updating LoopAgain)","key_terms":["while LoopAgain","IntegerArray[CheckItem + 1] = IntegerArray[CheckItem]","CheckItem = CheckItem - 1"]},{"point":"All correct and the structure of the pseudocode is followed (LastItem, CheckItem set up, final IntegerArray[CheckItem + 1] = LastItem, return)","key_terms":["LastItem","IntegerArray[CheckItem + 1] = LastItem","return IntegerArray"]}],"max_note":"max 4","rejects":["The scheme's Python sample tests IntegerArray[CheckItem] <= LastItem (in both places) where the printed pseudocode has <; accept < or <= (they give the same result for this data).","The structure must be kept: do not replace the recursion with a loop for 3(b)(i)."],"final_answer":"def RecursiveInsertion(IntegerArray, NumberElements):    # recursive function\n    if NumberElements <= 1:                                # base case\n        return IntegerArray\n    RecursiveInsertion(IntegerArray, NumberElements - 1)   # recursive call\n    LastItem = IntegerArray[NumberElements - 1]\n    CheckItem = NumberElements - 2\n    LoopAgain = True\n    if CheckItem < 0:\n        LoopAgain = False\n    elif IntegerArray[CheckItem] < LastItem:\n        LoopAgain = False\n    while LoopAgain:                                       # while loop control\n        IntegerArray[CheckItem + 1] = IntegerArray[CheckItem]\n        CheckItem = CheckItem - 1\n        if CheckItem < 0:\n            Lo RecursiveInsertion()` but using iteration instead of recursion. Write your answer in Python.","context_note":"`RecursiveInsertion(IntegerArray, NumberElements)` (part 3(b)(i)) is the recursive insertion sort below (`<-` is the assignment arrow). The recursive call sorts the first NumberElements - 1 items before the last item is inserted. The new function takes the same two parameters and returns the sorted array.\n\n```\nDECLARE LastItem : INTEGER\nDECLARE CheckItem : INTEGER\nDECLARE LoopAgain : BOOLEAN\nFUNCTION RecursiveInsertion(IntegerArray : ARRAY[] OF INTEGER,\n                            NumberElements : INTEGER) RETURNS ARRAY[] OF INTEGER\n    IF NumberElements <= 1 THEN\n        RETURN IntegerArray\n    ELSE\n        CALL RecursiveInsertion(IntegerArray, NumberElements - 1)\n        LastItem <- IntegerArray[NumberElements - 1]\n        CheckItem <- NumberElements - 2\n    ENDIF\n    LoopAgain <- TRUE\n    IF CheckItem < 0 THEN\n        LoopAgain <- FALSE\n    ELSE\n        IF IntegerArray[CheckItem] < LastItem THEN\n            LoopAgain <- FALSE\n        ENDIF\n    ENDIF\n    WHILE LoopAgain\n        IntegerArray[CheckItem + 1] <- IntegerArray[CheckItem]\n        CheckItem <- CheckItem - 1\n        IF CheckItem < 0 THEN\n            LoopAgain <- FALSE\n        ELSE\n            IF IntegerArray[CheckItem] < LastItem THEN\n                LoopAgain <- FALSE\n            ENDIF\n        ENDIF\n    ENDWHILE\n    IntegerArray[CheckItem + 1] <- LastItem\n    RETURN IntegerArray\nENDFUNCTION\n```","answer_type":"code","criteria":[{"point":"Insertion algorithm written with the correct identifier IterativeInsertion and no recursion","key_terms":["def IterativeInsertion(IntegerArray, NumberElements):"]},{"point":"An external loop that works while there are still elements left to place (e.g. NumberElements > 0)","key_terms":["while","for"]},{"point":"Internal loop (the LoopAgain shifting loop) and selection (the comparisons) accurate","key_terms":["while LoopAgain"," 024","q":"3(d)(i)","marks":6,"chapter":19,"subtopic":"binary-search","prompt":"The recursive function `BinarySearch()` takes the parameters:\n\n- `IntegerArray` - an array of integers\n- `First` - the index of the first array element\n- `Last` - the index of the last array element\n- `ToFind` - an integer to search for in the array.\n\nThe function uses recursion to perform a binary search for `ToFind` in `IntegerArray`. The function returns the index where `ToFind` is stored or returns -1 if `ToFind` is not in the array.\n\nWrite program code for the recursive function `BinarySearch()`. Write your answer in Python.","context_note":"The array passed in is sorted into ascending order.","answer_type":"code","criteria":[{"point":"Recursive function BinarySearch taking the 4 indicated parameters","key_terms":["def BinarySearch(IntegerArray, First, Last, ToFind):"]},{"point":"Suitable base case (e.g. First > Last) ...","key_terms":["First > Last"]},{"point":"... returning -1","key_terms":["return -1"]},{"point":"Calculates the middle element","key_terms":["(First + Last) // 2","Middle"]},{"point":"Compares ToFind with the middle element and returns Middle if found","key_terms":["== ToFind","return Middle"]},{"point":"If ToFind is less than the middle: recursive call with Last as Middle - 1","key_terms":["BinarySearch(IntegerArray, First, Middle - 1, ToFind)"]},{"point":"If ToFind is more than the middle: recursive call with First as Middle + 1","key_terms":["BinarySearch(IntegerArray, Middle + 1, Last, ToFind)"]}],"max_note":"max 6 (seven points are listed in the scheme)","rejects":["Accept int((First + Last) / 2) for the middle.","The calls must be recursive and their results returned (a recursive call whose result is not returned does not earn the call marks).","An iterative solution is not accepted."],"final_answer":"def BinarySearch(IntegerArray, First, Last, ToFind):    # four parameters\n    if First > Last:                                    # base case\n        r  program code for `Enqueue()`. Write your answer in Python.","context_note":"A program stores positive integers in a circular queue. The queue is stored as a global 1D array of 20 integers with the identifier `Queue`; each index is initialised with the data -1. The global variable `HeadPointer`, initialised to -1, points to the first element in the queue. The global variable `TailPointer`, initialised to -1, points to the last element in the queue. The global variable `NumberItems`, initialised to 0, stores the number of items in the queue. The queue is circular, so the tail pointer moves back to index 0 after index 19 when there is space at the start of the array.","answer_type":"code","criteria":[{"point":"Function header taking 1 (integer) parameter and returning a Boolean value in all cases","key_terms":["def Enqueue(","return True","return False"]},{"point":"Checks if the queue is full (NumberItems = 20) and returns FALSE","key_terms":["NumberItems == 20","NumberItems >= 20","return False"]},{"point":"Checks if the queue is empty (NumberItems = 0 / TailPointer = -1) and updates TailPointer and HeadPointer appropriately (both to 0)","key_terms":["NumberItems == 0","TailPointer == -1","HeadPointer = 0","TailPointer = 0"]},{"point":"Increments TailPointer and NumberItems in an appropriate place ...","key_terms":["TailPointer + 1","TailPointer += 1","NumberItems + 1","NumberItems += 1"]},{"point":"... looping back to 0 for TailPointer if it is at the end of the structure (index 19)","key_terms":["== 20","= 0","% 20"]},{"point":"Stores the parameter in Queue[TailPointer] (after the increment) and returns TRUE","key_terms":["Queue[TailPointer] =","return True"]}],"max_note":"max 6","rejects":["Accept (TailPointer + 1) % 20 for the increment and wrap-around together.","The 'queue is empty' special case may be written as TailPointer == -1 or NumberItems == 0.","Accept HeadPointer being left unchanged on later calls (only set when the first item is added)."],"final_answer":"def Enqueue(InputData):                      # one parameter, returns Boolean in all cases\n    global Queue, HeadPointer, TailPointer, NumberItems\n    if NumberItems == 20:                    # queue is full\n        return False\n    if NumberItems == 0:                     # queue is empty: first item\n        HeadPointer = 0\n        TailPointer = 0\n    else:\n        TailPointer = TailPointer + 1        # move the tail on\n        if TailPointer == 20:                # wrap round to the start\n            TailPointer = 0\n    Queue[TailPointer] = InputData           # store the parameter\n    NumberItems = NumberItems + 1            # one more item\n    return True\n","confidence":"high"},{"id":"s25-41-1c","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"1(c)","marks":3,"chapter":19,"subtopic":"main-program","prompt":"The main program:\n\n- attempts to store each of the integers 1 to 25 (inclusive) in the queue in ascending numerical order using `Enqueue()`\n- outputs the integer that was passed to `Enqueue()` and \"Successful\" if it was stored in the queue, or \"Unsuccessful\" if it was not stored in the queue.\n\nFor example, if the integer 5 is passed to `Enqueue()` and is stored in the queue, the output will be: \"5 Successful\". If the integer 23 is passed to `Enqueue()` and is not stored in the queue, the output will be: \"23 Unsuccessful\".\n\nWrite program code for the main program. Write your answer in Python.","context_note":"A program stores positive integers in a circular queue. The queue is stored as a global 1D array of 20 integers with the identifier `Queue`; each index is initialised with the data -1. The global variable `HeadPointer`, initialised to -1, points to the first element in the queue. The global variable `TailPointer`, initialised to -1, points to the last element in the queue. The global variable `NumberItems`, initialised to 0, stores the number of items in the queue. The function `Enqueue(InputData)` (part 1(b)) returns True if the integer was stored and False if the queue was full.","answer_type":"code","criteria":[{"point":"Calls Enqueue() with each of the integers 1 to 25 (inclusive) in order","key_terms":["for","range(1, 26)","Enqueue("]},{"point":"Stores/uses the return value in a selection (if)","key_terms":["if","== True","Enqueue(X)"]},{"point":"Outputs the integer with \"Successful\" and the integer with \"Unsuccessful\" correctly","key_terms":["Successful","Unsuccessful","print("]}],"max_note":"max 3","rejects":["range(1, 26) is needed to include 25; range(1, 25) misses 25 and loses the first mark.","The integer must be output with the message, e.g. \"5 Successful\"."],"final_answer":"for X in range(1, 26):                  # integers 1 to 25 in order\n    Result = Enqueue(X)                 # call Enqueue and keep the return value\n    if Result == True:                  # selection on the return value\n        print(X, \"Successful\")\n    else:\n        print(X, \"Unsuccessful\")\n","confidence":"high"},{"id":"s25-41-1d","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"1(d)","marks":6,"chapter":19,"subtopic":"circular-queue","prompt":"The function `Dequeue()` returns -1 if the queue is empty. If the queue is not empty, the function returns the next item in the queue, updates the appropriate pointers and updates `NumberItems`.\n\nWrite program code for `Dequeue()`. Write your answer in Python.","context_note":"A program stores positive integers in a circular queue. The queue is stored as a global 1D array of 20 integers with the identifier `Queue`; each index is initialised with the data -1. The global variable `HeadPointer`, initialised to -1, points to the first element in the queue. The global variable `TailPointer`, initialised to -1, points to the last element in the queue. The global variable `NumberItems`, initialised to 0, stores the number of items in the queue. Items are added by `Enqueue()`, which wraps `TailPointer` back to 0 after index 19.","answer_type":"code","criteria":[{"point":"Dequeue() function header and checks if the queue is empty (NumberItems = 0) and returns -1","key_terms":["def Dequeue():","NumberItems == 0","return -1"]},{"point":"Returns the data at HeadPointer","key_terms":["Queue[HeadPointer]","return"]},{"point":"Increments HeadPointer ...","key_terms":["HeadPointer + 1","HeadPointer += 1"]},{"point":"... and catches if it equals 20 to return it to 0 (circular)","key_terms":["== 20","= 0","% 20"]},{"point":"Decrements NumberItems","key_terms":["NumberItems - 1","NumberItems -= 1"]},{"point":"Resets HeadPointer and TailPointer (to -1) when the queue becomes empty","key_terms":["HeadPointer = -1","TailPointer = -1"]}],"max_note":"max 6","rejects":["The value at HeadPointer must be read BEFORE HeadPointer is changed (otherwise the wrong item is returned).","Accept (HeadPointer + 1) % 20 for the increment and wrap-around together.","Accept clearing the vacated element to -1 as an extra, but it is not required."],"final_answer":"def Dequeue():\n    global Queue, HeadPointer, TailPointer, NumberItems\n    if NumberItems == 0:                     # empty queue\n        return -1\n    ReturnValue = Queue[HeadPointer]         # data at HeadPointer\n    HeadPointer = HeadPointer + 1            # move the head on\n    if HeadPointer == 20:                    # wrap round to the start\n        HeadPointer = 0\n    NumberItems = NumberItems - 1            # one fewer item\n    if NumberItems == 0:                     # queue now empty: reset pointers\n        HeadPointer = -1\n        TailPointer = -1\n    return ReturnValue\n","confidence":"high"},{"id":"s25-41-1ei","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"1(e)(i)","marks":2,"chapter":19,"subtopic":"main-program","prompt":"Write program code to extend the main program to call `Dequeue()` twice and output the return value each time. Write your answer in Python.","context_note":"A program stores positive integers in a circular queue. The queue is stored as a global 1D array of 20 integers with the identifier `Queue`; each index is initialised with the data -1. The global variable `HeadPointer`, initialised to -1, points to the first element in the queue. The global variable `TailPointer`, initialised to -1, points to the last element in the queue. The global variable `NumberItems`, initialised to 0, stores the number of items in the queue. The function `Dequeue()` (part 1(d)) returns the next item in the queue, or -1 if the queue is empty. The main program has already tried to enqueue the integers 1 to 25.","answer_type":"code","criteria":[{"point":"Calls Dequeue() twice","key_terms":["Dequeue()"]},{"point":"... and outputs the return value from both calls","key_terms":["print("]}],"max_note":"max 2","rejects":["Accept print(Dequeue()) twice, or storing each result in a variable then printing it."],"final_answer":"NextValue = Dequeue()          # first call\nprint(NextValue)                # output the returned value\nNextValue = Dequeue()          # second call\nprint(NextValue)\n","confidence":"high"},{"id":"s25-41-2a","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"2(a)","marks":7,"chapter":20,"subtopic":"text-file-read","prompt":"The function `ReadData()`:\n\n- prompts the user to enter a filename and reads this filename from the user\n- opens the file and reads each line of data into a 1D array\n- returns the populated 1D array.\n\nThe function needs to work for a file that contains an unknown number of lines.\n\nWrite program code for `ReadData()`. Write your answer in Python.","context_note":"A program reads data from a text file, splits the data depending on its content and stores the separated data into different files. The text file `TheData.txt` contains 72 lines of data. Each line has an integer and a string colour separated by a comma; the first line is `10,red` (the integer is 10 and the colour is \"red\"). The file contains six different colours: red, green, blue, orange, yellow, pink. The files are supplied in the exam.","answer_type":"code","criteria":[{"point":"Function header (and end) for ReadData","key_terms":["def ReadData():"]},{"point":"Prompts the user to enter a filename and reads the input","key_terms":["input("]},{"point":"Opens the file to read and closes it in an appropriate place","key_terms":["open(","close()","with open"]},{"point":"Loops until the end of the file (unknown number of lines) ...","key_terms":["for Line in","while","readlines"]},{"point":"... reading each line in the file ...","key_terms":["for Line in","readline"]},{"point":"... (removing the line break and) inserting each line in the array","key_terms":["append(","strip()"]},{"point":"Returns the populated array","key_terms":["return"]},{"point":"Exception handling (try / except) with an appropriate output","key_terms":["try:","except","print("]}],"max_note":"max 7 (eight points are listed in the scheme)","rejects":["Accept for Line in File, readlines(), or a while loop with readline() until an empty string.","Accept except with or without a named exception, as long as an output message is given.","The array must be returned (not printed)."],"final_answer":"def ReadData():                                      # function header\n    DataList = []                                   # the 1D array\n    FileName = input(\"Enter the filename: \")        # prompt and read filename\n    try:                                            # exception handling\n        File = open(FileName, \"r\")                  # open file to read\n        for Line in File:                           # loop to end of file, any number of lines\n            DataList.append(Line.strip())           # remove line break, insert in array\n        File.close()                                # close file\n    except FileNotFoundError:\n        print(\"Cannot open file\")                   # appropriate output\n    return DataList                                 # return populated array\n","confidence":"high"},{"id":"s25-41-2b","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"2(b)","marks":6,"chapter":19,"subtopic":"string-handling","prompt":"The procedure `SplitData()` takes a 1D string array as a parameter with the identifier `DataArray`.\n\nThe procedure declares six 1D arrays: one array for each colour that appears in the file (red, green, blue, orange, yellow, pink).\n\nThe procedure accesses each string in `DataArray`. The data in each string is split into the integer and the colour. The integer is stored in the array that matches the colour.\n\nFor example, the first string in `DataArray` has the integer 10 and the colour red, so the integer 10 is stored in the array for the colour red.\n\nWrite program code for `SplitData()`. Write your answer in Python.","context_note":"A program reads data from a text file, splits the data depending on its content and stores the separated data into different files. The text file `TheData.txt` contains 72 lines of data. Each line has an integer and a string colour separated by a comma; the first line is `10,red` (the integer is 10 and the colour is \"red\"). The file contains six different colours: red, green, blue, orange, yellow, pink. The files are supplied in the exam. `DataArray` is the list returned by `ReadData()`: one string per line, such as \"10,red\".","answer_type":"code","criteria":[{"point":"Procedure header (and end) taking the 1D array DataArray as a parameter","key_terms":["def SplitData(DataArray):"]},{"point":"Declaration/use of 6 arrays (lists), one for each colour","key_terms":["Red = []","Green = []","Blue = []","Orange = []","Yellow = []","Pink = []"]},{"point":"Loops through each line in the parameter DataArray ...","key_terms":["for Line in DataArray","for"]},{"point":"... splitting each line by the comma","key_terms":["split(\",\")"]},{"point":"Compares the second value (the colour) with each colour to select the array ...","key_terms":["== \"red\"","Colour","[1]"]},{"point":"... and stores the first value (the integer) in the correct array","key_terms":["Red.append(","append("]}],"max_note":"max 6","rejects":["Accept the integer being stored as a string (as in the scheme's sample) or converted with int().","Accept a dictionary of six lists, or six separate lists; the scheme's sample uses six separately named lists.","The colour value must be trimmed of any trailing newline/space before comparing, otherwise matches fail; accept .strip() or equivalent."],"final_answer":"def SplitData(DataArray):\n    Red = []                                     # one array for each colour\n    Green = []\n    Blue = []\n    Orange = []\n    Yellow = []\n    Pink = []\n    for Line in DataArray:                       # each string in DataArray\n        Parts = Line.split(\",\")                  # split into integer and colour\n        Number = int(Parts[0])\n        Colour = Parts[1].strip()\n        if Colour == \"red\":                      # compare colour to select the array\n            Red.append(Number)                   # store the integer in the matching array\n        elif Colour == \"green\":\n            Green.append(Number)\n        elif Colour == \"blue\":\n            Blue.append(Number)\n        elif Colour == \"orange\":\n            Orange.append(Number)\n        elif Colour == \"yellow\":\n            Yellow.append(Number)\n        elif Colour == \"pink\":\n            Pink.append(Number)\n","confidence":"high"},{"id":"s25-41-2c","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"2(c)","marks":5,"chapter":20,"subtopic":"text-file-write","prompt":"The procedure `StoreData()`:\n\n- takes two parameters: a 1D array `DataToStore` and a filename\n- opens the text file with the filename that is passed as a parameter\n- appends each item of data from `DataToStore` to a new line in the text file\n- uses exception handling when opening and writing data to the text file.\n\nWrite program code for `StoreData()`. Write your answer in Python.","context_note":"A program reads data from a text file, splits the data depending on its content and stores the separated data into different files. The text file `TheData.txt` contains 72 lines of data. Each line has an integer and a string colour separated by a comma; the first line is `10,red` (the integer is 10 and the colour is \"red\"). The file contains six different colours: red, green, blue, orange, yellow, pink. The files are supplied in the exam. `DataToStore` is a list of the numbers for one colour.","answer_type":"code","criteria":[{"point":"Procedure header taking the 1D array and a filename as parameters, opening the file to append, and closing the file (in an appropriate place)","key_terms":["def StoreData(DataToStore, FileName):","open(FileName, \"a\")","close()"]},{"point":"Loops through each item in the array parameter ...","key_terms":["for"]},{"point":"... writing each item to the file ...","key_terms":["write("]},{"point":"... with a new line break between each item","key_terms":["\\n"]},{"point":"Exception handling (try / except) with a suitable output","key_terms":["try:","except","print("]}],"max_note":"max 5","rejects":["The file must be opened in append mode (\"a\" or \"a+\"); write mode (\"w\") does not satisfy 'appends' (the scheme's VB/Java samples overwrite or append, but the question and the Python sample use append).","Numbers must be converted with str() before writing if the array holds integers; accept items already strings.","Accept writelines/print(..., file=File) producing one item per line."],"final_answer":"def StoreData(DataToStore, FileName):               # array and filename parameters\n    try:                                            # exception handling\n        File = open(FileName, \"a\")                  # open file to append\n        for Item in DataToStore:                    # each item in the array\n            File.write(str(Item) + \"\\n\")            # write it, then a line break\n        File.close()                                # close the file\n    except:\n        print(\"Cannot open or write to the file\")   # suitable output\n","confidence":"high"},{"id":"s25-41-2d","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"2(d)","marks":2,"chapter":20,"subtopic":"file-handling-other","prompt":"Each of the six colours has a blank text file where the numbers will be stored. The names of these six text files are Blue.txt, Green.txt, Orange.txt, Pink.txt, Red.txt and Yellow.txt.\n\nThe procedure `SplitData()` needs amending to call `StoreData()` six times, with each of the six colour arrays and the name of the text file that corresponds to that colour.\n\nFor example, `StoreData()` will be called with the red array and the file name \"Red.txt\".\n\nWrite program code to amend `SplitData()`. Write your answer in Python.","context_note":"A program reads data from a text file, splits the data depending on its content and stores the separated data into different files. The text file `TheData.txt` contains 72 lines of data. Each line has an integer and a string colour separated by a comma; the first line is `10,red` (the integer is 10 and the colour is \"red\"). The file contains six different colours: red, green, blue, orange, yellow, pink. The files are supplied in the exam. `SplitData(DataArray)` (part 2(b)) builds six lists named Red, Green, Blue, Orange, Yellow and Pink. `StoreData(DataToStore, FileName)` (part 2(c)) appends each item of the list to the named file. The six calls go at the end of `SplitData()`, after the loop.","answer_type":"code","criteria":[{"point":"Calls StoreData() with one colour array and its matching file name","key_terms":["StoreData(Red, \"Red.txt\")"]},{"point":"Calls StoreData() with the remaining 5 arrays and their matching file names","key_terms":["StoreData(Green, \"Green.txt\")","StoreData(Blue, \"Blue.txt\")","StoreData(Orange, \"Orange.txt\")","StoreData(Yellow, \"Yellow.txt\")","StoreData(Pink, \"Pink.txt\")"]}],"max_note":"max 2","rejects":["The calls must come after all the data has been split (not inside the loop), otherwise items are written repeatedly.","Accept the six calls in any order, or a loop over pairs of (list, filename)."],"final_answer":"def SplitData(DataArray):\n    Red = []                                     # one array for each colour\n    Green = []\n    Blue = []\n    Orange = []\n    Yellow = []\n    Pink = []\n    for Line in DataArray:                       # each string in DataArray\n        Parts = Line.split(\",\")                  # split into integer and colour\n        Number = int(Parts[0])\n        Colour = Parts[1].strip()\n        if Colour == \"red\":                      # compare colour to select the array\n            Red.append(Number)                   # store the integer in the matching array\n        elif Colour == \"green\":\n            Green.append(Number)\n        elif Colour == \"blue\":\n            Blue.append(Number)\n        elif Colour == \"orange\":\n            Orange.append(Number)\n        elif Colour == \"yellow\":\n            Yellow.append(Number)\n        elif Colour == \"pink\":\n            Pink.append(Number)\n    StoreData(Red, \"Red.txt\")                    # added for 2(d): one call per colour array\n    StoreData(Green, \"Green.txt\")\n    StoreData(Blue, \"Blue.txt\")\n    StoreData(Orange, \"Orange.txt\")\n    StoreData(Yellow, \"Yellow.txt\")\n    StoreData(Pink, \"Pink.txt\")\n","confidence":"high"},{"id":"s25-41-2ei","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"2(e)(i)","marks":3,"chapter":19,"subtopic":"main-program","prompt":"The main program calls `ReadData()` and then `SplitData()`.\n\nWrite program code for the main program. Write your answer in Python.","context_note":"`ReadData()` returns a 1D array of the lines read from the file. `SplitData(DataArray)` takes that array as its parameter.","answer_type":"code","criteria":[{"point":"Calls ReadData() ...","key_terms":["ReadData()"]},{"point":"... and stores/uses the return value","key_terms":["= ReadData()"]},{"point":"Calls SplitData() with the returned array as the parameter","key_terms":["SplitData(DataFromFile)","SplitData("]}],"max_note":"max 3","rejects":["Accept SplitData(ReadData()) as a single statement (it earns all three marks)."],"final_answer":"DataFromFile = ReadData()         # call ReadData and store the returned array\nSplitData(DataFromFile)           # call SplitData with the array\n","confidence":"high"},{"id":"s25-41-3ai","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"3(a)(i)","marks":4,"chapter":20,"subtopic":"class-definition","prompt":"Write program code to declare the class `Node` and its constructor.\n\nDo not declare the other methods.\n\nUse your programming language appropriate constructor.\n\nIf you are writing in Python, include attribute declarations using comments.\n\nWrite your answer in Python.","context_note":"A program stores data in a binary tree that is designed using object-oriented programming. The tree stores data in ascending numerical order, for example (root 30; 20 and 45 below it; 1, 21, 33 and 63 below those).\n\nThe class `Node` stores data about the nodes:\n\n| Attribute / method | Description |\n|---|---|\n| NodeData : Integer | the node's integer data |\n| LeftNode : Node | the node to the left of the current node, or a null value if there is no node to the left |\n| RightNode : Node | the node to the right of the current node, or a null value if there is no node to the right |\n| Constructor() | initialises NodeData to its parameter value; initialises LeftNode and RightNode to a null value |\n| GetLeft() | returns LeftNode |\n| GetRight() | returns RightNode |\n| GetData() | returns NodeData |\n| SetLeft() | takes an object of type Node as a parameter and stores it in LeftNode |\n| SetRight() | takes an object of type Node as a parameter and stores it in RightNode |\n","answer_type":"code","criteria":[{"point":"Class header for Node (and end where appropriate)","key_terms":["class Node"]},{"point":"Constructor header (and end) with at least one (integer) parameter, within the class","key_terms":["def __init__(self, pNodeData):"]},{"point":"The 3 attributes (NodeData, LeftNode, RightNode) with correct data types (Python: shown in comments)","key_terms":["# integer","# Node","self.__NodeData","self.__LeftNode","self.__RightNode"]},{"point":"NodeData has the parameter assigned; LeftNode and RightNode are assigned null (None) within the constructor","key_terms":["self.__NodeData = pNodeData","= None"]}],"max_note":"max 4","rejects":["Null in Python is None.","The scheme's sample uses double-underscore (private) attributes; accept public attributes consistently used.","Python data types are shown by comments such as #integer and #node."],"final_answer":"class Node:\n    # private NodeData : INTEGER\n    # private LeftNode : Node\n    # private RightNode : Node\n    def __init__(self, pNodeData):            # constructor with a parameter\n        self.__NodeData = pNodeData           # parameter assigned to NodeData\n        self.__LeftNode = None                # null value\n        self.__RightNode = None               # null value\n","confidence":"high"},{"id":"s25-41-3aii","session":"s25","variant":"41","paper_code":"9618/41 May/June 2025","q":"3(a)(ii)","marks":3,"chapter":20,"subtopic":"getters-setters","prompt":"Write program code for the three get methods `GetLeft()`, `GetRight()` and `GetData()`. Write your answer in Python.","context_note":"A program stores data in a binary tree that is designed using object-oriented programming. The tree stores data in ascending numerical order, for example (root 30; 20 and 45 below it; 1, 21, 33 and 63 below those).\n\nThe class `Node` stores data about the nodes:\n\n| Attribute / method | Description |\n|---|---|\n| NodeData :
