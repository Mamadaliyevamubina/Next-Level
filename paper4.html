rder must follow the pointers (1, 5, 2, 6, 56, 7), not the array order."],"final_answer":"def outputNodes(linkedList, currentPointer):          # procedure with array and start pointer (2 marks)\n    while currentPointer != -1:                        # loop until pointer is -1 (1 mark)\n        print(linkedList[currentPointer].data)         # output data following pointers, correct fields (2 marks)\n        currentPointer = linkedList[currentPointer].nextNode   # move to next node (1 mark)","confidence":"high"},{"id":"s21-41-1di","session":"s21","variant":"41","paper_code":"9618/41 May/June 2021","q":"1(d)(i)","marks":7,"chapter":19,"subtopic":"linked-list","prompt":"The function `addNode()` takes the linked list and pointers as parameters, then takes as input the data to be added to the end of the `linkedList`.\n\nThe function adds the node in the next available space, updates the pointers and returns `True`. If there are no empty nodes, it returns `False`.\n\nWrite program code for the function `addNode()`.\n\nWrite your answer in Python.","context_note":"An unordered linked list uses a 1D array to store the data. Each item in the linked list is of a record type `node` with an integer field `data` and an integer field `nextNode` (a pointer to the next node, -1 meaning the end of the list). The list is held in a 1D array and the current contents are:\n\n| Index | data | nextNode |\n|---|---|---|\n| 0 | 1 | 1 |\n| 1 | 5 | 4 |\n| 2 | 6 | 7 |\n| 3 | 7 | -1 |\n| 4 | 2 | 2 |\n| 5 | 0 | 6 |\n| 6 | 0 | 8 |\n| 7 | 56 | 3 |\n| 8 | 0 | 9 |\n| 9 | 0 | -1 |\n\nstartPointer = 0, emptyList = 5\n\n`startPointer` points to the first node of the list (index 0) and `emptyList` points to the first free node (index 5), so the free nodes are linked 5, 6, 8, 9 and the list ends with -1.\n\nThe record type is:\n\n```python\nclass node:\n    def __init__(self, theData, nextNodeNumber):\n        self.data = theData\n        self.nextNode = nextNodeNumber\n```\n\nThe main program declares ` ark)\n    dataToAdd = int(input(\"Enter the data to add: \"))\n    # check list full (1 mark) and return False (1 mark)\n    if emptyPtr == -1:\n        return False\n    newIndex = emptyPtr\n    # remember the next free node before it is overwritten\n    nextEmpty = linkedList[newIndex].nextNode\n    # insert data into the empty node (1 mark)\n    linkedList[newIndex].data = dataToAdd\n    linkedList[newIndex].nextNode = -1\n    # follow pointers to the last node (1 mark)\n    current = startPointer\n    while linkedList[current].nextNode != -1:\n        current = linkedList[current].nextNode\n    # last node now points to the new node (1 mark)\n    linkedList[current].nextNode = newIndex\n    # empty-list pointer moves on to the next free node (1 mark)\n    emptyList = nextEmpty\n    # success (1 mark)\n    return True","confidence":"high"},{"id":"s21-41-1dii","session":"s21","variant":"41","paper_code":"9618/41 May/June 2021","q":"1(d)(ii)","marks":3,"chapter":19,"subtopic":"main-program","prompt":"Edit the main program to:\n\n- call `addNode()`\n- output an appropriate message depending on the result returned from `addNode()`\n- call `outputNodes()` twice; once before calling `addNode()` and once after calling `addNode()`.\n\nWrite your answer in Python (the whole main program, including the declarations from part (b)).","context_note":"An unordered linked list uses a 1D array to store the data. Each item in the linked list is of a record type `node` with an integer field `data` and an integer field `nextNode` (a pointer to the next node, -1 meaning the end of the list). The list is held in a 1D array and the current contents are:\n\n| Index | data | nextNode |\n|---|---|---|\n| 0 | 1 | 1 |\n| 1 | 5 | 4 |\n| 2 | 6 | 7 |\n| 3 | 7 | -1 |\n| 4 | 2 | 2 |\n| 5 | 0 | 6 |\n| 6 | 0 | 8 |\n| 7 | 56 | 3 |\n| 8 | 0 | 9 |\n| 9 | 0 | -1 |\n\nstartPointer = 0, emptyList = 5\n\n`startPointer` points to the first node of the list (index 0) and `emptyList` points to the first free node (index 5), so the free nodes are linked 5, 6, 8, 9 and the list ends with -1.\n\nThe record type and the two subprograms written earlier are:\n\n```python\nclass node:\n    def __init__(self, theData, nextNodeNumber):\n        self.data = theData\n        self.nextNode = nextNodeNumber\n```\n\n```python\ndef outputNodes(linkedList, currentPointer):\n    while currentPointer != -1:\n        print(linkedList[currentPointer].data)\n        currentPointer = linkedList[currentPointer].nextNode\n```\n\n```python\ndef addNode(linkedList, startPointer, emptyPtr):\n    global emptyList\n    dataToAdd = int(input(\"Enter the data to add: \"))\n    if emptyPtr == -1:\n        return False\n    newIndex = emptyPtr\n    nextEmpty = linkedList[newIndex].nextNode\n    linkedList[newIndex].data = dataToAdd\n    linkedList[newIndex].nextNode = -1\n    current = startPointer\n    while linkedList[current].nextNode != -1:\n        current = linkedList[current].nextNode\n    linkedList[current].nextNode = newIndex\n    emptyList = nextEmpty\n    return True\n```","answer_type":"code","criteria":[{"point":"Calls addNode() with the list, start pointer and empty list pointer, and stores/checks the returned value ...","key_terms":["addNode(linkedList, startPointer, emptyList)","returnValue","if"]},{"point":"... outputs an appropriate message if True is returned and a different message if False is returned","key_terms":["print(","else"]},{"point":"Calls outputNodes() with the list and start pointer both before and after addNode()","key_terms":["outputNodes(linkedList, startPointer)"]}],"max_note":"max 3","rejects":["The call to addNode() must pass the list and both pointers; a call with no arguments does not earn the first mark.","Accept the declarations of linkedList, startPointer and emptyList being included in the answer or assumed from part (b)."],"final_answer":"linkedList = [node(1,1), node(5,4), node(6,7), node(7,-1), node(2,2),\n              node(0,6), node(0,8), node(56,3) ate message to tell the user whether the search value was found or not.\n\nWrite your answer in Python.","context_note":"A program stores the following ten integers in a 1D array with the identifier `arrayData`:\n\n| 10 | 5 | 6 | 7 | 1 | 12 | 13 | 15 | 21 | 8 |\n|---|---|---|---|---|---|---|---|---|---|\n\nThe global array and the function from part (b)(i) are:\n\n```python\narrayData = [10, 5, 6, 7, 1, 12, 13, 15, 21, 8]\n\ndef linearSearch(searchValue):\n    for x in range(0, 10):\n        if arrayData[x] == searchValue:\n            return True\n    return False\n```","answer_type":"code","criteria":[{"point":"Takes a value as input ...","key_terms":["input("]},{"point":"... checking/casting it to an integer","key_terms":["int("]},{"point":"Calls linearSearch() and sends the input as the parameter","key_terms":["linearSearch(searchValue)","linearSearch("]},{"point":"Stores and checks the returned value ...","key_terms":["returnValue","if"]},{"point":"... outputs an appropriate message if found and a different one if not found","key_terms":["print(","else"]}],"max_note":"max 4 (five mark points are listed in the scheme)","rejects":["Accept the function call used directly in the if condition instead of being stored first."],"final_answer":"searchValue = int(input(\"Enter the number to search for: \"))   # input cast to integer\nreturnValue = linearSearch(searchValue)                         # call with the input, store result\nif returnValue:                                                 # check returned value\n    print(\"It was found\")                                       # message if found\nelse:\n    print(\"It was not found\")                                   # message if not found","confidence":"high"},{"id":"s21-41-2c","session":"s21","variant":"41","paper_code":"9618/41 May/June 2021","q":"2(c)","marks":6,"chapter":19,"subtopic":"bubble-sort","prompt":"The following bubble sort pseudocode algorithm sorts the data in `theArray` into descending numerical order. There are five incomplete statements.\n\n```\nPROCEDURE bubbleSort()\n    DECLARE temp : INTEGER\n    FOR x <- 0 TO ..........\n        FOR y <- 0 TO ..........\n            IF theArray[y] .......... theArray[y + 1] THEN\n                temp <- theArray[y]\n                theArray[y] <- ..........\n                theArray[y + 1] <- ..........\n            ENDIF\n        NEXT y\n    NEXT x\nENDPROCEDURE\n```\n\nWrite program code for the procedure `bubbleSort()` to sort the data in `arrayData` into descending order.\n\nWrite your answer in Python.","context_note":"A program stores the following ten integers in a 1D array with the identifier `arrayData`:\n\n| 10 | 5 | 6 | 7 | 1 | 12 | 13 | 15 | 21 | 8 |\n|---|---|---|---|---|---|---|---|---|---|\n\n`arrayData` is a global 1D array holding these ten values. In the pseudocode `theArray` refers to `arrayData`.","answer_type":"code","criteria":[{"point":"Correct outer loop stop (x runs 0 to 9, i.e. 10 passes)","key_terms":["range(0, 10)","range(10)"]},{"point":"Correct inner loop stop (y runs 0 to 8 so that y + 1 never goes past index 9)","key_terms":["range(0, 9)","range(9)"]},{"point":"Correct comparison operator: < in the IF (swap when the left value is smaller, giving descending order)","key_terms":["<"]},{"point":"Correct element theArray[y + 1] / arrayData[y + 1] used in the comparison and the swap","key_terms":["[y + 1]","[y+1]"]},{"point":"Correct use of temp: the final assignment is arrayData[y + 1] = temp","key_terms":["temp"]},{"point":"The remainder matches the pseudocode (temp = arrayData[y]; arrayData[y] = arrayData[y + 1])","key_terms":["temp = arrayData[y]","arrayData[y] = arrayData[y + 1]"]}],"max_note":"max 6","rejects":["The array to sort is arrayData (the question says so); accept it being referred to via the pseudocode name only if the code still sorts arrayData.","Equivalent loop bounds that give the same passes (e.g. range(10) and range(9), or while loops) are fine. An inner bound of 10 causes an index error and does not earn the inner-loop mark."],"final_answer":"def bubbleSort():\n    for x in range(0, 10):                       # outer loop stop (1 mark)\n        for y in range(0, 9):                    # inner loop stop (1 mark)\n            if arrayData[y] < arrayData[y + 1]:  # < gives descending order, uses y + 1 (2 marks)\n                temp = arrayData[y]              # remainder as pseudocode (1 mark)\n                arrayData[y] = arrayData[y + 1]\n                arrayData[y + 1] = temp          # correct temp (1 mark)","confidence":"high"},{"id":"s21-41-3a","session":"s21","variant":"41","paper_code":"9618/41 May/June 2021","q":"3(a)","marks":5,"chapter":20,"subtopic":"class-definition","prompt":"Write program code to declare the class `TreasureChest`.\n\nDo not write any other methods (apart from the constructor that creates an instance of an object).\n\nThe attributes are private.\n\nIf you are using the Python programming language, include attribute declarations using comments.\n\nWrite your answer in Python.","context_note":"A computer game requires users to travel around a world to find and open treasure chests. Each treasure chest has a mathematics question inside. The user enters the answer. The number of points awarded depends on the number of attempts before the user gives the correct answer. The program uses object-oriented programming. The class diagram for `TreasureChest` is:\n\n| TreasureChest | |\n|---|---|\n| question : STRING | stores the question |\n| answer : INTEGER | stores the answer |\n| points : INTEGER | stores the maximum possible number of points available for this chest |\n| constructor() | takes question, answer and points as parameters and creates an instance of an object |\n| getQuestion() | returns the question |\n| checkAnswer() | takes the user's answer as a parameter and returns True if it is correct, otherwise returns False |\n| getPoints() | takes the number of attempts as a parameter and returns t worth 100 points and the user took 2 attempts to give the correct answer. The user is awarded 50 points (100 DIV 2).\n\nWrite the method `getPoints()`.\n\nWrite your answer in Python.","context_note":"A computer game requires users to travel around a world to find and open treasure chests. Each treasure chest has a mathematics question inside. The user enters the answer. The number of points awarded depends on the number of attempts before the user gives the correct answer. The program uses object-oriented programming. The class diagram for `TreasureChest` is:\n\n| TreasureChest | |\n|---|---|\n| question : STRING | stores the question |\n| answer : INTEGER | stores the answer |\n| points : INTEGER | stores the maximum possible number of points available for this chest |\n| constructor() | takes question, answer and points as parameters and creates an instance of an object |\n| getQuestion() | returns the question |\n| checkAnswer() | takes the user's answer as a parameter and returns True if it is correct, otherwise returns False |\n| getPoints() | takes the number of attempts as a parameter and returns the number of points awarded |\n\nThe class so far (the method is written inside this class):\n\n```python\nclass TreasureChest:\n    # Private question : STRING\n    # Private answer : INTEGER\n    # Private points : INTEGER\n    def __init__(self, questionP, answerP, pointsP):\n        self.__question = questionP\n        self.__answer = answerP\n        self.__points = pointsP\n```","answer_type":"code","criteria":[{"point":"Method getPoints taking the number of attempts as a parameter and returning an integer","key_terms":["def getPoints","attempts"]},{"point":"If attempts is 1, returns points","key_terms":["attempts == 1","return self.__points"]},{"point":"If attempts is 2, returns points DIV 2","key_terms":["attempts == 2","// 2"]},{"point":"If attempts is 3 or 4, returns points DIV 4","key_terms":["attempts == 3","attempts == 4","// 4"]},{"point":"Otherwise returns 0","key_terms":["else","return 0"]}],"max_note":"max 5","rejects":["DIV must be integer division (// in Python or int(points / 2)); 100 DIV 2 = 50. Accept int() around the stored points if it was read as a string.","Accept `attempts in (3, 4)` or `3 <= attempts <= 4` for the 3-or-4 test."],"final_answer":"    # method inside class TreasureChest\n    def getPoints(self, attempts):           # takes attempts (1 mark)\n        if attempts == 1:\n            return self.__points             # 1 attempt: all points (1 mark)\n        elif attempts == 2:\n            return self.__points // 2        # 2 attempts: DIV 2 (1 mark)\n        elif attempts == 3 or attempts == 4:\n            return self.__points // 4        # 3 or 4 attempts: DIV 4 (1 mark)\n        else:\n            return 0                         # otherwise 0 (1 mark)","confidence":"high"},{"id":"s21-41-3civ","session":"s21","variant":"41","paper_code":"9618/41 May/June 2021","q":"3(c)(iv)","marks":7,"chapter":20,"subtopic":"main-program","prompt":"The main program repeats each question until the user inputs the correct answer. The number of points awarded depends on the number of attempts before the user gives the correct answer.\n\nWrite program code for the main program to:\n\n- call the procedure `readData()`\n- ask the user to enter a question number between 1 and 5\n- output the question that matches the question number entered by the user\n- check if the answer input by the user is correct using the method `checkAnswer()`\n- repeat the question until the user inputs the correct answer\n- count how many times the user attempted the question\n- use the method `getPoints()` to return the number of points awarded\n- output the number of points the user is awarded.\n\nWrite your answer in Python.","context_note":"A computer game requires users to travel around a world to find and open treasure chests. Each treasure chest has a mathematics question inside. The user enters the answer. The number of points awarded depends on the number of attempts before the user gives the correct answer. The program uses object-oriented programming. The class diagram for `TreasureChest` is:\n\n| TreasureChest | |\n|---|---|\n| question : STRING | stores the question |\n| answer : INTEGER | stores the answer |\n| points : INTEGER | stores the maximum possible number of points available for this chest |\n| constructor() | takes question, answer and points as parameters and creates an instance of an object |\n| getQuestion() | returns the question |\n| checkAnswer() | takes the user's answer as a parameter and returns True if it is correct, otherwise returns False |\n| getPoints() | takes the number of attempts as a parameter and returns the number of points awarded |\n\nThe text file `TreasureChestData.txt` is supplied in the exam. It stores data for five questions, in the order question, answer, points, one item per line (15 lines). For example, the first three lines of the file are for the first question:\n\n```\n2*2\n4\n10\n```\n\n(the first line is the question, the second the answer, the third the points).\n\nThe class (with the methods you wrote in earlier parts) and the procedure `readData()` fill a global list `arrayTreasure` of `TreasureChest` objects (question 1 is at index 0):\n\n```python\nclass TreasureChest:\n    # Private question : STRING\n    # Private answer : INTEGER\n    # Private points : INTEGER\n    def __init__(self, questionP, answerP, pointsP):\n        self.__question = questionP\n        self.__answer = answerP\n        self.__points = pointsP\n\n    def getQuestion(self):\n        return self.__question\n\n    def checkAnswer(self, answerP):\n        if self.__answer == answerP:\n            return True\n        else:\n            return False\n\n    def getPoints(self, attempts):\n        if attempts == 1:\n            return self.__points\n        elif attempts == 2:\n            return self.__points // 2\n        elif attempts == 3 or attempts == 4:\n            return self.__points // 4\n        else:\n            return 0\n\narrayTreasure = []\n\ndef readData():\n    try:\n        file = open(\"TreasureChestData.txt\", \"r\")\n        line = file.readline().strip()\n        while line != \"\":\n            question = line\n            answer = int(file.readline().strip())\n            points = int(file.readline().strip())\n            arrayTreasure.append(TreasureChest(question, answer, points))\n            line = file.readline().strip()\n        file.close()\n    except IOError:\n        print(\"Could not find file\")\n```","answer_type":"code","criteria":[{"point":"Calls the procedure readData()","key_terms":["readData()"]},{"point":"Takes the question number as input from the user ...","key_terms":["input(","int("]},{"point":"... validated to be between 1 and 5","key_terms":["1","5","while","if"]},{"point":"Outputs the question stored at the user's chosen number (index = number - 1)","key_terms":["arrayTreasure[","- 1","getQuestion()"]},{"point":"Reads the user's answer from the keyboard","key_terms":["input(","int("]},{"point":"Checks the answer input against the question's answer (using checkAnswer()) ...","key_terms":["checkAnswer("]},{"point":"... looping until the answer is correct","key_terms":["while","not","== False"]},{"point":"Keeps track of the number of attempts using a variable","key_terms":["attempts","+= 1","+ 1"]},{"point":"Calls getPoints() sending the number of attempts as the parameter ...","key_terms":["getPoints(attempts)"]},{"point":"... and outputs the number of points returned","key_terms":["print("]},{"point":"Uses .getQuestion() and .checkAnswer() on the object at the chosen question number to access the question and check the answer","key_terms":[".getQuestion()",".checkAnswer("]}],"max_note":"max 7 (the scheme lists eleven mark points)","rejects":["The answer typed by the user must be converted to an integer before calling checkAnswer(), because the stored answer is an intege imal` to store the names of up to 20 animals.\n- 1D array `Colour` to store the names of up to 10 colours.\n- `AnimalTopPointer` to point to the next free space in the array `Animal`, initialised to 0.\n- `ColourTopPointer` to point to the next free space in the array `Colour`, initialised to 0.\n\nWrite program code to declare the global arrays and variables.\n\nWrite your answer in Python.","context_note":"A program implements two stacks using 1D arrays. One stack stores the names of colours. One stack stores the names of animals.","answer_type":"code","criteria":[{"point":"Declares the global array Animal (20 string elements)","key_terms":["Animal","20"]},{"point":"Declares the global array Colour (10 string elements)","key_terms":["Colour","10"]},{"point":"Declares AnimalTopPointer and ColourTopPointer, both initialised to 0","key_terms":["AnimalTopPointer = 0","ColourTopPointer = 0"]}],"max_note":"max 3","rejects":["Accept an empty list (with a comment saying 20/10 elements, as the scheme does) or a pre-sized list such as [\"\"] * 20."],"final_answer":"Animal = [\"\"] * 20   # Animal array, 20 elements (1 mark)\nColour = [\"\"] * 10   # Colour array, 10 elements (1 mark)\nAnimalTopPointer = 0   # both pointers start at 0 (1 mark)\nColourTopPointer = 0","confidence":"high"},{"id":"s23-41-3bi","session":"s23","variant":"41","paper_code":"9618/41 May/June 2023","q":"3(b)(i)","marks":3,"chapter":19,"subtopic":"stack","prompt":"Study the pseudocode function `PushAnimal()`:\n\n```\nFUNCTION PushAnimal(DataToPush : STRING) RETURNS BOOLEAN\n    IF AnimalTopPointer = 20 THEN\n        RETURN FALSE\n    ELSE\n        Animal[AnimalTopPointer] <- DataToPush\n        AnimalTopPointer <- AnimalTopPointer + 1\n        RETURN TRUE\n    ENDIF\nENDFUNCTION\n```\n\nWrite program code for the function `PushAnimal()`.\n\nWrite your answer in Python.","context_note":"A program implements two stacks using 1D arrays. One stack stores the names of colours. One stack stores the names of )."],"final_answer":"# PushColour (1 mark)\ndef PushColour(DataToPush):\n    global ColourTopPointer\n    if ColourTopPointer == 10:\n        return False\n    else:\n        Colour[ColourTopPointer] = DataToPush\n        ColourTopPointer = ColourTopPointer + 1\n        return True\n\n# PopColour (1 mark)\ndef PopColour():\n    global ColourTopPointer\n    if ColourTopPointer == 0:\n        return \"\"\n    else:\n        ReturnData = Colour[ColourTopPointer - 1]\n        ColourTopPointer = ColourTopPointer - 1\n        return ReturnData","confidence":"high"},{"id":"s23-41-3bv","session":"s23","variant":"41","paper_code":"9618/41 May/June 2023","q":"3(b)(v)","marks":2,"chapter":20,"subtopic":"text-file-read","prompt":"Amend the procedure `ReadData()` so that it also:\n\n- reads the colours from the text file `ColourData.txt`\n- uses `PushColour()` to insert each colour onto the stack\n- uses appropriate exception handling if the file does not exist.\n\nWrite your answer in Python (give the whole amended procedure).","context_note":"A program implements two stacks using 1D arrays. One stack stores the names of colours. One stack stores the names of animals. The program has global arrays `Animal` (20 elements) and `Colour` (10 elements), and global pointers `AnimalTopPointer` and `ColourTopPointer`, all declared as in part (a); each pointer holds the index of the next free space in its array and starts at 0. The text file `ColourData.txt` is supplied in the exam and holds one colour name on each line. `PushColour(DataToPush)` pushes a string onto the colour stack. The procedure so far is:\n\n```python\ndef ReadData():\n    try:\n        AnimalFile = open(\"AnimalData.txt\", \"r\")\n        for Line in AnimalFile:\n            PushAnimal(Line.strip())\n        AnimalFile.close()\n    except IOError:\n        print(\"Could not find file\")\n```","answer_type":"code","criteria":[{"point":"Opens ColourData.txt for reading, reads until the end of the file, closes the file, and uses exception handling","key_terms":["open(","ColourData.txt","for","close()","try","except"]},{"point":"Uses PushColour() to store each item read from the file (for all lines)","key_terms":["PushColour("]}],"max_note":"max 2","rejects":["The exception handling for the colour file may be in the same try/except as the animal file or in its own; either is accepted."],"final_answer":"def ReadData():\n    try:\n        AnimalFile = open(\"AnimalData.txt\", \"r\")\n        for Line in AnimalFile:\n            PushAnimal(Line.strip())\n        AnimalFile.close()\n        # open ColourData.txt, read to end of file, close, inside exception handling (1 mark)\n        ColourFile = open(\"ColourData.txt\", \"r\")\n        for Line in ColourFile:\n            PushColour(Line.strip())      # push every colour (1 mark)\n        ColourFile.close()\n    except IOError:\n        print(\"Could not find file\")","confidence":"high"},{"id":"s23-41-3c","session":"s23","variant":"41","paper_code":"9618/41 May/June 2023","q":"3(c)","marks":5,"chapter":19,"subtopic":"stack","prompt":"The procedure `OutputItem()`:\n\n- pops the next item from both `Animal` and `Colour`\n- outputs the colour and animal on one line, for example \"black horse\"\n\nIf there is no data in `Colour`:\n\n- the animal is pushed back onto `Animal`\n- \"No colour\" is output.\n\nIf there is no data in `Animal`:\n\n- the colour is pushed back onto `Colour`\n- \"No animal\" is output.\n\nWrite program code for the procedure `OutputItem()`.\n\nWrite your answer in Python.","context_note":"A program implements two stacks using 1D arrays. One stack stores the names of colours. One stack stores the names of animals. The program has global arrays `Animal` (20 elements) and `Colour` (10 elements), and global pointers `AnimalTopPointer` and `ColourTopPointer`, all declared as in part (a); each pointer holds the index of the next free space in its array and starts at 0. The functions `PushAnimal(DataToPush)`, `PopAnimal()`, `PushColour(DataToPush)` and `PopColour()` exist. The Pop functions return an empty string \"\" if the stack is empty; the Push functions insert a string and return True/False.","answer_type":"code","criteria":[{"point":"Procedure heading (and end) that outputs the colour and animal obtained using PopColour() and PopAnimal() (only if both are successfully popped)","key_terms":["def OutputItem","PopColour()","PopAnimal()","print("]},{"point":"Checks whether there is no colour and outputs \"No colour\" ...","key_terms":["== \"\"","No colour"]},{"point":"... pushing the removed animal back onto the Animal stack","key_terms":["PushAnimal("]},{"point":"Checks whether there is no animal and outputs \"No animal\" ...","key_terms":["== \"\"","No animal"]},{"point":"... pushing the removed colour back onto the Colour stack","key_terms":["PushColour("]}],"max_note":"max 5","rejects":["Both stacks must be popped before the checks; the animal/colour pushed back must be the one that WAS popped.","Outputting colour then animal on one line with a space between them, e.g. print(ColourReturned, AnimalReturned)."],"final_answer":"def OutputItem():                                     # procedure (1 mark with pop and output)\n    ColourReturned = PopColour()                       # pop from both stacks\n    AnimalReturned = PopAnimal()\n    if ColourReturned == \"\":                           # no colour (1 mark)\n        print(\"No colour\")\n        if AnimalReturned != \"\":\n            PushAnimal(AnimalReturned)                 # put the animal back (1 mark)\n    elif AnimalReturned == \"\":                         # no animal (1 mark)\n        print(\"No animal\")\n        PushColour(ColourReturned)                     # put the colour back (1 mark)\n    else:\n        print(ColourReturned, AnimalReturned)          # colour and animal on one line","confidence":"high"},{"id":"s23-42-1a","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"1(a)","marks":2,"ch  = \"kangaroo\"\nAnimals[9] = \"tiger\"","confidence":"high"},{"id":"s23-42-1c","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"1(c)","marks":6,"chapter":19,"subtopic":"bubble-sort","prompt":"The following pseudocode procedure sorts the array into a descending alphabetical order using only the first character in each animal name.\n\nThe function `LENGTH(DataArray)` returns the number of elements in the array `DataArray`.\n\nThe function `MID(String, Start, Quantity)` returns `Quantity` number of characters from `String` starting at index `Start`. The first character in the string is index 0, for example: `MID(\"tiger\", 0, 2)` will return `\"ti\"`.\n\nThere are four incomplete statements in the procedure.\n\n```\nPROCEDURE SortDescending()\n    DECLARE ArrayLength : INTEGER\n    DECLARE Temp : STRING\n    ArrayLength <- LENGTH(Animals)\n    FOR X <- 0 TO ArrayLength - 1\n        FOR Y <- ......... TO ArrayLength - X - 1\n            IF MID(Animals[Y], 0, 1) < MID(Animals[.........], 0, 1) THEN\n                Temp <- Animals[.........]\n                Animals[Y] <- Animals[Y + 1]\n                Animals[Y + 1] <- .........\n            ENDIF\n        NEXT Y\n    NEXT X\nENDPROCEDURE\n```\n\nWrite program code for the procedure `SortDescending()`.\n\nWrite your answer in Python.","context_note":"A 1D array needs to store the names of 10 animals. The global array `Animals` holds the 10 animal names (index 0 to 9).","answer_type":"code","criteria":[{"point":"Inner loop starts at 0 (Y runs from 0 up to ArrayLength - X - 1, taking care that Y + 1 stays inside the array)","key_terms":["for Y in range(0","range(0, ArrayLength - X - 1)"]},{"point":"The comparison uses Animals[Y + 1] as the second element","key_terms":["Animals[Y + 1]"]},{"point":"Temp is assigned Animals[Y]","key_terms":["Temp = Animals[Y]"]},{"point":"Animals[Y + 1] is assigned Temp","key_terms":["Animals[Y + 1] = Temp"]},{"point":"Appropriate use of string functions/indexing to access only the first character (e.g. Animals[Y][0] or Animals[Y][:1], and len/LENGTH for the array length)","key_terms":["[0]","[:1]","len(Animals)"]},{"point":"The remainder of the procedure is correct and follows the pseudocode (outer loop, the < comparison for descending order, swap Animals[Y] = Animals[Y + 1])","key_terms":["for X in range","<","Animals[Y] = Animals[Y + 1]"]}],"max_note":"max 6 (the scheme gives 1 mark for each completed statement to a maximum of 4, plus 1 for the string functions and 1 for the remainder)","rejects":["The pseudocode FOR ... TO limits are inclusive, so in Python the inner loop must end at ArrayLength - X - 2 (range(0, ArrayLength - X - 1)); an inner loop that reaches index 9 and then reads Animals[10] is an index error.","Accept ArrayLength = 10 typed in instead of len(Animals) (the scheme does this). Only the first letter is compared; the sorted result is whale, tiger, rabbit, mouse, lion, kangaroo, horse, elephant, deer, bird."],"final_answer":"def SortDescending():\n    ArrayLength = len(Animals)                    # array length via len (string/array function mark)\n    for X in range(0, ArrayLength - 1):           # outer loop follows the pseudocode (remainder mark)\n        for Y in range(0, ArrayLength - X - 1):   # inner loop starts at 0 (1 mark)\n            # compare first characters only; Y + 1 is the second element (2 marks)\n            if Animals[Y][0] < Animals[Y + 1][0]:\n                Temp = Animals[Y]                 # Temp holds Animals[Y] (1 mark)\n                Animals[Y] = Animals[Y + 1]\n                Animals[Y + 1] = Temp             # Animals[Y + 1] gets Temp (1 mark)","confidence":"high"},{"id":"s23-42-1di","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"1(d)(i)","marks":3,"chapter":19,"subtopic":"main-program","prompt":"Write program code to amend the main program to:\n\n- call the procedure `SortDescending()`\n- output the sorted contents of the array with each animal name on a new line.\n\nWrite your answer in Python.","context_note":"A 1D array needs to store the names of 10 animals. The global array `Animals` holds the 10 animal names and the procedure `SortDescending()` from part (c) sorts it.","answer_type":"code","criteria":[{"point":"Calls the procedure SortDescending()","key_terms":["SortDescending()"]},{"point":"Loops through all array elements (all 10)","key_terms":["for","range(0, 10)","in Animals"]},{"point":"Outputs each array element on a new line","key_terms":["print(Animals[","print(Animal"]}],"max_note":"max 3","rejects":["Accept `for animal in Animals: print(animal)`; each print outputs one name on its own line."],"final_answer":"SortDescending()                 # call the sort (1 mark)\nfor X in range(0, 10):           # every element (1 mark)\n    print(Animals[X])            # one name per line (1 mark)","confidence":"high"},{"id":"s23-42-2a","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"2(a)","marks":2,"chapter":20,"subtopic":"record-type","prompt":"Write program code to declare a record structure, `SaleData`, to store the data about each sale.\n\nWrite your answer in Python.","context_note":"A business sells a single product. Customers can purchase one or more of this product. Each sale has an ID and a quantity, for example \"ABC\" and 2. The business needs a program to store the data about the sales in a circular queue data structure. Each sale record holds a sale ID (a string, e.g. \"ABC\") and a quantity (an integer, e.g. 2). In Python a class can be used as a record.","answer_type":"code","criteria":[{"point":"Declares a record/class named SaleData","key_terms":["class SaleData"]},{"point":"... with SaleID declared as a string and Quantity as an integer (if a class, a constructor assigning the attributes SaleID and Quantity)","key_terms":["SaleID","Quantity","__init__"]}],"max_note":"max 2","rejects":["Accept any valid Python record structure (class with constructor, or a datac :["Beware [SaleData(\"\", -1)] * 5: it puts the SAME object in all five places, which still works here only if records are replaced rather than modified; a loop creating five separate objects is safest. Accept either if Enqueue replaces the record."],"final_answer":"CircularQueue = []                           # array of 5 SaleData records (1 mark)\nfor X in range(0, 5):                        # empty record in every element (2 marks)\n    CircularQueue.append(SaleData(\"\", -1))\nHead = 0                                     # pointers and counter start at 0 (1 mark)\nTail = 0\nNumberOfItems = 0","confidence":"high"},{"id":"s23-42-2c","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"2(c)","marks":6,"chapter":19,"subtopic":"circular-queue","prompt":"The function `Enqueue()`:\n\n- takes a new record as a parameter\n- inserts the record in the circular queue at the element pointed to by `Tail`\n- updates pointers and other variables as required\n- returns -1 if the circular queue is full\n- returns 1 if the record is stored successfully.\n\nWrite program code for the function `Enqueue()`.\n\nWrite your answer in Python.","context_note":"A business sells a single product. Customers can purchase one or more of this product. Each sale has an ID and a quantity, for example \"ABC\" and 2. The business needs a program to store the data about the sales in a circular queue data structure.\n\nThe program has the record structure `SaleData` (fields `SaleID` and `Quantity`), a global array `CircularQueue` of 5 `SaleData` records (empty records have ID \"\" and quantity -1), global pointers `Head` and `Tail`, and a global variable `NumberOfItems`, all initialised as in parts (a) and (b):\n\n```python\nclass SaleData:\n    def __init__(self, SaleIDp, Quantityp):\n        self.SaleID = SaleIDp\n        self.Quantity = Quantityp\n\nCircularQueue = []\nfor X in range(0, 5):\n    CircularQueue.append(SaleData(\"\", -1))\nHead = 0\nTail = 0\nNumberOfItems = 0\n```","answer_type":"code","criteria":[{"point":"Function Enqueue() header (and end) taking one parameter (a SaleData record)","key_terms":["def Enqueue","RecordToAdd"]},{"point":"Checks whether the queue is full (NumberOfItems = 5) ...","key_terms":["NumberOfItems == 5","== 5"]},{"point":"... and returns -1","key_terms":["return -1"]},{"point":"Otherwise inserts the parameter into CircularQueue[Tail] ...","key_terms":["CircularQueue[Tail] ="]},{"point":"... increments Tail, resetting it to 0 after index 4 (wrap round)","key_terms":["Tail","== 4","= 0","% 5"]},{"point":"Increments NumberOfItems and returns 1","key_terms":["NumberOfItems","+ 1","+= 1","return 1"]}],"max_note":"max 6","rejects":["Python needs `global Tail, NumberOfItems` for the pointers to be updated.","Accept (Tail + 1) % 5 for the wrap-round.","Accept a full test of NumberOfItems == 5 or an equivalent Head/Tail based test if the rest of the queue code is consistent."],"final_answer":"def Enqueue(RecordToAdd):                  # one parameter (1 mark)\n    global Tail, NumberOfItems\n    if NumberOfItems == 5:                  # full check (1 mark)\n        return -1                           # full -> -1 (1 mark)\n    else:\n        CircularQueue[Tail] = RecordToAdd   # insert at Tail (1 mark)\n        if Tail == 4:                       # wrap round (1 mark)\n            Tail = 0\n        else:\n            Tail = Tail + 1\n        NumberOfItems = NumberOfItems + 1   # count the item (1 mark)\n        return 1                            # success (part of the last mark)","confidence":"high"},{"id":"s23-42-2d","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"2(d)","marks":6,"chapter":19,"subtopic":"circular-queue","prompt":"The function `Dequeue()`:\n\n- returns a null or empty record if the circular queue is empty\n- returns the first record in the queue if the circular queue is not empty\n- updates pointers and other variables as required.\n\nWrite program code for the function `Dequeue()`.\n\nWrite your answer in Python.","context_note":"A business sells a single product. Customers can purchase one or more of this product. Each sale has an ID and a quantity, for example \"ABC\" and 2. The business needs a program to store the data about the sales in a circular queue data structure.\n\nThe program has the record structure `SaleData` (fields `SaleID` and `Quantity`), a global array `CircularQueue` of 5 `SaleData` records (empty records have ID \"\" and quantity -1), global pointers `Head` and `Tail`, and a global variable `NumberOfItems`, all initialised as in parts (a) and (b):\n\n```python\nclass SaleData:\n    def __init__(self, SaleIDp, Quantityp):\n        self.SaleID = SaleIDp\n        self.Quantity = Quantityp\n\nCircularQueue = []\nfor X in range(0, 5):\n    CircularQueue.append(SaleData(\"\", -1))\nHead = 0\nTail = 0\nNumberOfItems = 0\n```\n\nThe function `Enqueue()` stores a record at `Tail`, wraps `Tail` to 0 after index 4 and increases `NumberOfItems`.","answer_type":"code","criteria":[{"point":"Function Dequeue() header (and end where appropriate)","key_terms":["def Dequeue"]},{"point":"Checks whether the queue is empty (NumberOfItems = 0) ...","key_terms":["NumberOfItems == 0","NumberOfItems != 0","not"]},{"point":"... and returns an appropriate empty/null record (ID \"\", quantity -1)","key_terms":["SaleData(\"\", -1)","return"]},{"point":"Otherwise returns the item at Head","key_terms":["CircularQueue[Head]"]},{"point":"Increments Head, changing it to 0 after index 4 (wrap round)","key_terms":["Head","== 4","= 0","% 5"]},{"point":"Decrements NumberOfItems","key_terms":["NumberOfItems - 1","-= 1"]}],"max_note":"max 6","rejects":["Python needs `global Head, NumberOfItems`.","The record at Head must be stored/returned before Head is moved on.","Accept (Head + 1) % 5 for the wrap-round."],"final_answer":"def Dequeue():                                      # function header (1 mark)\n    global Head, NumberOfItems\n    RecordRemoved = SaleData(\"\", -1)                # empty record to return if empty (1 mark)\n    if NumberOfItems != 0:                           # empty check (1 mark)\n        RecordRemoved = CircularQueue[Head]          # take the record at Head (1 mark)\n        NumberOfItems = NumberOfItems - 1            # one fewer item (1 mark)\n        if Head == 4:                                # wrap Head round (1 mark)\n            Head = 0\n        else:\n            Head = Head + 1\n    return RecordRemoved","confidence":"high"},{"id":"s23-42-2e","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"2(e)","marks":5,"chapter":19,"subtopic":"circular-queue","prompt":"The procedure `EnterRecord()`:\n\n- takes an ID and quantity as input and creates a sale record\n- uses `Enqueue()` to insert the record in the circular queue\n- outputs \"Full\" if the record was not inserted in the circular queue\n- outputs \"Stored\" if the record was inserted in the circular queue.\n\nWrite program code for the procedure `EnterRecord()`.\n\nWrite your answer in Python.","context_note":"A business sells a single product. Customers can purchase one or more of this product. Each sale has an ID and a quantity, for example \"ABC\" and 2. The business needs a program to store the data about the sales in a circular queue data structure.\n\nThe program has the record structure `SaleData` (fields `SaleID` and `Quantity`), a global array `CircularQueue` of 5 `SaleData` records (empty records have ID \"\" and quantity -1), global pointers `Head` and `Tail`, and a global variable `NumberOfItems`, all initialised as in parts (a) and (b):\n\n```python\nclass SaleData:\n    def __init__(self, SaleIDp, Quantityp):\n        self.SaleID = SaleIDp\n        self.Quantity = Quantityp\n\nCircularQueue = []\nfor X in range(0, 5):\n    CircularQueue.append(SaleData(\"\", -1))\nHead = 0\nTail = 0\nNumberOfItems = 0\n```\n\nThe function `Enqueue(RecordToAdd)` returns -1 if the queue is full and 1 i ":"Outputs the ID and quantity of all the records currently stored in CircularQueue","key_terms":["for","CircularQueue[","SaleID","Quantity"]}],"max_note":"max 4 (five mark points are listed in the scheme)","rejects":["Calling EnterRecord() in a loop six times is acceptable. The records are typed in by the user at run time (the question does not ask for them to be hard-coded).","The final loop must output all five array elements, not just the items between Head and Tail only, unless the student clearly outputs the five stored records."],"final_answer":"for X in range(0, 6):                                   # six records entered (1 mark)\n    EnterRecord()\nReturnValue = Dequeue()                                  # dequeue and keep the result (1 mark)\nif ReturnValue.SaleID == \"\":                             # empty record -> error message (1 mark)\n    print(\"No items\")\nelse:\n    print(ReturnValue.SaleID, ReturnValue.Quantity)\nEnterRecord()                                            # LLP entered again (1 mark)\nfor X in range(0, 5):                                    # output all records in the array\n    print(CircularQueue[X].SaleID, CircularQueue[X].Quantity)","confidence":"high"},{"id":"s23-42-3ai","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"3(a)(i)","marks":5,"chapter":20,"subtopic":"class-definition","prompt":"Write program code to declare the class `Employee`.\n\nYou only need to declare the class and its constructor. Do not declare any other methods.\n\nUse your programming language appropriate constructor.\n\nIf you are writing program code in Python, include attribute declarations using comments.\n\nWrite your answer in Python.","context_note":"A company needs a computer program to store data about its employees. Part of the program is being written using object-oriented programming. The class `Employee` stores data about the employees. Each employee has an employee number, a job title and hourly pay rate. The class wi so store the amount they are paid each week over a 52-week year in a 1D array.\n\n| Employee | |\n|---|---|\n| HourlyPay : REAL | stores the amount each employee gets paid each hour |\n| EmployeeNumber : STRING | stores the employee's unique number |\n| JobTitle : STRING | stores the employee's job title |\n| PayYear2022 : ARRAY[0:51] OF REAL | stores the amount the employee has been paid each week |\n| Constructor() | initialises HourlyPay, EmployeeNumber and JobTitle from the values passed as parameters; initialises all 52 elements in PayYear2022 to 0.0 |\n| GetEmployeeNumber() | returns the employee number |\n| SetPay() | takes the week number and number of hours worked that week as parameters; calculates and stores the pay for that week in PayYear2022 |\n| GetTotalPay() | returns the total of all the values in PayYear2022 |\n\nThe class `Employee` was declared with this constructor (methods below are written inside the class):\n\n```python\nclass Employee:\n    # Private HourlyPay : REAL\n    # Private EmployeeNumber : STRING\n    # Private JobTitle : STRING\n    # Private PayYear2022 : ARRAY[0:51] OF REAL\n    def __init__(self, EmpNumP, PayP, JobP):\n        self.__HourlyPay = PayP\n        self.__EmployeeNumber = EmpNumP\n        self.__JobTitle = JobP\n        self.__PayYear2022 = []\n        for X in range(0, 52):\n            self.__PayYear2022.append(0.0)\n```\n\nWeek numbers run from 1 to 52 and the array `PayYear2022` has indexes 0 to 51.","answer_type":"code","criteria":[{"point":"Method header (and end) with two parameters (week number and number of hours)","key_terms":["def SetPay","WeekNumber","Hours"]},{"point":"Calculates the pay as hours (parameter) multiplied by HourlyPay (attribute)","key_terms":["Hours * self.__HourlyPay","self.__HourlyPay * Hours"]},{"point":"... and stores the result in the correct index of PayYear2022 (week number - 1)","key_terms":["self.__PayYear2022[WeekNumber - 1]","[WeekNumber-1]"]}],"max_note":"max 3","rejects":["Week :\n\n```python\nclass Employee:\n    # Private HourlyPay : REAL\n    # Private EmployeeNumber : STRING\n    # Private JobTitle : STRING\n    # Private PayYear2022 : ARRAY[0:51] OF REAL\n    def __init__(self, EmpNumP, PayP, JobP):\n        self.__HourlyPay = PayP\n        self.__EmployeeNumber = EmpNumP\n        self.__JobTitle = JobP\n        self.__PayYear2022 = []\n        for X in range(0, 52):\n            self.__PayYear2022.append(0.0)\n```","answer_type":"code","criteria":[{"point":"Method header (and end) and returns the calculated total (parameters are ignored; any reasonable attempt at the calculation is allowed)","key_terms":["def GetTotalPay","return"]},{"point":"Totals all the elements in PayYear2022","key_terms":["for","range(0, 52)","+","sum("]}],"max_note":"max 2","rejects":["Accept sum(self.__PayYear2022)."],"final_answer":"    def GetTotalPay(self):                                  # method returning the total (1 mark)\n        TotalPay = 0\n        for X in range(0, 52):                              # add all 52 elements (1 mark)\n            TotalPay = TotalPay + self.__PayYear2022[X]\n        return TotalPay","confidence":"high"},{"id":"s23-42-3bi","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"3(b)(i)","marks":4,"chapter":20,"subtopic":"inheritance-override","prompt":"Write program code to declare the class `Manager`.\n\nYou only need to declare the class and its constructor. Do not declare any other methods.\n\nUse your programming language appropriate constructor.\n\nIf you are writing in Python, include attribute declarations using comments.\n\nWrite your answer in Python.","context_note":"A company needs a computer program to store data about its employees. Part of the program is being written using object-oriented programming. The class `Employee` stores data about the employees. Each employee has an employee number, a job title and hourly pay rate. The class will also store the amount they are paid each week over a 52-week year in a 1D array.\n\n| Employee | |\n|---|---|\n| HourlyPay : REAL | stores the amount each employee gets paid each hour |\n| EmployeeNumber : STRING | stores the employee's unique number |\n| JobTitle : STRING | stores the employee's job title |\n| PayYear2022 : ARRAY[0:51] OF REAL | stores the amount the employee has been paid each week |\n| Constructor() | initialises HourlyPay, EmployeeNumber and JobTitle from the values passed as parameters; initialises all 52 elements in PayYear2022 to 0.0 |\n| GetEmployeeNumber() | returns the employee number |\n| SetPay() | takes the week number and number of hours worked that week as parameters; calculates and stores the pay for that week in PayYear2022 |\n| GetTotalPay() | returns the total of all the values in PayYear2022 |\n\nThe child class `Manager` inherits from the parent class `Employee`. A manager gets a bonus. This bonus value is a percentage, for example 10.0%. When calculating the pay, the number of hours the manager worked that week is increased by the bonus value.\n\n| Manager (child of Employee) | |\n|---|---|\n| BonusValue : REAL | stores the bonus value, for example 10.0 represents a 10.0% increase |\n| Constructor() | takes bonus value, hourly pay, employee number and job title as parameters; initialises BonusValue to its parameter value |\n| SetPay() | takes the week number and number of hours worked as parameters; increases the number of hours worked by the bonus value; calls the SetPay() method from the parent class |\n\nThe parent class constructor takes (employee number, hourly pay, job title):\n\n```python\nclass Employee:\n    # Private HourlyPay : REAL\n    # Private EmployeeNumber : STRING\n    # Private JobTitle : STRING\n    # Private PayYear2022 : ARRAY[0:51] OF REAL\n    def __init__(self, EmpNumP, PayP, JobP):\n        self.__HourlyPay = PayP\n        self.__EmployeeNumber = EmpNumP\n        self.__JobTitle = JobP\n        self.__PayYear2022 = []\n        for X in range(0, 52):\n            self.__PayYear2022.append(0.0)\n```","answer_type":"code","criteria":[{"point":"Class Manager header (and end) inheriting from Employee","key_terms":["class Manager(Employee)"]},{"point":"Constructor within the class (and end) taking 4 parameters (bonus value, hourly pay, employee number, job title)","key_terms":["def __init__","BonusP"]},{"point":"... calling the parent class constructor with the 3 values from the parameters","key_terms":["super().__init__(","Employee.__init__("]},{"point":"Declares BonusValue (real) and assigns the parameter to it within the constructor","key_terms":["BonusValue","self.__BonusValue = BonusP"]}],"max_note":"max 4","rejects":["The order of the four parameters is the student's choice, provided the three Employee values are passed to the parent constructor in the order that constructor expects. Accept Employee.__init__(self, ...) or super().__init__(...)."],"final_answer":"class Manager(Employee):            # inherits from Employee (1 mark)\n    # Private BonusValue : REAL\n    # constructor with 4 parameters (1 mark)\n    def __init__(self, EmpNumP, PayP, JobP, BonusP):\n        # call parent constructor with the 3 employee values (1 mark)\n        super().__init__(EmpNumP, PayP, JobP)\n        # BonusValue assigned from parameter (1 mark)\n        self.__BonusValue = BonusP","confidence":"high"},{"id":"s23-42-3bii","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"3(b)(ii)","marks":3,"chapter":20,"subtopic":"inheritance-override","prompt":"The `Manager` method `SetPay()` overrides the method from the parent class and:\n\n- takes the week number and number of hours worked as parameters\n- increases the number of hours worked by the bonus value\n- calls `SetPay()` from the parent class.\n\nWrite program code for the method `SetPay()`.\n\nWrite your answer in Python.","context_note":"A company needs a computer program to store data about its employees. Part of the program is being written using object-oriented programming. The class `Employee` stores data about the employees. Each employee has an employee number, a job title and hourly pay rate. The class will also store the amount they are paid each week over a 52-week year in a 1D array.\n\n| Employee | |\n|---|---|\n| HourlyPay : REAL | stores the amount each employee gets paid each hour |\n| EmployeeNumber : STRING | stores the employee's unique number |\n| JobTitle : STRING | stores the employee's job title |\n| PayYear2022 : ARRAY[0:51] OF REAL | stores the amount the employee has been paid each week |\n| Constructor() | initialises HourlyPay, EmployeeNumber and JobTitle from the values passed as parameters; initialises all 52 elements in PayYear2022 to 0.0 |\n| GetEmployeeNumber() | returns the employee number |\n| SetPay() | takes the week number and number of hours worked that week as parameters; calculates and stores the pay for that week in PayYear2022 |\n| GetTotalPay() | returns the total of all the values in PayYear2022 |\n\nThe child class `Manager` inherits from the parent class `Employee`. A manager gets a bonus. This bonus value is a percentage, for example 10.0%. When calculating the pay, the number of hours the manager worked that week is increased by the bonus value.\n\n| Manager (child of Employee) | |\n|---|---|\n| BonusValue : REAL | stores the bonus value, for example 10.0 represents a 10.0% increase |\n| Constructor() | takes bonus value, hourly pay, employee number and job title as parameters; initialises BonusValue to its parameter value |\n| SetPay() | takes the week number and number of hours worked as parameters; increases the number of hours worked by the bonus value; calls the SetPay() method from the parent class |\n\nThe class so far (the method is written inside `Manager`; the bonus is a percentage, so 10.0 means hours x 1.10):\n\n```python\nclass Manager(Employee):\n    # Private BonusValue : REAL\n    def __init__(self, EmpNumP, PayP, JobP, BonusP):\n        super().__init__(EmpNumP, PayP, JobP)\n        self.__BonusValue = BonusP\n```","answer_type":"code","criteria":[{"point":"Method SetPay header (and end) taking 2 parameters (week number and hours)","key_terms":["def SetPay","WeekNumber","Hours"]},{"point":"Calculates the hours increased by the bonus percentage: hours x (1 + bonus / 100)","key_terms":["self.__BonusValue","/ 100","1 +","+ 1"]},{"point":"Calls the parent SetPay() with the week number and the updated hours","key_terms":["super().SetPay(","Employee.SetPay("]}],"max_note":"max 3","rejects":["The bonus is a PERCENTAGE: 10.0 means 10%, so the multiplier is 1.10 (hours * bonus on its own, or adding the raw bonus value to the hours, is wrong).","Accept Employee.SetPay(self, ...) or super().SetPay(...)."],"final_answer":"    def SetPay(self, WeekNumber, Hours):                  # overrides parent, 2 parameters (1 mark)\n        Hours = Hours * (1 + self.__BonusValue / 100)     # hours increased by bonus % (1 mark)\n        super().SetPay(WeekNumber, Hours)                 # call the parent SetPay (1 mark)","confidence":"high"},{"id":"s23-42-3c","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"3(c)","marks":7,"chapter":20,"subtopic":"text-file-read","prompt":"The main program has a global 1D array, `EmployeeArray`, to store data about eight employees. Each employee is stored as an object of type `Employee`.\n\nWrite the main program to:\n\n- declare the array to store data about 8 employees\n- read in the data from the file for each employee\n- instantiate each employee as either `Employee` (if the employee does not have a bonus value) or `Manager` (if the employee has a bonus value).\n\nWrite your answer in Python.","context_note":"A company needs a computer program to store data about its employees. Part of the program is being written using object-oriented programming. The class `Employee` stores data about the employees. Each employee has an employee number, a job title and hourly pay rate. The class will also store the amount they are paid each week over a 52-week year in a 1D array.\n\n| Employee | |\n|---|---|\n| HourlyPay : REAL | stores the amount each employee gets paid each hour |\n| EmployeeNumber : STRING | stores the employee's unique number |\n| JobTitle : STRING | stores the employee's job title |\n| PayYear2022 : ARRAY[0:51] OF REAL | stores the amount the employee has been paid each week |\n| Constructor() | initialises HourlyPay, EmployeeNumber and JobTitle from the values passed as parameters; initialises all 52 elements in PayYear2022 to 0.0 |\n| GetEmployeeNumber() | returns the employee number |\n| SetPay() | takes the week number and number of hours worked that week as parameters; calculates and stores the pay for that week in PayYear2022 |\n| GetTotalPay() | returns the total of all the values in PayYear2022 |\n\n| Manager (child of Employee) | |\n|---|---|\n| BonusValue : REAL | stores the bonus value, for example 10.0 represents a 10.0% increase |\n| Constructor() | takes bonus value, hourly pay, employee number and job title as parameters; initialises BonusValue to its parameter value |\n| SetPay() | takes the week number and number of hours worked as parameters; increases the number of hours worked by the bonus value; calls the SetPay() method from the parent class |\n\nThe text file `Employees.txt` is supplied in the exam. It stores data about eight employees, one item per line, in the order: hourly pay, employee number, bonus value (only for managers), job title. For example:\n\n- The first employee is a Junior Developer with employee number 12452 and an hourly pay of $15.22. This employee has no bonus value, so their lines are `15.22`, `12452`, `Junior Developer`.\n- The third employee is an Interface Manager with employee number 02586, an hourly pay of $22.50 and a bonus value of 5.25%, so their lines are `22.50`, `02586`, `5.25`, `Interface Manager`.\n\nOnly employees who are managers have a bonus value saved.\n\nThe constructors written earlier are `Employee(EmployeeNumber, HourlyPay, JobTitle)` and `Manager(EmployeeNumber, HourlyPay, JobTitle, BonusValue)`.","answer_type":"code","criteria":[{"point":"Opens Employees.txt for reading and closes the file in an appropriate place","key_terms":["open(","Employees.txt","close()"]},{"point":"Uses exception handling with an appropriate output for opening the file","key_terms":["try","except","print("]},{"point":"Loops to the end of the file / 8 times","key_terms":["for","range(0, 8)","while"]},{"point":"Attempts to read in all the lines for each employee (pay, number, then bonus (if there) and title)","key_terms":["readline","float("]},{"point":"Instantiates and stores an object of type Manager (not Employee) when a bonus is included ...","key_terms":["Manager("]},{"point":"... with the correct values read in from the file","key_terms":["Manager(ID","float(","Bonus"]},{"point":"Otherwise instantiates and stores an object of type Employee with the correct values read in","key_terms":["Employee("]}],"max_note":"max 7","rejects":["The bonus line is detected because it is a number: the third line is either a number (manager) or the job title text. Accept try/except around float(), str.replace('.', '').isdigit(), or any other valid test.","Employee numbers have leading zeros (02586), so keep them as strings. Strip the newline characters from lines.","The array may be built by appending or by index assignment into a list of 8."],"final_answer":"EmployeeArray = []                                  # array for the 8 employees\ntry:                                                # exception handling (1 mark)\n    EmployeeFile = open(\"Employees.txt\", \"r\")       # open file (1 mark)\n    for X in range(0, 8):                           # loop 8 times (1 mark)\n        Pay = float(EmployeeFile.readline())        # read the lines for this employee (1 mark)\n        ID = EmployeeFile.readline().strip()\n        Temp = EmployeeFile.readline().strip()\n        try:\n            Bonus = float(Temp)                     # a number means there is a bonus -> manager\n            Title = EmployeeFile.readline().strip()\n            EmployeeArray.append(Manager(ID, Pay, Title, Bonus))   # Manager with correct values (2 marks)\n        except ValueError:\n            Title = Temp                            # no bonus: that line was the job title\n            EmployeeArray.append(Employee(ID, Pay, Title))         # Employee with correct values (1 mark)\n    EmployeeFile.close()                            # close the file\nexcept IOError:\n    print(\"Could not find file\")","confidence":"high"},{"id":"s23-42-3d","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"3(d)","marks":4,"chapter":20,"subtopic":"text-file-read","prompt":"The file `HoursWeek1.txt` stores the number of hours each employee has worked in week 1, in the order:\n\n- employee number\n- number of hours worked.\n\nFor example, the first set of data is for employee 21548 who has worked 50.0 hours.\n\nThe procedure `EnterHours()`:\n\n- reads in the values from the file\n- finds the location of each employee in `EmployeeArray`\n- calls the method `SetPay()` for each employee.\n\nWrite program code for `EnterHours()`.\n\nWrite your answer in Python.","context_note":"A company needs a computer program to store data about its employees. Part of the program is being written using object-oriented programming. The class `Employee` stores data about the employees. Each employee has an employee number, a job title and hourly pay rate. The class will also store the amount they are paid each week over a 52-week year in a 1D array.\n\n| Employee | |\n|---|---|\n| HourlyPay : REAL | stores the amount each employee gets paid each hour |\n| EmployeeNumber : STRING | stores the employee's unique number |\n| JobTitle : STRING | stores the employee's job title |\n| PayYear2022 : ARRAY[0:51] OF REAL | stores the amount the employee has been paid each week |\n| Constructor() | initialises HourlyPay, EmployeeNumber and JobTitle from the values passed as parameters; initialises all 52 elements in PayYear2022 to 0.0 |\n| GetEmployeeNumber() | returns the employee number |\n| SetPay() | takes the week number and number of hours worked that week as parameters; calculates and stores the pay for that week in PayYear2022 |\n| GetTotalPay() | returns the total of all the values in PayYear2022 |\n\nThe global array `EmployeeArray` holds eight objects of type `Employee` or `Manager`. `GetEmployeeNumber()` returns the employee number as a string (for example \"21548\") and `SetPay(WeekNumber, Hours)` records the pay for a week.\n\nThe text file `HoursWeek1.txt` is supplied in the exam; it has the employee number on one line followed by the hours worked on the next line, for each of the eight employees, for example:\n\n```\n21548\n50.0\n```","answer_type":"code","criteria":[{"point":"Procedure header EnterHours (parameters ignored), opens the file for reading and closes the file in an appropriate place","key_terms":["def EnterHours","open(","HoursWeek1.txt","close()"]},{"point":"Uses exception handling with an appropriate output for opening the file","key_terms":["try","except","print("]},{"point":"Loops to the end of the file / 8 times and reads in each line","key_terms":["for","range(0, 8)","while","readline"]},{"point":"Searches the array for the employee number using GetEmployeeNumber() ...","key_terms":["GetEmployeeNumber()","for","=="]},{"point":"... and calls SetPay() for that employee with the hours worked and week number 1","key_terms":["SetPay(1,","SetPay(1 ,"]}],"max_note":"max 4 (five mark points are listed in the scheme)","rejects":["Strip newline characters before comparing the employee number with GetEmployeeNumber(). The hours are read as a real number (float).","The week number passed to SetPay() is 1 (week 1)."],"final_answer":"def EnterHours():                                         # procedure (1 mark with open/close)\n    try:                                                   # exception handling (1 mark)\n        HoursFile = open(\"HoursWeek1.txt\", \"r\")\n        for X in range(0, 8):                              # read each employee's two lines (1 mark)\n            EmpID = HoursFile.readline().strip()\n            Hours = float(HoursFile.readline())\n            for Y in range(0, 8):                          # search for the employee (1 mark)\n                if EmployeeArray[Y].GetEmployeeNumber() == EmpID:\n                    EmployeeArray[Y].SetPay(1, Hours)      # SetPay for week 1 (1 mark)\n        HoursFile.close()\n    except IOError:\n        print(\"Could not find file\")","confidence":"high"},{"id":"s23-42-3ei","session":"s23","variant":"42","paper_code":"9618/42 May/June 2023","q":"3(e)(i)","marks":2,"chapter":20,"subtopic":"main-program","prompt":"The main program needs to call `EnterHours()` and use the method `GetTotalPay()` to output the employee number and total pay for each of the eight employees.\n\nAmend the main program to perform these tasks.\n\nWrite your answer in Python.","context_note":"A company needs a computer program to store data about its employees. Part of the program is being written using object-oriented programming. The class `Employee` stores data about the employees. Each employee has an employee number, a job title and hourly pay rate. The class will also store the amount they are paid each week over a 52-week year in a 1D array.\n\n| Employee | |\n|---|---|\n| HourlyPay : REAL | stores the amount each employee gets paid each hour |\n| EmployeeNumber : STRING | stores the employee's unique number |\n| JobTitle : STRING | stores the employee's job title |\n| PayYear2022 : ARRAY[0:51] OF REAL | stores the amount the employee has been paid each week |\n| Constructor() | initialises HourlyPay, EmployeeNumber and JobTitle from the values passed as parameters; initialises all 52 elements in PayYear2022 to 0.0 |\n| GetEmployeeNumber() | returns the employee number |\n| SetPay() | takes the week number and number of hours worked that week as parameters; calculates and stores the pay for that week in PayYear2022 |\n| GetTotalPay() | returns the total of all the values in PayYear2022 |\n\nThe global array `EmployeeArray` holds the eight employee objects (read from the file in part (c)) and the procedure `EnterHours()` from part (d) sets the week 1 pay for each employee. The methods `GetEmployeeNumber()` and `GetTotalPay()` are available.","answer_type":"code","criteria":[{"point":"Calls EnterHours() and loops through each of the eight employees","key_terms":["EnterHours()","for","range(0, 8)"]},{"point":"... outputting the employee number and their total pay using GetEmployeeNumber() and GetTotalPay()","key_terms":["GetEmployeeNumber()","GetTotalPay()","print("]}],"max_note":"max 2","rejects":["Accept `for emp in EmployeeArray:` as the loop."],"final_answer":"EnterHours()                                                    # call (part of 1 mark)\nfor Y in range(0, 8):                                           # each employee (1 mark)\n    print(EmployeeArray[Y].GetEmployeeNumber(), EmployeeArray[Y].GetTotalPay())   # number and total pay (1 mark)","confidence":"high"},{"id":"s24-41-1b","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"1(b)","marks":5,"chapter":19,"subtopic":"array-1d","prompt":"The procedure `Initialise()`:\n\n- prompts the user to input the quantity of numbers the user would like to enter\n- reads the input and validates it is between 1 and 20 (inclusive)\n- prompts the user to input each number and stores each number in `DataStored`.\n\nWrite program code for `Initialise()`. Write your answer in Python.","context_note":"`DataStored` is a global list that holds up to 20 integers and `NumberItems` is a global integer holding how many numbers are currently stored (both declared in part 1(a); start with `DataStored = []` and `NumberItems = 0`). A program needs to take r = int(input(\"Enter number: \"))       # prompt for each number\n        DataStored.append(Number)                   # store in next space\n        NumberItems = NumberItems + 1\n","confidence":"medium"},{"id":"s24-41-1ci","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"1(c)(i)","marks":2,"chapter":19,"subtopic":"main-program","prompt":"The main program stores 0 in `NumberItems`, calls `Initialise()` and then outputs the contents of `DataStored`.\n\nWrite program code for the main program. Write your answer in Python.","context_note":"`DataStored` is a global list that holds up to 20 integers and `NumberItems` is a global integer holding how many numbers are currently stored (both declared in part 1(a); start with `DataStored = []` and `NumberItems = 0`). The procedure `Initialise()` (part 1(b)) prompts for and stores the numbers in `DataStored`.","answer_type":"code","criteria":[{"point":"Stores 0 in NumberItems and then calls Initialise()","key_terms":["NumberItems = 0","Initialise()"]},{"point":"Outputs all the contents of the array DataStored","key_terms":["print(DataStored)","for","print"]}],"max_note":"max 2","rejects":["Accept printing the whole list at once, or looping and printing each element (up to NumberItems)."],"final_answer":"NumberItems = 0                 # store 0 in NumberItems\nInitialise()                    # then call Initialise()\nprint(DataStored)               # output all contents of DataStored\n","confidence":"high"},{"id":"s24-41-1di","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"1(d)(i)","marks":4,"chapter":19,"subtopic":"bubble-sort","prompt":"The procedure `BubbleSort()` uses a bubble sort to sort the data in `DataStored` into ascending numerical order.\n\nWrite program code for `BubbleSort()`. Write your answer in Python.","context_note":"`DataStored` is a global list that holds up to 20 integers and `NumberItems` is a global integer holding how many numbers are currently stored (both declared in part 1(a); start with `DataStored = []` and `NumberItems = 0`).","answer_type":"code","criteria":[{"point":"Procedure header for BubbleSort (and end where appropriate) and looping through each array element (outer loop)","key_terms":["def BubbleSort():","for","while"]},{"point":"A working inner loop through the array","key_terms":["for","range(","NumberItems"]},{"point":"Comparison of elements (adjacent or as in a valid bubble/exchange sort) so the order is ascending","key_terms":["if","DataStored[","> "]},{"point":"Swapping of elements (using a temporary variable or tuple assignment)","key_terms":["Temp","DataStored[Count2], DataStored[Count2 + 1]"]}],"max_note":"max 4","rejects":["Accept any valid bubble sort that ends with DataStored in ascending order (e.g. comparing adjacent elements, a flag-controlled while loop, or the scheme's own comparison of DataStored[Count2] with DataStored[Count]).","Inner loop must not run off the end of the data (index error) and must use NumberItems or len(DataStored) as the limit."],"final_answer":"def BubbleSort():                                   # header\n    global DataStored, NumberItems\n    for Count in range(NumberItems - 1):            # outer loop through the elements\n        for Count2 in range(NumberItems - 1 - Count):   # working inner loop\n            if DataStored[Count2] > DataStored[Count2 + 1]:   # comparison\n                Temp = DataStored[Count2]           # swap\n                DataStored[Count2] = DataStored[Count2 + 1]\n                DataStored[Count2 + 1] = Temp\n","confidence":"high"},{"id":"s24-41-1ei","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"1(e)(i)","marks":6,"chapter":19,"subtopic":"binary-search","prompt":"The function `BinarySearch()`:\n\n- takes the integer parameter `DataToFind` to search for in the array\n- performs an iterative binary search on the array `DataStored`\n- returns the index where `DataToFind` is found in `DataStored`. If `DataToFind` is not found, the function returns -1.\n\nWrite program code for the iterative function `BinarySearch()`. Write your answer in Python.","context_note":"`DataStored` is a global list that holds up to 20 integers and `NumberItems` is a global integer holding how many numbers are currently stored (both declared in part 1(a); start with `DataStored = []` and `NumberItems = 0`). `DataStored` has already been sorted into ascending order by `BubbleSort()`.","answer_type":"code","criteria":[{"point":"Function header BinarySearch taking DataToFind as a parameter","key_terms":["def BinarySearch(DataToFind):"]},{"point":"Calculates the mid value, e.g. (First + Last) // 2, inside the loop","key_terms":["(First + Last) // 2","Mid"]},{"point":"Checks inside the loop whether the data at mid equals DataToFind and returns mid","key_terms":["==","return Mid"]},{"point":"If DataToFind is less than the item at mid, updates Last/Upper to mid - 1 (inside the loop)","key_terms":["Last = Mid - 1"]},{"point":"If DataToFind is greater than the item at mid, updates First/Lower to mid + 1 (inside the loop)","key_terms":["First = Mid + 1"]},{"point":"Returns -1 when not found, with a suitable loop and end criteria","key_terms":["while First <= Last","return -1"]}],"max_note":"max 6","rejects":["The scheme's sample sets Last = NumberItems; accept that or Last = NumberItems - 1, but a solution that causes an index error for a valid input is not fully correct.","Accept int((First + Last) / 2) or // 2 for the mid calculation.","A recursive solution is not accepted (the question asks for an iterative function)."],"final_answer":"def BinarySearch(DataToFind):                        # header with parameter\n    global DataStored, NumberItems\n    First = 0\n    Last = NumberItems - 1\n    while First <= Last:                            # suitable loop and end criteria\n        Mid = (First + Last) // 2                   # mid value inside loop\n        if DataStored[Mid] == DataToFind:           # found\n            return Mid                              # return mid\n        if DataToFind < DataStored[Mid]:\n            Last = Mid - 1                          # search lower half\n        else:\n            First = Mid + 1                         # search upper half\n    return -1                                       # not found\n","confidence":"high"},{"id":"s24-41-1eii","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"1(e)(ii)","marks":3,"chapter":19,"subtopic":"main-program","prompt":"Write program code to amend the main program to:\n\n- take a number as input from the user\n- call `BinarySearch()` with the number input\n- output the value returned from the function call as its parameter.\n\nWrite your answer in Python.","context_note":"`DataStored` is a global list that holds up to 20 integers and `NumberItems` is a global integer holding how many numbers are currently stored (both declared in part 1(a); start with `DataStored = []` and `NumberItems = 0`). The function `BinarySearch(DataToFind)` (part 1(e)(i)) returns the index of `DataToFind` in `DataStored`, or -1 if it is not found. The main program already calls `Initialise()` and `BubbleSort()`.","answer_type":"code","criteria":[{"point":"Takes a number as input (converted to an integer)","key_terms":["int(input("]},{"point":"Calls BinarySearch with the number input","key_terms":["BinarySearch("]},{"point":"Outputs the value returned","key_terms":["print("]}],"max_note":"max 3","rejects":["Accept the result being stored in a variable and then printed."],"final_answer":"Search = int(input(\"Enter a number to find: \"))   # take number as input\nprint(BinarySearch(Search))                          # call with input and output returned value\n","confidence":"high"},{"id":"s24-41-2ai","session":"s24","variant":"41","paper_code":"9618/41 May/June 2024","q":"2(a)(i)","marks":4,"chapter":20,"subtopic":"class-definition","prompt":"Write program code to declare the class `Tree`
