 2026","q":"2(b)(i)","marks":7,"chapter":20,"subtopic":"text-file-read","prompt":"The procedure LoadAvatars() reads the data from the text file into the program. The procedure creates a new object for each avatar in the file and stores the avatar objects in a global array with the identifier AvailableAvatars.\n\nThe procedure uses exception handling when opening and reading from the file.\n\nWrite program code for LoadAvatars().\n\nWrite your answer in Python.","context_note":"A program stores data about avatars in a program using Object-Oriented Programming (OOP). An avatar is a character that a user can control in a game.\n\nClass Avatar stores the data about avatars:\n- TheName : String - the name of the avatar\n- Glasses : Boolean - TRUE if the avatar wears glasses, FALSE if not\n- Hair : String - the colour of the avatar's hair\n- Age : Integer - the age of the avatar\n- Constructor() - initialises all attributes to its parameter values\n- GetName() - returns the name of the avatar\n- GetAge() - returns the age of the avatar\n- MeetCriteria() - takes the glasses choice and hair choice as parameters and returns whether the avatar matches the choices\n\nThe text file AvatarFile.txt stores data for 30 avatars (the file is supplied in the exam). Each avatar is on a new line in the file. The data is stored in the order: name, glasses, hair colour, age. Each value is separated by a space. For example, the first line in the file is: Kit True blonde 21 (the avatar is called Kit, wears glasses, has blonde hair and is 21 years old).\n\nThe class Avatar already exists (written in part (a)) with a constructor Avatar(pName, pGlasses, pHair, pAge) and the methods GetName(), GetAge() and MeetCriteria(Glasses, Hair):\n\n```python\nclass Avatar():\n    def __init__(self, pName, pGlasses, pHair, pAge):\n        self.__TheName = pName        # string\n        self.__Glasses = pGlasses     # boolean\n        self.__Hair = pHair           # string\n        self.__Age = pAge             # integer\n\n    def GetName(self):\n        return self.__TheName\n\n    def GetAge(self):\n        return self.__Age\n\n    def MeetCriteria(self, Glasses, Hair):\n        return self.__Glasses == Glasses and self.__Hair == Hair\n```\n\nThe global array AvailableAvatars already exists as an empty list.","answer_type":"code","criteria":[{"point":"Procedure header (and end) and appropriate exception handling with an output message","key_terms":["def LoadAvatars(","try:","except","print("]},{"point":"Opens the text file (to read) and closes the file","key_terms":["open(\"AvatarFile.txt\"","close()","with open"]},{"point":"Loops until end of file / 30 times ...","key_terms":["for Line in","while","for"]},{"point":"... reading in each line","key_terms":["for Line in","readline","readlines"]},{"point":"Splits each line by space","key_terms":["split(\" \")","split()",".strip()"]},{"point":"Instantiates an Avatar object with the correct values (glasses as a Boolean, age as an integer)","key_terms":["Avatar(","int(","== \"True\""]},{"point":"Stores each object in the global array AvailableAvatars","key_terms":["AvailableAvatars.append(","global AvailableAvatars"]}],"max_note":"max 7","rejects":["Python pitfall: bool(\"False\") evaluates to True, so the Glasses value must be compared with \"True\" (or otherwise converted) to be the 'correct value'.","Using 'with open(...)' is accepted as closing the file (the official 9618/43 model answer does this).","Accept a bare 'except:' or a named exception, as long as an output message is given."],"final_answer":"# Q2(b)(i) - Avatar class from part (a), assumed already written\nclass Avatar():\n    def __init__(self, pName, pGlasses, pHair, pAge):\n        self.__TheName = pName        # string\n        self.__Glasses = pGlasses     # boolean\n        self.__Hair = pHair           # string\n        self.__Age = pAge             # integer\n\n    def GetName(self):\n        return self.__TheName\n\n    def GetAge(self):\n        r f Item.MeetCriteria(TheGlasses, TheHair):\n            OptionAvatars.append(Item)\n\nLoadAvatars()\nEnterChoices()\nprint([a.GetName() for a in OptionAvatars])\n","confidence":"high"},{"id":"s26-42-2cii","session":"s26","variant":"42","paper_code":"9618/42 May/June 2026","q":"2(c)(ii)","marks":5,"chapter":20,"subtopic":"main-program","prompt":"Write program code to extend the main program to:\n\n- call EnterChoices()\n- output the quantity of avatars that match the criteria\n- output the name and age of each avatar that matches the criteria.\n\nAll outputs must include an appropriate message.\n\nWrite your answer in Python.","context_note":"A program stores data about avatars in a program using Object-Oriented Programming (OOP). An avatar is a character that a user can control in a game.\n\nClass Avatar stores the data about avatars:\n- TheName : String - the name of the avatar\n- Glasses : Boolean - TRUE if the avatar wears glasses, FALSE if not\n- Hair : String - the colour of the avatar's hair\n- Age : Integer - the age of the avatar\n- Constructor() - initialises all attributes to its parameter values\n- GetName() - returns the name of the avatar\n- GetAge() - returns the age of the avatar\n- MeetCriteria() - takes the glasses choice and hair choice as parameters and returns whether the avatar matches the choices\n\nThe procedure EnterChoices() already exists: it asks the user for their choices and stores the avatars that match in the global array OptionAvatars (the name used in the official example). The Avatar class has the get methods GetName() and GetAge().","answer_type":"code","criteria":[{"point":"Calls EnterChoices()","key_terms":["EnterChoices()"]},{"point":"Counts/calculates the number of matching avatars and outputs it","key_terms":["len(OptionAvatars)","print("]},{"point":"Loops through each avatar that meets the criteria ...","key_terms":["for","OptionAvatars"]},{"point":"... outputting the name and age in an appropriate message ...","key_terms":["print(","name","age","years"]},{"point":"... using the get methods GetName() and GetAge()","key_terms":[".GetName()",".GetAge()"]}],"max_note":"max 5","rejects":["Each output must have a suitable message, not just bare values.","A message such as 'there are 0 avatars' is acceptable when none match; the loop may be guarded by a check for zero."],"final_answer":"# Q2(c)(ii) - supporting code from earlier parts (assumed already written)\nclass Avatar():\n    def __init__(self, pName, pGlasses, pHair, pAge):\n        self.__TheName = pName        # string\n        self.__Glasses = pGlasses     # boolean\n        self.__Hair = pHair           # string\n        self.__Age = pAge             # integer\n\n    def GetName(self):\n        return self.__TheName\n\n    def GetAge(self):\n        return self.__Age\n\n    def MeetCriteria(self, Glasses, Hair):\n        return self.__Glasses == Glasses and self.__Hair == Hair\n\ndef LoadAvatars():\n    global AvailableAvatars\n    try:\n        TheFile = open(\"AvatarFile.txt\")\n        for Line in TheFile:\n            DataSplit = Line.strip().split(\" \")\n            Glasses = DataSplit[1] == \"True\"\n            AvailableAvatars.append(Avatar(DataSplit[0], Glasses, DataSplit[2], int(DataSplit[3])))\n        TheFile.close()\n    except:\n        print(\"File not found\")\n\nAvailableAvatars = []\nOptionAvatars = []\n\ndef EnterChoices():\n    global AvailableAvatars, OptionAvatars\n    TheGlasses = None\n    while TheGlasses is None:\n        GlassesChoice = input(\"Do you want an avatar that wears glasses (yes or no)? \").lower()\n        if GlassesChoice == \"yes\":\n            TheGlasses = True\n        elif GlassesChoice == \"no\":\n            TheGlasses = False\n        else:\n            print(\"Invalid, enter yes or no\")\n    TheHair = \"\"\n    while TheHair not in (\"black\", \"blonde\", \"brown\", \"pink\", \"red\", \"green\"):\n        TheHair = input(\"What hair colour (black, blonde, brown, pink, red or green)? \").lower()\n    for Item in AvailableAvatars:\n        if Item.MeetCriteria(TheGlasses, TheHair):\n            OptionAvatars.append(Item)\n\n# main program extension\nLoadAvatars()\nEnterChoices()                                                           # call EnterChoices\nprint(\"There are\", len(OptionAvatars), \"avatars that meet your criteria\")   # quantity with message\nfor Item in OptionAvatars:                                               # each matching avatar\n    print(Item.GetName(), \"is\", Item.GetAge(), \"years old\")              # name and age via get methods\n","confidence":"high"},{"id":"s26-42-3a","session":"s26","variant":"42","paper_code":"9618/42 May/June 2026","q":"3(a)","marks":5,"chapter":19,"subtopic":"linked-list","prompt":"Write program code to declare and initialise the linked list and the pointers.\n\nWrite your answer in Python.","context_note":"A 2D array is used to store the linked list, LinkedList. The linked list stores a maximum of eight data items. Each data item is an integer.\n\nThe array elements not currently used in the linked list are stored as the empty list. LinkedList has two pointers:\n- StartLinkedList stores a pointer to the first node in the linked list\n- StartEmptyList stores a pointer to the first node in the empty list.\n\nA data value of -1 indicates there is no data in the node. A pointer of -1 indicates it is the end of the linked list, or the end of the empty list. The linked list and pointers all have global scope.\n\nThe linked list already has the following data stored:\n\n| array index | data | pointer |\n|---|---|---|\n| 0 | 9512 | 5 |\n| 1 | 5541 | 3 |\n| 2 | 1999 | 0 |\n| 3 | 6651 | -1 |\n| 4 | -1 | 6 |\n| 5 | 5612 | 1 |\n| 6 | -1 | -1 |\n| 7 | -1 | 4 |\n\nStartLinkedList currently stores 2. StartEmptyList currently stores 7.","answer_type":"code","criteria":[{"point":"LinkedList declared as a global 2D array with 8 x 2 elements (integers)","key_terms":["LinkedList","[","8"]},{"point":"StartLinkedList declared (integer) and initialised to 2","key_terms":["StartLinkedList = 2"]},{"point":"StartEmptyList declared (integer) and initialised to 7","key_terms":["StartEmptyList = 7"]},{"point":"LinkedList initialised with the correct data values ...","key_terms":["9512","5541","1999","6651","5612","-1"]},{"point":"... and the correct pointer values in the correct indices","key_terms":["[9512, 5]","[5541, 3]","[1999, 0]","[6651, -1]","[-1, 6]","[5612, 1]","[-1, -1]","[-1, 4]"]}],"max_note":"max 5","rejects":["Row i of the array must hold [data, pointer] for index i exactly as in the table (the order data then pointer is natural from the question's table).","Building the list with append(), a list literal or nested loops with assignment are all acceptable."],"final_answer":"# Q3(a)\nLinkedList = []                      # global 2D array, 8 rows x 2 columns: [data, pointer]\nLinkedList.append([9512, 5])         # index 0\nLinkedList.append([5541, 3])         # index 1\nLinkedList.append([1999, 0])         # index 2\nLinkedList.append([6651, -1])        # index 3\nLinkedList.append([-1, 6])           # index 4\nLinkedList.append([5612, 1])         # index 5\nLinkedList.append([-1, -1])          # index 6\nLinkedList.append([-1, 4])           # index 7\nStartLinkedList = 2                  # first node of the linked list\nStartEmptyList = 7                   # first node of the empty list\n\nprint(len(LinkedList), StartLinkedList, StartEmptyList, LinkedList[7])\n","confidence":"high"},{"id":"s26-42-3bi","session":"s26","variant":"42","paper_code":"9618/42 May/June 2026","q":"3(b)(i)","marks":4,"chapter":19,"subtopic":"linked-list","prompt":"The procedure PrintListItems() outputs the data in each node of the linked list.\n\nThe procedure starts with the first node in the linked list and follows the pointers until it has reached the end of the linked list.\n\nWrite program code for PrintListItems().\n\nWrite your answer in Python.","context_note":"A 2D array is used to s ist.append([9512, 5])\nLinkedList.append([5541, 3])\nLinkedList.append([1999, 0])\nLinkedList.append([6651, -1])\nLinkedList.append([-1, 6])\nLinkedList.append([5612, 1])\nLinkedList.append([-1, -1])\nLinkedList.append([-1, 4])\nStartLinkedList = 2\nStartEmptyList = 7\n\ndef PrintListItems():\n    global LinkedList, StartLinkedList\n    TempPosition = StartLinkedList\n    while TempPosition != -1:\n        print(LinkedList[TempPosition][0])\n        TempPosition = LinkedList[TempPosition][1]\n\ndef PrintEmptyList():\n    global LinkedList, StartEmptyList\n    TempPosition = StartEmptyList\n    while TempPosition != -1:\n        print(TempPosition)\n        TempPosition = LinkedList[TempPosition][1]\n\ndef AddItem(Item):\n    global LinkedList, StartLinkedList, StartEmptyList\n    if StartEmptyList != -1:\n        NewNode = StartEmptyList\n        LinkedList[NewNode][0] = Item\n        StartEmptyList = LinkedList[NewNode][1]\n        LinkedList[NewNode][1] = -1\n        TempPosition = StartLinkedList\n        while LinkedList[TempPosition][1] != -1:\n            TempPosition = LinkedList[TempPosition][1]\n        LinkedList[TempPosition][1] = NewNode\n    else:\n        print(\"List is full\")\n\n# main program extension\nAddItem(8451)                  # insert the new node\nprint(\"Linked list\")           # heading, then call\nPrintListItems()\nprint(\"Empty list\")            # heading, then call\nPrintEmptyList()\n","confidence":"high"},{"id":"s26-43-1b","session":"s26","variant":"43","paper_code":"9618/43 May/June 2026","q":"1(b)","marks":4,"chapter":19,"subtopic":"array-1d","prompt":"The procedure CreateArray() takes 15 strings as input from the user. Each input is converted to lower case and stored in DataArray in the order input.\n\nWrite program code for CreateArray().\n\nWrite your answer in Python.","context_note":"A program stores 15 strings in the global 1D array DataArray (in Python a list, declared as DataArray = [] to hold 15 strings).","answer_type":    WordFind = input(\"Enter the word to find \").lower()   # input converted to lower case\n    Counter = 0\n    for x in range(len(DataArray)):                  # loop through all elements\n        if DataArray[x] == WordFind:                 # compare with the input\n            Counter = Counter + 1                    # count occurrences\n    print(\"It was found\", Counter, \"times\")          # output the count\n\nFindWords()\n","confidence":"high"},{"id":"s26-43-1fi","session":"s26","variant":"43","paper_code":"9618/43 May/June 2026","q":"1(f)(i)","marks":5,"chapter":19,"subtopic":"bubble-sort","prompt":"The procedure SortLength() uses a bubble sort to order the elements in DataArray into ascending order by the length of each string.\n\nThe bubble sort needs to be efficient and stop iterating as soon as it identifies that DataArray is in the correct order.\n\nWrite program code for SortLength(). Do not use an in-built function to sort the array or check if the array is in the correct order.\n\nWrite your answer in Python.","context_note":"A program stores 15 strings in the global 1D array DataArray (in Python a list, declared as DataArray = [] to hold 15 strings). DataArray already holds the 15 strings.","answer_type":"code","criteria":[{"point":"Procedure header (and end) and iterates through each element (first/outer loop)","key_terms":["def SortLength(","while","for"]},{"point":"Inner loop comparing neighbouring elements","key_terms":["for","range(","DataArray[y]","DataArray[y+1]","DataArray[y + 1]"]},{"point":"Stops the loop when the data is in order (any method, e.g. a swap flag)","key_terms":["Swap","flag","break","False"]},{"point":"Compares by length (len() of the strings) ...","key_terms":["len(DataArray["]},{"point":"... and swaps correctly when the left one is longer than the right","key_terms":["DataArray[y], DataArray[y+1] = DataArray[y+1], DataArray[y]","Temp","swap"]}],"max_note":"max 5","rejects":["Any method of stopping early is accepted (a Boolean swap flag, a break when a pass makes no swaps, or similar).","No in-built sort functions (sort(), sorted()) and no in-built check for being in order.","Ascending order by length: shortest string first."],"final_answer":"# Q1(f)(i)\nDataArray = ['popping', 'one', 'house', '1', 'thirty', 'eleven', 'one']   # example contents (set up by earlier parts)\n\ndef SortLength():                                  # procedure header\n    Swap = True\n    Count = 0\n    while Count < len(DataArray) - 1 and Swap:     # outer loop, stops early when no swap\n        Swap = False\n        for y in range(len(DataArray) - 1 - Count):    # inner loop over neighbouring pairs\n            if len(DataArray[y]) > len(DataArray[y + 1]):   # compare by length\n                DataArray[y], DataArray[y + 1] = DataArray[y + 1], DataArray[y]   # swap\n                Swap = True\n        Count = Count + 1\n\nSortLength()\nprint(DataArray)\nL = [len(w) for w in DataArray]\nassert L == sorted(L)\n","confidence":"high"},{"id":"s26-43-2ai","session":"s26","variant":"43","paper_code":"9618/43 May/June 2026","q":"2(a)(i)","marks":4,"chapter":20,"subtopic":"class-definition","prompt":"Write program code to declare the class Character and its constructor.\n\nUse your programming language appropriate constructor.\n\nIf you are writing in Python, include attribute declarations using comments.\n\nWrite your answer in Python.","context_note":"A prototype for a game is being developed using Object-Oriented Programming (OOP). The game has a set of characters that have data stored about their characteristics, for example if the character can fly or not fly. A user has to select their requirements, for example a character that can fly, and the program will output the characters that meet the user's requirements.\n\nThe class Character stores the data about the characters. The attributes are public (the mark scheme example makes them private).\n- CharacterName : String - the character's name\n- Colour : St tFly(self):\n        return self.__Fly\n\n    def GetInvisible(self):\n        return self.__Invisible\n\ndef ReadData():\n    AllCharacters = []\n    try:\n        TheFile = open(\"Characters.txt\")\n        for Line in TheFile:\n            Parts = Line.strip().split(\",\")\n            AllCharacters.append(Character(Parts[0], Parts[1], Parts[2], Parts[3], Parts[4]))\n        TheFile.close()\n    except:\n        print(\"Cannot open or read the file\")\n    return AllCharacters\n\ndef OutputCharacters(CharacterArray):\n    for Item in CharacterArray:\n        print(\"Name:\", Item.GetCharacterName(), \"Colour:\", Item.GetColour(), \"Super strength:\", Item.GetSuperStrength(), \"Fly:\", Item.GetFly(), \"Invisible:\", Item.GetInvisible())\n\n# main program\nCharacterOptions = ReadData()           # call ReadData and store the returned array\nOutputCharacters(CharacterOptions)      # output using the returned array\n","confidence":"high"},{"id":"s26-43-2ei","session":"s26","variant":"43","paper_code":"9618/43 May/June 2026","q":"2(e)(i)","marks":8,"chapter":20,"subtopic":"main-program","prompt":"The main program needs to give the user two choices to limit the characters that they can choose from. For example, they could choose to only see characters that are green and that can fly.\n\nThe main program needs extending to:\n\n- prompt the user to enter two criteria and take both as input. For example, the colour green and that they have super strength.\n- create a new array with only the characters that meet both of the criteria.\n\nYou do not need to validate the inputs. You can assume that each criteria that the user inputs will be for a different characteristic of the character.\n\nThe main program should then:\n\n- output the number of characters that meet both criteria\n- use OutputCharacters() to output the characters that meet both criteria.\n\nWrite program code to extend the main program as described.\n\nWrite your answer in Python.","context_note":"A prototyp alculates the distance travelled by the bird using the formula: distance travelled = (distance per hour / 60) * minutes flying\n- updates the vertical or horizontal position using the distance calculated.\n\nYou do not need to validate the parameters.\n\nWrite program code for `Move()`.\n\nWrite your answer in Python.","context_note":"A program stores data about birds using Object-Oriented Programming (OOP). The class `Bird` stores the data about the birds:\n\n| Member | Description |\n|---|---|\n| DistancePerHour : Real | stores the number of kilometres per hour (km/h) the bird can fly (between 0.0 and 100.0 inclusive) |\n| Species : String | stores the species of the bird, for example Pigeon |\n| XPosition : Real | stores the current horizontal position of the bird |\n| YPosition : Real | stores the current vertical position of the bird |\n| Constructor() | initialises Species and DistancePerHour to the parameter values; initialises XPosition and YPosition to 500.0 |\n| GetPosition() | returns a string message that contains the horizontal and vertical position of the bird |\n| GetSpecies() | returns the species of the bird |\n| Move() | takes a direction and number of minutes flying (between 0 and 500 inclusive) as parameters and updates the appropriate horizontal or vertical position |\n\nAll attributes are private. In Python they are `self.__Species`, `self.__DistancePerHour`, `self.__XPosition` and `self.__YPosition`; write the method as it would appear inside `class Bird`.","answer_type":"code","criteria":[{"point":"Method header (and end) taking direction and minutes flying as parameters","key_terms":["def Move(self, Direction, MinsFlying)"]},{"point":"Calculates the distance using the minutes-flying parameter and the DistancePerHour attribute: (DistancePerHour / 60) * minutes","key_terms":["self.__DistancePerHour / 60","* MinsFlying"]},{"point":"Selection based on the direction parameter ...","key_terms":["if Direction ==","elif"]},{"point":"... North adds to YPosition and South subtracts from YPosition","key_terms":["self.__YPosition +","self.__YPosition -"]},{"point":"... East adds to XPosition and West subtracts from XPosition","key_terms":["self.__XPosition +","self.__XPosition -"]}],"max_note":"max 5 (1 mark each)","rejects":["No validation of the parameters is required.","The distance may be calculated once into a local variable and then used, or repeated inside each branch.","Direction letters are 'N', 'S', 'E', 'W' as given in the question."],"final_answer":"    # inside class Bird\n    def Move(self, Direction, MinsFlying):                          # header with direction and minutes parameters\n        Distance = (self.__DistancePerHour / 60) * MinsFlying       # distance from DistancePerHour attribute and minutes\n        if Direction == \"N\":                                        # selection on direction\n            self.__YPosition = self.__YPosition + Distance          # north adds to Y\n        elif Direction == \"S\":\n            self.__YPosition = self.__YPosition - Distance          # south subtracts from Y\n        elif Direction == \"E\":\n            self.__XPosition = self.__XPosition + Distance          # east adds to X\n        elif Direction == \"W\":\n            self.__XPosition = self.__XPosition - Distance          # west subtracts from X","confidence":"high"},{"id":"w25-42-1b","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"1(b)","marks":3,"chapter":20,"subtopic":"main-program","prompt":"The main program creates two instances of `Bird`.\n\nThe first bird is the species 'Cockatiel' and flies 71.0 km/h.\n\nThe second bird is the species 'Macaw' and flies 56.0 km/h.\n\nWrite program code to declare and initialise the two birds.\n\nWrite your answer in Python.","context_note":"A program stores data about birds using Object-Oriented Programming (OOP). The class `Bird` stores the data about the birds:\n\n| Member | Description |\n|---|---|\n| DistancePerHour ird = Bird(56.0, \"Macaw\")\n```","answer_type":"code","criteria":[{"point":"Outputs the species, X position and Y position of both Bird objects in appropriate message(s) (using GetSpecies() and GetPosition())","key_terms":["FirstBird.GetSpecies()","FirstBird.GetPosition()","SecondBird.GetSpecies()","SecondBird.GetPosition()","print"]},{"point":"Prompts for and inputs the bird choice, the time and the direction ...","key_terms":["input(","Choice","Time","Direction"]},{"point":"... validating all three inputs (choice is 1 or 2; time is 0 to 500; direction is N, S, E or W) ...","key_terms":["Choice != 1 and Choice != 2","Time < 0","Time > 500","Direction"]},{"point":"... looping until all three are valid","key_terms":["while"]},{"point":"Calls Move() for the chosen bird ...","key_terms":["FirstBird.Move(","SecondBird.Move("]},{"point":"... with only the input direction and the input time as arguments","key_terms":["Move(Direction, Time)","Move(Direction,Time)"]},{"point":"Outputs the new position for the bird that was moved","key_terms":["print","GetPosition()"]},{"point":"Uses the get methods throughout where appropriate (GetSpecies(), GetPosition()) rather than reading attributes directly","key_terms":["GetSpecies()","GetPosition()"]}],"max_note":"max 8 (1 mark each)","rejects":["The scheme's example accepts the direction as a letter or as the full word (N or NORTH, in any case, via .upper()); either is fine as long as Move() receives 'N', 'S', 'E' or 'W'.","Each input may have its own validation loop, or one combined loop; all three must be validated.","The scheme's example does not trap non-numeric input (ValueError); that is not required.","Outputs must have meaningful text, not bare values (the question requires it).","Move() must be called with just the direction and time (no attribute access from outside the class)."],"final_answer":"Choice = 0\nwhile Choice != 1 and Choice != 2:                       # validate choice, loop until valid\n    print(\"Which bird do you want to move?\")             # output species and position for both birds\n    print(\"Enter 1 for\", FirstBird.GetSpecies(), \"currently at\", FirstBird.GetPosition())\n    print(\"Enter 2 for\", SecondBird.GetSpecies(), \"currently at\", SecondBird.GetPosition())\n    Choice = int(input())                                # input the bird choice\n\nTime = -1\nwhile Time < 0 or Time > 500:                            # validate time 0 to 500, loop until valid\n    Time = int(input(\"To the nearest minute, how long has the bird been flying (0 to 500)? \"))\n\nDirection = \"\"\nwhile Direction not in [\"N\", \"S\", \"E\", \"W\"]:             # validate direction, loop until valid\n    Direction = input(\"Which direction has the bird been flying (N, S, E or W)? \").upper()\n    if Direction in [\"NORTH\", \"SOUTH\", \"EAST\", \"WEST\"]:  # also accept the full word\n        Direction = Direction[0]\n\nif Choice == 1:                                          # call Move() on the chosen bird with direction and time only\n    FirstBird.Move(Direction, Time)\n    print(FirstBird.GetSpecies(), \"is now at\", FirstBird.GetPosition())     # output the new position\nelse:\n    SecondBird.Move(Direction, Time)\n    print(SecondBird.GetSpecies(), \"is now at\", SecondBird.GetPosition())","confidence":"high"},{"id":"w25-42-2a","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"2(a)","marks":3,"chapter":19,"subtopic":"array-1d","prompt":"Write program code to declare the array local to the main program and store 20 unique random numbers between 0 and 100 (inclusive) in the array.\n\nWrite your answer in Python.","context_note":"A program stores 20 unique random integers between 0 and 100 (inclusive) in a 1D array that is local to the main program.","answer_type":"code","criteria":[{"point":"Creation of a 1D array ...","key_terms":["TheArray","[]","random.sample"]},{"point":"... with 20 generated random integers between 0 and 100 (inclusive) ...","key_terms":["random.randint(0, 100)","random.sample(range(0, 101), 20)","range(0,101)"]},{"point":"... all 20 random integers are unique","key_terms":["not in","random.sample"]}],"max_note":"max 3 (1 mark each)","rejects":["Any array/list identifier is accepted (the scheme uses TheArray).","Range must include both 0 and 100: random.randint(0,100) or range(0,101); range(0,100) excludes 100.","Uniqueness must be guaranteed (random.sample, or checking that a value is not already in the list before adding it); simply generating 20 random numbers without a check earns no uniqueness mark.","The answer needs 'import random' to run; do not penalise if the import line is missing from the answer text."],"final_answer":"import random\n\nTheArray = random.sample(range(0, 101), 20)   # 1D array of 20 unique random integers from 0 to 100 inclusive","confidence":"high"},{"id":"w25-42-2b","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"2(b)","marks":3,"chapter":19,"subtopic":"array-1d","prompt":"The procedure `PrintArray()` takes an integer array as a parameter. The procedure outputs the array contents on a single line with a space between each integer.\n\nWrite the program code for `PrintArray()`.\n\nWrite your answer in Python.","context_note":"A program stores 20 unique random integers between 0 and 100 (inclusive) in a 1D array that is local to the main program.","answer_type":"code","criteria":[{"point":"Procedure header (and end) taking the array as a parameter","key_terms":["def PrintArray(DataArray)"]},{"point":"Outputs the array contents once ...","key_terms":["for","print("]},{"point":"... on one line with a space between each integer","key_terms":["str(","\" \"","end=\" \"","\" \".join"]}],"max_note":"max 3 (1 mark each)","rejects":["All 20 integers must appear on one single line (one print call at the end, or print(..., end=\" \")), separated by spaces.","A trailing space at the end of the line is acceptable (the scheme's own example leaves one).","Accept ' '.join(str(x) for x in DataArray) or print(*DataArray) as valid ways to output on one line."],"final_answer":"def PrintArray(DataArray):                     # procedure header with array parameter\n    Output = \"\"\n    for Item in DataArray:                     # output every element\n        Output = Output + str(Item) + \" \"      # joined on one line, space between each integer\n    print(Output)                              # printed once, on a single line","confidence":"high"},{"id":"w25-42-2c","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"2(c)","marks":5,"chapter":19,"subtopic":"bubble-sort","prompt":"The function `BubbleSort()`:\n\n- takes an integer array as a parameter\n- sorts the data into ascending order using a bubble sort\n- returns the sorted array.\n\nThe function needs to work for an array of any length.\n\nDo not use an inbuilt sorting method.\n\nWrite program code for `BubbleSort()`.\n\nWrite your answer in Python.","context_note":"A program stores 20 unique random integers between 0 and 100 (inclusive) in a 1D array.","answer_type":"code","criteria":[{"point":"Function header (and end) taking the array parameter and returning the sorted array after sorting","key_terms":["def BubbleSort(DataArray)","return DataArray"]},{"point":"Outer loop ...","key_terms":["while","for"]},{"point":"... inner loop ...","key_terms":["for"]},{"point":"... comparing elements and swapping into ascending order","key_terms":["DataArray[y] > DataArray[y+1]","DataArray[y], DataArray[y+1] = DataArray[y+1], DataArray[y]"]},{"point":"Sort works for an array of any length, i.e. the loops use the length of the parameter array (len(DataArray)) and not a fixed 20","key_terms":["len(DataArray)"]}],"max_note":"max 5 (1 mark each)","rejects":["No inbuilt sort (sort(), sorted()) may be used.","Any valid bubble sort is accepted: a while loop with a swap flag and a for loop, or nested for loops.","Loop bounds hard-coded to 20 (or any fixed number) do not earn the any-length mark.","Swapping by temporary variable or tuple assignment are both fine."],"final_answer":"def BubbleSort(DataArray):                              # header, array parameter\n    Swap = True\n    while Swap == True:                                 # outer loop\n        Swap = False\n        for y in range(0, len(DataArray) - 1):          # inner loop, uses the length of the array (any length)\n            if DataArray[y] > DataArray[y + 1]:         # compare neighbours\n                DataArray[y], DataArray[y + 1] = DataArray[y + 1], DataArray[y]   # swap into ascending order\n                Swap = True\n    return DataArray                                    # return the sorted array","confidence":"high"},{"id":"w25-42-2di","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"2(d)(i)","marks":3,"chapter":19,"subtopic":"main-program","prompt":"The main program:\n\n- outputs the contents of the array using `PrintArray()`\n- sorts the array using `BubbleSort()`\n- outputs \"Sorted\"\n- outputs the contents of the sorted array using `PrintArray()`.\n\nWrite program code for the main program.\n\nWrite your answer in Python.","context_note":"The 1D array `TheArray` (20 unique random integers) already exists in the main program. The procedure `PrintArray(DataArray)` outputs the array on one line, and the function `BubbleSort(DataArray)` returns the sorted array.","answer_type":"code","criteria":[{"point":"Calls PrintArray() with the array as argument","key_terms":["PrintArray(TheArray)"]},{"point":"Calls BubbleSort() with the array as argument and stores/uses the return value","key_terms":["BubbleSort(TheArray)","SortedArray ="]},{"point":"Outputs \"Sorted\" and calls PrintArray() with the (returned) array as argument","key_terms":["print(\"Sorted\")","PrintArray(SortedArray)"]}],"max_note":"max 3 (1 mark each)","rejects":["The order must be: print unsorted array, sort, output the word Sorted, print sorted array.","Using the returned value or the original array (sorted in place by the function) in the final PrintArray() call are both acceptable."],"final_answer":"PrintArray(TheArray)                   # output the unsorted array\nSortedArray = BubbleSort(TheArray)     # sort, storing the returned array\nprint(\"Sorted\")                        # output Sorted\nPrintArray(SortedArray)                # output the sorted array","confidence":"high"},{"id":"w25-42-2e","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"2(e)","marks":6,"chapter":19,"subtopic":"binary-search","prompt":"The recursive function `RecursiveBinarySearch()` takes four parameters:\n\n- an integer array\n- the lower bound of the array\n- the upper bound of the array\n- the value to find in the array.\n\nThe recursive function performs a binary search to find the index of the value in the array.\n\nThe function returns the index of the value if it is found. The function returns -1 if the value is not found.\n\nWrite program code for `RecursiveBinarySearch()`.\n\nWrite your answer in Python.","context_note":"The array is a sorted 1D array of 20 unique integers between 0 and 100 (indexes 0 to 19).","answer_type":"code","criteria":[{"point":"Function header (and end) taking four parameters, and the function is recursive (calls itself)","key_terms":["def RecursiveBinarySearch(DataArray, Lower, Upper, DataToFind)","RecursiveBinarySearch("]},{"point":"Calculates the middle value (index)","key_terms":["Middle = (Lower + Upper) // 2","Lower + (Upper - Lower) // 2"]},{"point":"Compares the middle value to the data to find and returns the index if equal","key_terms":["DataArray[Middle] == DataToFind","return Middle"]},{"point":"If the middle value is greater than the value to find, recursive call with Middle - 1 as the upper bound","key_terms":["Middle - 1"]},{"point":"If the middle value is less than the value to find, recursive call with Middle + 1 as the lower bound","key_terms":["Middle + 1"]},{"point":"Checks whether the value is not found (Upper < Lower) and returns -1","key_terms":["Upper >= Lower","Upper < Lower","return -1"]}],"max_note":"max 6 (1 mark each)","rejects":["Middle must be an integer index: use // (integer division) or int(); a float index is an error in Python.","The recursive calls must pass the updated bounds and also the array and value to find, and their results must be returned (a call whose result is not returned loses the marks).","An iterative binary search (a while loop with no recursion) does not earn the recursion mark."],"final_answer":"def RecursiveBinarySearch(DataArray, Lower, Upper, DataToFind):   # header with four parameters\n    if Upper >= Lower:                                             # range not empty (otherwise fall through to return -1)\n        Middle = Lower + (Upper - Lower) // 2                      # middle index\n        if DataArray[Middle] == DataToFind:                        # found: return the index\n            return Middle\n        elif DataArray[Middle] > DataToFind:                       # too high: search lower half (recursive, Middle - 1)\n            return RecursiveBinarySearch(DataArray, Lower, Middle - 1, DataToFind)\n        else:                                                      # too low: search upper half (recursive, Middle + 1)\n            return RecursiveBinarySearch(DataArray, Middle + 1, Upper, DataToFind)\n    else:\n        return -1                                                  # not found","confidence":"high"},{"id":"w25-42-2fi","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"2(f)(i)","marks":3,"chapter":19,"subtopic":"main-program","prompt":"The main program:\n\n- prompts the user to enter an integer\n- takes the integer as input\n- calls `RecursiveBinarySearch()` with the sorted array, appropriate lower bound, appropriate upper bound and the user's input as parameters\n- outputs \"Not found\" if the input is not within the array\n- outputs \"Found at position\" and the index if the input is within the array.\n\nWrite program code to amend the main program.\n\nWrite your answer in Python.","context_note":"The sorted 1D array of 20 integers is stored in `SortedArray` (indexes 0 to 19). The function `RecursiveBinarySearch(DataArray, Lower, Upper, DataToFind)` returns the index of the value, or -1 if it is not found.","answer_type":"code","criteria":[{"point":"Prompt and input of an integer","key_terms":["int(input("]},{"point":"Calls RecursiveBinarySearch(SortedArray, 0, 19, input) with the correct bounds and stores/uses the return value","key_terms":["RecursiveBinarySearch(SortedArray, 0, 19,","Location ="]},{"point":"Outputs \"Not found\" if -1 is returned, otherwise outputs \"Found at position\" with the index returned","key_terms":["== -1","\"Not found\"","\"Found at position\""]}],"max_note":"max 3 (1 mark each)","rejects":["The input must be converted to an integer (int(input(...))); comparing a string to the integers in the array never matches.","Bounds must be 0 and 19 (or 0 and len(SortedArray) - 1).","The output text must be 'Not found' or 'Found at position' followed by the index."],"final_answer":"DataToFind = int(input(\"Enter the number to find: \"))                       # prompt and input an integer\nLocation = RecursiveBinarySearch(SortedArray, 0, 19, DataToFind)             # call with array, lower 0, upper 19, value\nif Location == -1:                                                           # not found\n    print(\"Not found\")\nelse:                                                                        # found: output text and index\n    print(\"Found at position\", Location)","confidence":"high"},{"id":"w25-42-3a","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"3(a)","marks":3,"chapter":19,"subtopic":"binary-tree","prompt":"The binary tree is stored as a global array with the identifier `TreeArray`. The left pointer, the data and the right pointer of each node are initialised to -1.\n\nThe global variable `RootPointer` stores the index of the root node in the tree, initialised to -1.\n\nThe global variable `FreeNode` stores the index of the next free node in the array, initialised to 0.\n\nWrite program code to declare and initialise `TreeArray`, `RootPointer` and `FreeNode`.\n\nWrite your answer in Python.","context_note":"A program stores integers in ascending order in an ordered binary tree. The tree is implemented as a 2D array.\n\nEach node is stored with three values: column 0 = a pointer to the left node, column 1 = the data, column 2 = a pointer to the right node.\n\nAll null values are stored as -1. The binary tree can store up to 50 nodes. Nodes cannot be deleted from the binary tree.","answer_type":"code","criteria":[{"point":"(Global) TreeArray declared as a 2D array with 50 x 3 elements ...","key_terms":["TreeArray = []","range(50)","[-1, -1, -1]","[-1]*3"]},{"point":"... all elements initialised to -1","key_terms":["-1,-1,-1","-1, -1, -1"]},{"point":"(Global) RootPointer initialised to -1 and FreeNode initialised to 0","key_terms":["RootPointer = -1","FreeNode = 0"]}],"max_note":"max 3 (1 mark each)","rejects":["Each row must be its own list: [[-1]*3]*50 makes all 50 rows the same list object, so changing one node would change them all; do not accept it as a correct 50 x 3 array.","Accept [[-1, -1, -1] for x in range(50)] or an append loop.","The variables must be at module (global) level, outside any function."],"final_answer":"TreeArray = []\nfor x in range(50):                 # 2D array: 50 rows x 3 columns\n    TreeArray.append([-1, -1, -1])  # left pointer, data, right pointer all initialised to -1\nRootPointer = -1                    # root pointer initialised to -1\nFreeNode = 0                        # next free node initialised to 0","confidence":"high"},{"id":"w25-42-3b","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"3(b)","marks":7,"chapter":19,"subtopic":"binary-tree","prompt":"The procedure `AddNode()`:\n\n- takes an integer to store in the binary tree as a parameter\n- stores the parameter in the next free node in the array\n- finds the position to store the data in the tree by following the appropriate pointers\n- updates the pointer of the new node's parent node.\n\nThe procedure outputs \"The tree is full\" if the parameter cannot be stored because the tree is full.\n\nWrite program code for `AddNode()`.\n\nWrite your answer in Python.","context_note":"A program stores integers in ascending order in an ordered binary tree. The tree is implemented as a 2D array.\n\nEach node is stored with three values: column 0 = a pointer to the left node, column 1 = the data, column 2 = a pointer to the right node.\n\nAll null values are stored as -1. The binary tree can store up to 50 nodes. Nodes cannot be deleted from the binary tree.\n\nThe global 2D list `TreeArray` (50 rows; each row is `[left pointer, data, right pointer]`), `RootPointer` (index of the root, -1 when the tree is empty) and `FreeNode` (index of the next free node, starting at 0) already exist and are initialised as:\n\n```python\nTreeArray = [[-1, -1, -1] for x in range(50)]\nRootPointer = -1\nFreeNode = 0\n```","answer_type":"code","criteria":[{"point":"Procedure header (and end) taking one (integer) parameter and storing the parameter in the array at TreeArray[FreeNode][1]","key_terms":["def AddNode(NodeData)","TreeArray[FreeNode][1] = NodeData"]},{"point":"Checks whether the tree is full (FreeNode = 50) and outputs \"The tree is full\"","key_terms":["FreeNode <= 49","FreeNode == 50","FreeNode >= 50","\"The tree is full\""]},{"point":"Checks whether the tree is empty (RootPointer = -1 // FreeNode = 0) and if so stores 0 in RootPointer","key_terms":["RootPointer == -1","RootPointer = 0"]},{"point":"(If not empty) compares the parameter to the data at TreeArray[RootPointer][1] ...","key_terms":["TreeArray[CurrentNode][1]","NodeData <"]},{"point":"... if less than, accesses the left node ...","key_terms":["TreeArray[CurrentNode][0]"]},{"point":"... if greater than, accesses the right node ...","key_terms":["TreeArray[CurrentNode][2]"]},{"point":"... until the location is found (a loop following pointers until a -1 pointer is reached) ...","key_terms":["while","== -1"]},{"point":"... updating the parent node's appropriate (left or right) pointer to FreeNode","key_terms":["TreeArray[CurrentNode][0] = FreeNode","TreeArray[CurrentNode][2] = FreeNode"]},{"point":"Incrementing FreeNode","key_terms":["FreeNode = FreeNode + 1","FreeNode += 1"]}],"max_note":"1 mark each to max 7 (9 mark points listed)","rejects":["Python needs 'global' declarations for RootPointer and FreeNode inside the procedure because they are reassigned; without them the code fails (UnboundLocalError), so the root/incrementing marks are not earned.","The new node's left and right pointers must be -1 (null); they are already -1 from initialisation so re-setting them is optional.","The scheme's example sends values equal to a node's data to the right subtree; accept either side for equal values.","Accept a recursive or iterative method of following the pointers.","The first value added (empty tree) goes to index 0 and RootPointer becomes 0."],"final_answer":"def AddNode(NodeData):\n    global FreeNode\n    global TreeArray\n    global RootPointer\n    if FreeNode <= 49:                                     # tree not full\n        TreeArray[FreeNode][0] = -1                        # store the parameter in the next free node (data column 1)\n        TreeArray[FreeNode][1] = NodeData\n        TreeArray[FreeNode][2] = -1\n        if RootPointer == -1:                              # empty tree: new node becomes the root\n            RootPointer = 0\n        else:\n            Placed = False\n            CurrentNode = RootPointer                      # start at the root, compare with TreeArray[CurrentNode][1]\n            while Placed == False:                         # follow pointers until the location is found\n                if NodeData < TreeArray[CurrentNode][1]:   # less than: go left\n                    if TreeArray[CurrentNode][0] == -1:\n                        TreeArray[CurrentNode][0] = FreeNode   # update parent's left pointer\n                        Placed = True\n                    else:\n                        CurrentNode = TreeArray[CurrentNode][0]\n                else:                                      # greater (or equal): go right\n                    if TreeArray[CurrentNode][2] == -1:\n                        TreeArray[CurrentNode][2] = FreeNode   # update parent's right pointer\n                        Placed = True\n                    else:\n                        CurrentNode = TreeArray[CurrentNode][2]\n        FreeNode = FreeNode + 1                            # increment FreeNode\n    else:\n        print(\"The tree is full\")                          # tree full message","confidence":"high"},{"id":"w25-42-3c","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"3(c)","marks":4,"chapter":20,"subtopic":"text-file-read","prompt":"The text file `TreeData.txt` stores 50 integers. Each integer is on a new line in the file.\n\nThe main program reads each integer from the file and stores each integer in the binary tree in the order they are read.\n\nWrite program code for the main program.\n\nWrite your answer in Python.","context_note":"`TreeData.txt` stores 50 integers, one per line (the file is supplied in the exam). The procedure `AddNode(NodeData)` already exists and stores an integer in the binary tree. The globals `TreeArray`, `RootPointer` and `FreeNode` are already declared and initialised.","answer_type":"code","criteria":[{"point":"Opens the file to read and closes the file in an appropriate place","key_terms":["open(\"TreeData.txt\"","close()","with open"]},{"point":"Loops 50 times / through the file / through each line / until end of file ...","key_terms":["for Line in","while","for"]},{"point":"... reads in each line ...","key_terms":["for Line in","readline()","int(Line"]},{"point":"... calls AddNode() with each value read in (converted to an integer)","key_terms":["AddNode(int("]},{"point":"Exception handling (try / except) with an appropriate message","key_terms":["try:","except","print("]}],"max_note":"1 mark each to max 4 (5 mark points listed)","rejects":["Each line must be converted to an integer (int(...)) before AddNode() is called; passing the string breaks the comparisons in the tree.","A 'with open(...)' block counts as opening and closing the file.","Accept looping with readlines(), a for loop over the file object, or a 50-iteration loop.","The scheme's example places the file access inside try/except with a message such as 'Error cannot open file'; exception handling is one of the five mark points but the maximum is 4."],"final_answer":"try:                                        # exception handling\n    File = open(\"TreeData.txt\", \"r\")        # open the file to read\n    for Line in File:                       # loop through each line, reading each value\n        AddNode(int(Line.strip()))          # call AddNode() with each integer read in\n    File.close()                            # close the file\nexcept:\n    print(\"Error: cannot open the file\")    # appropriate message","confidence":"high"},{"id":"w25-42-3d","session":"w25","variant":"42","paper_code":"9618/42 October/November 2025","q":"3(d)","marks":5,"chapter":20,"subtopic":"text-file-write","prompt":"The procedure `WriteAllToFile()` stores the content of `TreeArray` in a new text file with the filename `Tree.txt`. The file `Tree.txt` is not provided.\n\nEach node in `TreeArray` is stored on one line with a comma separating each value.\n\nFor example, if the first two nodes of `TreeArray` are `[-1, 20, 1]` and `[-1, 30, -1]` and all remaining nodes are `[-1, -1, -1]`, after writing `TreeArray` to the text file, `Tree.txt` will contain:\n\n```\n-1,20,1\n-1,30,-1\n...\n-1,-1,-1\n```\n\nWrite program code for `WriteAllToFile()`.\n\nInclude exception handling when writing to the file.\n\nWrite your answer in Python.","context_note":"A program stores integers in ascending order in an ordered binary tree. The tree is implemented as a 2D array.\n\nEach node is stored with three values: column 0 = a pointer to the left node, column 1 = the data, column 2 = a pointer to the right node.\n\nAll null values are stored as -1. The binary tree can store up to 50 nodes. Nodes cannot be deleted from the binary tree.\n\nThe global 2D list `TreeArray` has 50 rows; each row is `[left pointer, data, right pointer]`. `Tree.txt` is a new file created by the program (one line per node, 50 lines).","answer_type":"code","criteria":[{"point":"Procedure header (and end) with exception handling for writing to the file: try / except with an appropriate message","key_terms":["def WriteAllToFile()","try:","except","print("]},{"point":"Opens the file Tree.txt to write and closes the file in an appropriate place","key_terms":["open(\"Tree.txt\"","\"w\"","close()","with open"]},{"point":"Loops through each element (node) in the array ...","key_terms":["for x in range(0, 50)","for Node in TreeArray","for"]},{"point":"... creates the correct string: the three values separated by commas ...","key_terms":["str(TreeArray[x][0])","\",\"","join"]},{"point":"... writes each string to the file, each node on its own line","key_terms":["File.write(","\\n"]}],"max_note":"max 5 (1 mark each)","rejects":["Each node must be on its own line (a newline '\\n' written after each node) with values separated by commas and no spaces.","Integers must be converted to strings before being joined/written (str(...)); write() rejects ints.","The scheme's example opens Tree.txt in append mode ('a+') because the file is new; write mode 'w' is equally acceptable.","A 'with open(...)' block counts as opening and closing the file.","The try/except must surround the file writing."],"final_answer":"def WriteAllToFile():                                  # procedure header\n    try:                                               # exception handling around the file writing\n        File = open(\"Tree.txt\", \"w\")                   # open Tree.txt to write\n        for x in range(0, 50):                         # loop through each node\n            Line = str(TreeArray[x][0]) + \",\" + str(TreeArray[x][1]) + \",\" + str(TreeArray[x][2]) + \"\\n\"   # correct string\n            File.write(Line)                           # write each node on its own line\n        File.close()                                   # close the file\n    except:\n        print(\"Cannot write to file\")                  # appropriate message","confidence":"high"},{"id":"w25-43-1ai","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"1(a)(i)","marks":5,"chapter":20,"subtopic":"class-definition","prompt":"Write program code to declare the class `BoardObject` and its constructor.\n\nDo not declare the other methods.\n\nUse your programming language appropriate constructor.\n\nIf you are writing in Python, include attribute declarations using comments.\n\nWrite your answer in Python.","context_note":"A program stores data for a board game using Object-Oriented Programming (OOP). The game has objects that are placed on the board. Each object has a string code (for example \"A\") and an integer value (for example 2).\n\nThe class `BoardObject` stores the data about the objects that can be placed on the board:\n\n| Member | Description |\n|---|---|\n| Code : String | stores the board object's code |\n| Value : Integer | stores the integer value of the board object |\n| Constructor() | initialises the attributes to the parameter values |\n| GetCode() | returns Code |\n| GetValue() | returns Value |","answer_type":"code","criteria":[{"point":"Class header (and end where appropriate)","key_terms":["class BoardObject"]},{"point":"Declares Code as a string and Value as an integer (in Python: attribute declarations / type comments)","key_terms":["self.Code","self.Value","#string","#integer"]},{"point":"Constructor header (and end where appropriate) within the class ...","key_terms":["def __init__(self"]},{"point":"... taking two parameters ...","key_terms":["def __init__(self, Code, Value)","pCode","pValue"]},{"point":"... assigning the parameters to the attributes","key_terms":["self.Code = ","self.Value = "]}],"max_note":"max 5 (1 mark each)","rejects":["The question does not require the attributes to be private: public (self.Code) or private (self.__Code) attributes are both accepted, provided later methods use the same names.","The constructor must take exactly two parameters (code and value); parameter names are free.","In Python the attribute declarations may be given as comments (the question asks for this) or by the assignments themselves."],"final_answer":"class BoardObject():                       # class header\n    def __init__(self, Code, Value):       # constructor within the class, taking two parameters\n        self.Code = Code                   # string - attribute assigned from the parameter\n        self.Value = Value                 # integer - attribute assigned from the parameter","confidence":"high"},{"id":"w25-43-1aii","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"1(a)(ii)","marks":3,"chapter":20,"subtopic":"getters-setters","prompt":"The methods `GetCode()` and `GetValue()` return the appropriate attribute.\n\nWrite program code for `GetCode()` and `GetValue()`.\n\nWrite your answer in Python.","context_note":"A program stores data for a board game using Object-Oriented Programming (OOP). The game has objects that are placed on the board. Each object has a string code (for example \"A\") and an integer value (for example 2).\n\nThe class `BoardObject` stores the data about the objects that can be placed on the board:\n\n| Member | Description |\n|---|---|\n| Code : String | stores the board object's code |\n| Value : Integer | stores the integer value of the board object |\n| Constructor() | initialises the attributes to the parameter values |\n| GetCode() | returns Code |\n| GetValue() | returns Value |\n\nThe attributes are `self.Code` and `self.Value`. Write the methods as they would appear inside `class BoardObject`.","answer_type":"code","criteria":[{"point":"One get method header (and end where appropriate) with no parameter (other than self) ...","key_terms":["def GetCode(self)","def GetValue(self)"]},{"point":"... returning the correct value (without overriding / changing it)","key_terms":["return self.Code","return self.Value"]},{"point":"The second get method correct as well","key_terms":["def GetValue(self)","return self.Value"]}],"max_note":"max 3 (1 mark each)","rejects":["Both methods must return the value, not print it, and take no parameters apart from self.","Attribute names must match those the student used in part (a)(i)."],"final_answer":"    # inside class BoardObject\n    def GetCode(self):           # get method, no parameter\n        return self.Code         # returns Code\n    def GetValue(self):          # second get method\n        return self.Value        # returns Value","confidence":"high"},{"id":"w25-43-1aiii","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"1(a)(iii)","marks":3,"chapter":20,"subtopic":"main-program","prompt":"The table shows the code and value of five board objects. The table has the variable identifier where each of the objects are stored.\n\n| Variable identifier | Code | Value |\n|---|---|---|\n| Object1 | \"A\" | 2 |\n| Object2 | \"B\" | 3 |\n| Object3 | \"C\" | 5 |\n| Object4 | \"D\" | 2 |\n| Object5 | \"E\" | 7 |\n\nWrite program code for the main program to instantiate each of the five board objects and store them in the variables with the identifiers given.\n\nWrite te program code to declare the class `Board` and its constructor.\n\nDo not declare the other methods.\n\nUse your programming language appropriate constructor.\n\nIf you are writing in Python, include attribute declarations using comments.\n\nWrite your answer in Python.","context_note":"A program stores data for a board game using Object-Oriented Programming (OOP). The game has objects that are placed on the board. Each object has a string code (for example \"A\") and an integer value (for example 2).\n\nThe class `BoardObject` stores the data about the objects that can be placed on the board:\n\n| Member | Description |\n|---|---|\n| Code : String | stores the board object's code |\n| Value : Integer | stores the integer value of the board object |\n| Constructor() | initialises the attributes to the parameter values |\n| GetCode() | returns Code |\n| GetValue() | returns Value |\n\nThe board objects are placed on a board that is represented by a 0-indexed 2D array:\n\n- the board is a 10 x 10 grid\n- each position on the board is identified by a row and column number\n- rows are numbered 0 to 9 and columns are numbered 0 to 9\n- board objects can be placed at a row and column position\n- each board position is initialised with an empty `BoardObject`; an empty `BoardObject` has Code = \"-\" and Value = 0\n\nThe class `Board` stores the data about the board and where the board objects are placed:\n\n| Member | Description |\n|---|---|\n| TheBoard : ARRAY[0:9, 0:9] of BoardObject | stores the board contents as a 2D array of 10 x 10 elements of type BoardObject |\n| Constructor() | initialises each of TheBoard elements to an empty BoardObject with Code = \"-\" and Value = 0 |\n| GetObject() | takes a row and column number as parameters and returns the BoardObject at the row, column position |\n| SetObject() | takes a BoardObject, row number and column number as parameters. Stores the BoardObject in TheBoard at the given row, column position |\n| DisplayBoard() | outputs the code of each BoardObject stored in TheBoard, one row at a time |\n\nAssume the class `BoardObject` already exists with the constructor `BoardObject(Code, Value)`.","answer_type":"code","criteria":[{"point":"Class header (and end where appropriate) for Board","key_terms":["class Board"]},{"point":"Constructor header (and end where appropriate) within the class","key_terms":["def __init__(self)"]},{"point":"Declaration of a 2D array with 10 x 10 elements of type BoardObject (in Python: a list of 10 lists of 10 elements)","key_terms":["self.TheBoard = []","range(10)","append"]},{"point":"Stores a BoardObject with Code \"-\" and Value 0 in each array element","key_terms":["BoardObject(\"-\", 0)","BoardObject(\"-\",0)"]}],"max_note":"max 4 (1 mark each)","rejects":["Each element must be its own BoardObject object. A single shared empty object, or [[x]*10]*10 (which repeats the same row/object), is not a correct 10 x 10 array of separate objects.","Accept nested loops with append, or a list comprehension such as [[BoardObject(\"-\", 0) for y in range(10)] for x in range(10)].","Attribute name must be TheBoard (as given in the class table); a type comment is accepted for the declaration in Python."],"final_answer":"class Board():                                         # class header\n    def __init__(self):                                # constructor within the class\n        self.TheBoard = []                             # 2D array of BoardObject (type comment: list of 10 rows of 10 BoardObject)\n        for x in range(10):                            # 10 rows\n            TempList = []\n            for y in range(10):                        # 10 columns\n                TempList.append(BoardObject(\"-\", 0))   # empty BoardObject (Code \"-\", Value 0) in every element\n            self.TheBoard.append(TempList)","confidence":"high"},{"id":"w25-43-1bii","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"1(b)(ii)","marks":2,"chapter iven by the parameters","key_terms":["return self.TheBoard[Rowpos][Columnpos]"]}],"max_note":"max 2 (1 mark each)","rejects":["The method must return the object (not just print its code).","Row is the first index and column the second: self.TheBoard[row][column]."],"final_answer":"    # inside class Board\n    def GetObject(self, Rowpos, Columnpos):             # header, row and column parameters\n        return self.TheBoard[Rowpos][Columnpos]         # returns the BoardObject at that position","confidence":"high"},{"id":"w25-43-1biii","session":"w25","variant":"43","paper_code":"9618/43 October/November 2025","q":"1(b)(iii)","marks":2,"chapter":20,"subtopic":"getters-setters","prompt":"The method `SetObject()` takes three parameters: a `BoardObject`, row number and column number.\n\nThe method stores the `BoardObject` parameter in the row, column position in `TheBoard`.\n\nWrite program code for `SetObject()`.\n\nWrite your answer in Python.","context_note":"The board objects are placed on a board that is represented by a 0-indexed 2D array:\n\n- the board is a 10 x 10 grid\n- each position on the board is identified by a row and column number\n- rows are numbered 0 to 9 and columns are numbered 0 to 9\n- board objects can be placed at a row and column position\n- each board position is initialised with an empty `BoardObject`; an empty `BoardObject` has Code = \"-\" and Value = 0\n\nThe class `Board` stores the data about the board and where the board objects are placed:\n\n| Member | Description |\n|---|---|\n| TheBoard : ARRAY[0:9, 0:9] of BoardObject | stores the board contents as a 2D array of 10 x 10 elements of type BoardObject |\n| Constructor() | initialises each of TheBoard elements to an empty BoardObject with Code = \"-\" and Value = 0 |\n| GetObject() | takes a row and column number as parameters and returns the BoardObject at the row, column position |\n| SetObject() | takes a BoardObject, row number and column number as parameters. Stores the BoardOb
