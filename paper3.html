int moved 7 places right: 10100001.11)","key_terms":["000111","10100001.11"]},{"point":"Correct method to find the final answer (two's complement evaluation: -128 + 32 + 1 + 0.5 + 0.25)","key_terms":["-128","32"]},{"point":"Correct answer -94.25","key_terms":["-94.25"]}],"max_note":"max 2 for working, 1 for the answer","rejects":["Other methods of working are allowed.","Accept -94 1/4 as well as -94.25."],"final_answer":"Exponent 000111 = 7. Mantissa 1.010000111 with the point moved 7 places right = 10100001.11. Value = -128 + 32 + 1 + 0.5 + 0.25 = -94.25 (= -94 1/4).","confidence":"high"},{"id":"s26-31-4","session":"s26","variant":"31","paper_code":"9618/31 May/June 2026","q":"4","marks":4,"chapter":14,"subtopic":"TCP/IP","prompt":"Connect each TCP/IP layer to its most appropriate description (one line from each layer). State your answer as layer -> description.\n\nLayers: Application, Transport, Internet, Link.\n\nDescriptions (five boxes, one is not needed):\n- A: ensures packets arrive in sequence without errors\n- B: provides remote access to files on a host server to access and manage files stored in a remote location\n- C: interconnects nodes or hosts in a network, encapsulates IP packets into frames and ensures correct protocols are followed\n- D: identifies the intended network and host\n- E: contains all the programs that exchange data and includes protocols: HTTP, FTP and POP3","context_note":"","answer_type":"other","criteria":[{"point":"Application -> E (contains all the programs that exchange data and includes protocols: HTTP, FTP and POP3)","key_terms":["Application","HTTP, FTP and POP3"]},{"point":"Transport -> A (ensures packets arrive in sequence without errors)","key_terms":["Transport","sequence"]},{"point":"Internet -> D (identifies the intended network and host)","key_terms":["Internet","network and host"]},{"point":"Link -> C (interconnects nodes or hosts, encapsulates IP packets into frames and ensures correct protocols are followed)","key_te ,{"point":"Insert decremented","key_terms":["Insert - 1"]},{"point":"Temp values placed in the correct position in both arrays","key_terms":["MemberID[Insert + 1] ← Temp1","Names[Insert + 1] ← Temp2"]}],"max_note":"max 5 from 7 points","rejects":["The temporary variables must be named Temp1 and Temp2.","The insertion variable must be named Insert.","Do not accept bubble sort answers."],"final_answer":"FOR Count ← 1 TO 499\n   Temp1 ← MemberID[Count]\n   Temp2 ← Names[Count]\n   Insert ← Count - 1\n   WHILE Insert >= 0 AND MemberID[Insert] > Temp1\n      MemberID[Insert + 1] ← MemberID[Insert]\n      Names[Insert + 1] ← Names[Insert]\n      Insert ← Insert - 1\n   ENDWHILE\n   MemberID[Insert + 1] ← Temp1\n   Names[Insert + 1] ← Temp2\nNEXT Count","confidence":"high"},{"id":"s26-31-10b","session":"s26","variant":"31","paper_code":"9618/31 May/June 2026","q":"10(b)","marks":3,"chapter":19,"subtopic":"searching and sorting","prompt":"Describe the factors, other than changing the algorithm, that affect the time efficiency of the insertion sort algorithm.","context_note":"Insertion sort of the MemberID/Names arrays from 10(a).","answer_type":"text","criteria":[{"point":"Array size / number of elements in the array","key_terms":["number of elements"]},{"point":"... time efficiency improves if fewer elements are to be sorted (opposite accepted: worse with more)","key_terms":["fewer"]},{"point":"Initial order of the data","key_terms":["initial order"]},{"point":"... if the array is partially sorted the insertion sort works better (opposite accepted: reversed order is slower)","key_terms":["partially sorted"]}],"max_note":"max 3 from 4","rejects":["Allow the opposite for the size point (worse/more elements).","Allow the opposite for the order point (reversed/slower)."],"final_answer":"The number of elements (fewer elements sort faster) and the initial order of the data (a partially sorted array is sorted faster, a reversed one slower).","confidence":"high"},{"id":"s26-31-10c h 7 nodes (Home, A, B, C, D, E, F). Edges and weights:\n\n| Edge | Weight |\n|---|---|\n| Home - A | 6 |\n| Home - F | 16 |\n| A - B | 8 |\n| A - C | 3 |\n| A - F | 8 |\n| B - C | 4 |\n| C - D | 12 |\n| D - F | 6 |\n| D - E | 7 |\n| F - E | 3 |\n\nAnswer table to complete: | A | B | C | D | E | F |","context_note":"The A* and Dijkstra's algorithms are both used to search a graph.","answer_type":"calculation","criteria":[{"point":"Initialisation: Home set to 0","key_terms":["0"]},{"point":"... and all the other nodes set to infinity","key_terms":["infinity"]},{"point":"Evidence of values at nodes being updated","key_terms":[]},{"point":"Evidence of 'visited' nodes (nodes marked or listed as visited)","key_terms":[]},{"point":"Evidence of a correct calculation of at least one route from the component edge distances","key_terms":[]},{"point":"Evidence that more than one route has been calculated for at least one node","key_terms":[]},{"point":"Correct final distances (two marks for all six, one mark for four or five)","key_terms":["A 6","B 13","C 9","D 20","E 17","F 14"]}],"max_note":"working: any 3 of the 6 working points (max 3); correct answers: max 2 (2 for six correct values, 1 for four or five); total 5","rejects":["Working marks can be on the diagram or in a working section","Infinity symbol must be on every node except Home (or clearly labelled in the working)","Correct totals clearly identified in the working earn the answer marks"],"final_answer":"Home = 0; A = 6; C = 6 + 3 = 9; B = 9 + 4 = 13 (not 6 + 8 = 14); F = 6 + 8 = 14 (not 16); E = 14 + 3 = 17; D = 14 + 6 = 20 (not 9 + 12 = 21; not 17 + 7 = 24).\n\n| A | B | C | D | E | F |\n|---|---|---|---|---|---|\n| 6 | 13 | 9 | 20 | 17 | 14 |","confidence":"high"},{"id":"s26-32-10a","session":"s26","variant":"32","paper_code":"9618/32 May/June 2026","q":"10(a)","marks":3,"chapter":19,"subtopic":"Big-O","prompt":"A linear search and a binary search are two searching algorithms. Describe how increasing the number o teria":[{"point":"Correct completion of the FUNCTION header (parameter with type, RETURNS STRING)","key_terms":["TempCheck(Position : INTEGER) RETURNS STRING"]},{"point":"Correct OPENFILE statement (file name, RANDOM mode)","key_terms":["OPENFILE \"Temperatures.dat\" FOR RANDOM"]},{"point":"Correct use of SEEK with the parameter as the position","key_terms":["SEEK \"Temperatures.dat\", Position"]},{"point":"Correct use of GETRECORD into Temperature","key_terms":["GETRECORD \"Temperatures.dat\", Temperature"]},{"point":"Correct complete selection structure IF ... THEN ... ELSE ... ENDIF (or multiple IF ... THEN ... ENDIF)","key_terms":["IF","THEN","ELSE","ENDIF"]},{"point":"Correct logic linking the condition to the action, producing the appropriate message","key_terms":["Not freezing","Freezing"]},{"point":"Correct use of CLOSEFILE, after GETRECORD and before any RETURN","key_terms":["CLOSEFILE \"Temperatures.dat\""]},{"point":"Correct RETURN statement(s); other variables may be used instead of Response","key_terms":["RETURN Response"]}],"max_note":"any 6 from 8 (MP1-MP8)","rejects":["The parameter name can be anything but must be the same variable used in the SEEK line to earn the SEEK mark","CLOSEFILE mark is not awarded if the RETURN statement(s) come before the CLOSEFILE line","The selection and RETURN marks may be given together if RETURN is inside the selection statement","Check RETURN and RETURNS are used correctly","Response variable need not be used (other variables allowed in RETURN)","The model answer treats exactly 0 as 'Freezing' (condition Temperature > 0)"],"final_answer":"FUNCTION TempCheck(Position : INTEGER) RETURNS STRING\n    DECLARE Temperature : REAL\n    DECLARE Response : STRING\n    OPENFILE \"Temperatures.dat\" FOR RANDOM\n    SEEK \"Temperatures.dat\", Position\n    GETRECORD \"Temperatures.dat\", Temperature\n    IF Temperature > 0 THEN\n        Response <- \"Not freezing\"\n    ELSE\n        Response <- \"Freezing\"\n    ENDIF\n    CLOSEFILE \"Temperatures.dat\"\n    RETURN Response\nENDFUNCTION","confidence":"high"},{"id":"s26-32-11a","session":"s26","variant":"32","paper_code":"9618/32 May/June 2026","q":"11(a)","marks":5,"chapter":20,"subtopic":"OOP","prompt":"Write pseudocode statements to declare the Node class, its attributes (Content : STRING, Pointer : INTEGER) and the constructor that has two parameters and sets these attributes.","context_note":"An OOP design includes a class called Node with a STRING attribute Content and an INTEGER attribute Pointer, with getters and setters, and a constructor taking two parameters.","answer_type":"pseudocode","criteria":[{"point":"Correct CLASS Node ... ENDCLASS statements","key_terms":["CLASS Node","ENDCLASS"]},{"point":"Attribute declarations before the constructor, using Content as STRING and Pointer as INTEGER","key_terms":["Content : STRING","Pointer : INTEGER"]},{"point":"Constructor begun and ended correctly as PUBLIC PROCEDURE NEW ... ENDPROCEDURE","key_terms":["PUBLIC PROCEDURE NEW","ENDPROCEDURE"]},{"point":"Two parameters with appropriate names and data types (names other than Content and Pointer)","key_terms":[]},{"point":"Values passed in are assigned correctly to the attributes (setters may be used)","key_terms":["Content <-","Pointer <-"]}],"max_note":"one mark per mark point, max 5","rejects":["The class name Node must be used","The attributes must be named Content and Pointer with types STRING and INTEGER","Parameter names can be anything except Content and Pointer","The parameters must be assigned to the attributes from the attribute section","Use of setters in the constructor is allowed"],"final_answer":"CLASS Node\n    PRIVATE Content : STRING\n    PRIVATE Pointer : INTEGER\n    PUBLIC PROCEDURE NEW(NewContent : STRING, NewPointer : INTEGER)\n        Content <- NewContent\n        Pointer <- NewPointer\n    ENDPROCEDURE\nENDCLASS","confidence":"high"},{"id":"s26-32-11b","session":"s26","variant":"32","paper_code":"9618/32 May/June 2 hared pools of memory","key_terms":[]}],"max_note":"any 3 from 5","rejects":["Accept 'many', 'multiple', 'thousands' or 'an extremely large number' of processors","Do not accept 'some' or 'several' for the number of processors"],"final_answer":"Many (thousands of) processors are linked together to act as one far more powerful machine. They all work simultaneously on the same problem, each handling its own part, and communicate through interconnected data pathways/networks or shared memory.","confidence":"high"},{"id":"s26-33-4b","session":"s26","variant":"33","paper_code":"9618/33 May/June 2026","q":"4(b)","marks":2,"chapter":15,"subtopic":"parallel processing","prompt":"State one difference and one similarity between the SIMD and MISD computer architectures.","context_note":"","answer_type":"text","criteria":[{"point":"Difference: SIMD processors all execute the same instruction whereas MISD processors perform different instructions","key_terms":["same instruction","different instructions"]},{"point":"Difference: SIMD works on many data streams/elements simultaneously whereas MISD all work on the same data source/element","key_terms":[]},{"point":"Difference: MISD systems are more complex than SIMD (the scheme says 'than SISD'; the reverse is also allowed)","key_terms":[]},{"point":"Similarity: both are parallel systems","key_terms":["parallel"]},{"point":"Similarity: both use multiple processors","key_terms":["multiple processors"]},{"point":"Similarity: both may be pipelined","key_terms":["pipelined"]},{"point":"Similarity: neither is well suited to sequential applications such as office productivity software or compilers","key_terms":[]}],"max_note":"one mark for a difference (max 1) and one mark for a similarity (max 1)","rejects":["Both SIMD and MISD must appear or be clearly inferred in each response to gain the mark","Simply expanding the acronym is not enough"],"final_answer":"Difference: SIMD processors all execute the same instruction on many data items at once, whereas MISD processors execute different instructions on the same data item. Similarity: both are parallel architectures using multiple processors.","confidence":"high"},{"id":"s26-33-5a","session":"s26","variant":"33","paper_code":"9618/33 May/June 2026","q":"5(a)","marks":4,"chapter":13,"subtopic":"floating-point","prompt":"Numbers are stored in a computer using binary floating-point representation with:\n\n- 12 bits for the mantissa\n- 4 bits for the exponent\n- two's complement form for both the mantissa and the exponent.\n\nCalculate the normalised binary floating-point representation of -18.5625 in this system. Show your working, and give the final mantissa (12 bits) and exponent (4 bits).","context_note":"","answer_type":"calculation","criteria":[{"point":"Converts the positive number to binary, e.g. 18.5625 = 010010.100100","key_terms":["010010.100100"]},{"point":"Finds the two's complement (flip the bits and add 1): 101101.011100","key_terms":["101101.011100"]},{"point":"Correct mantissa (normalised, starts 10)","key_terms":["101101011100"]},{"point":"Correct exponent","key_terms":["0101"]}],"max_note":"max 2 for working, max 2 for the final mantissa and exponent; alternative methods of working are allowed","rejects":["Alternative methods of working are allowed"],"final_answer":"18.5625 = 10010.1001 in binary = 010010.100100 (12 bits, with the point after 6 integer bits). Flip the bits and add 1 for -18.5625: 101101.011100. Normalise by moving the point 5 places to the left so the mantissa begins 1.0: 1.01101011100 x 2^5. Mantissa = 1 0 1 1 0 1 0 1 1 1 0 0 (101101011100); exponent = 5 = 0 1 0 1 (0101).","confidence":"high"},{"id":"s26-33-5b","session":"s26","variant":"33","paper_code":"9618/33 May/June 2026","q":"5(b)","marks":3,"chapter":13,"subtopic":"floating-point","prompt":"Using the same system (12-bit two's complement mantissa, 4-bit two's complement exponent), the denary numbers 91.5 and 123.25 are each stored in floating-point form and then added together, with the result stored in the system.\n\nExplain the problem that would occur.","context_note":"Same floating-point system as part (a): 12-bit mantissa, 4-bit exponent, both in two's complement.","answer_type":"text","criteria":[{"point":"The sum of the two numbers would be 214.75","key_terms":["214.75"]},{"point":"This exceeds the largest number that can be stored in the system with an exponent of 7 (which is 127.9375)","key_terms":["127.9375","7"]},{"point":"An exponent of 8 would be needed to extend the range beyond 128","key_terms":["8","128"]},{"point":"Overflow would occur","key_terms":["overflow"]}],"max_note":"any 3 from 4","rejects":[],"final_answer":"91.5 + 123.25 = 214.75. The largest value this system can hold has exponent 7 (4-bit two's complement) and is 127.9375, so 214.75 is too big; an exponent of 8 would be needed, which a 4-bit two's complement exponent cannot hold. Overflow occurs.","confidence":"high"},{"id":"s26-33-6ai","session":"s26","variant":"33","paper_code":"9618/33 May/June 2026","q":"6(a)(i)","marks":2,"chapter":15,"subtopic":"Karnaugh maps","prompt":"The Karnaugh map (K-map) below represents a logic circuit with four inputs A, B, C and D (columns are AB, rows are CD, both in Gray code order).\n\n| CD \\ AB | 00 | 01 | 11 | 10 |\n|---|---|---|---|---|\n| 00 | 0 | 1 | 1 | 0 |\n| 01 | 0 | 1 | 0 | 0 |\n| 11 | 0 | 1 | 0 | 0 |\n| 10 | 0 | 1 | 1 | 0 |\n\nDraw loop(s) around suitable group(s) in the K-map to give an optimal sum-of-products. (Describe each loop by the cells it contains.)","context_note":"","answer_type":"diagram","criteria":[{"point":"Loop 1: the whole AB=01 column (all four 1s: CD=00, 01, 11, 10)","key_terms":["AB=01"]},{"point":"Loop 2: the four corner 1s, i.e. columns AB=01 and AB=11 in rows CD=00 and CD=10 (wrapping top to bottom)","key_terms":["CD=00","CD=10","AB=11"]}],"max_note":"one mark per correct loop; if any incorrect loop is seen, max 1","rejects":["If incorrect loops are seen, maximum 1 mark"],"final_answer":"Loop 1 = column AB=01 (cells at CD=00, 01, 11, 10). Loop 2 = the four cells (AB=01, CD=00), (AB=11, CD=00), (AB=01, CD=10), (AB=11, CD=10), which wrap around the top and bottom rows.","confidence":"high"},{"id":"s26-33-6aii","session":"s26","variant":"33","paper_code":"9618/33 May/June 2026","q":"6(a)(ii)","marks":2,"chapter":15,"subtopic":"Karnaugh maps","prompt":"Write the Boolean expression that comes from your loops in 6(a)(i) as a simplified sum-of-products. Do not carry out any further simplification.\n\nK-map for reference (columns AB, rows CD):\n\n| CD \\ AB | 00 | 01 | 11 | 10 |\n|---|---|---|---|---|\n| 00 | 0 | 1 | 1 | 0 |\n| 01 | 0 | 1 | 0 | 0 |\n| 11 | 0 | 1 | 0 | 0 |\n| 10 | 0 | 1 | 1 | 0 |\n\n(Use NOT A / NOT D, or an overbar, for inverted inputs.)","context_note":"Follows from the optimal loops in 6(a)(i).","answer_type":"text","criteria":[{"point":"One correct Boolean term (NOT A AND B, or B AND NOT D)","key_terms":["NOT A.B","B.NOT D"]},{"point":"Both correct terms joined by OR, with no other terms present","key_terms":["+"]}],"max_note":"terms can be in either order","rejects":["Accept AND written without a dot, e.g. AB for A.B","Both terms must be joined by an OR sign and no other terms may be present for the second mark","The guidance box also shows a handwritten example (NOT A.B + B.NOT C.NOT D + B.C.NOT D) with no accompanying text, so exactly how it is credited is unclear"],"final_answer":"NOT A . B + B . NOT D (written in the paper with overbars on A and D)","confidence":"medium"},{"id":"s26-33-6aiii","session":"s26","variant":"33","paper_code":"9618/33 May/June 2026","q":"6(a)(iii)","marks":1,"chapter":15,"subtopic":"Boolean algebra","prompt":"Take your sum-of-products expression from 6(a)(ii) and write it in its simplest form using Boolean algebra.\n\nExpected input expression (for reference): NOT A . B + B . NOT D","context_note":"Follows from 6(a)(ii).","answer_type":"text","criteria":[{"point":"Factorises out B to give B.(   /* ---------- time result: colored boxes. exam pace = 72 s per mark (75 marks in 90 minutes) ---------- */
  function tmState(sec, marks){ var r = sec / Math.max(1, marks * 72); return r <= 1 ? "ok" : r <= 1.5 ? "warn" : "bad"; }
  function tmSecOf(a){ return a.ms != null ? a.ms / 1000 : (a.secs || 0); }
  function tmFmt(sec){ sec = Math.round(sec); return Math.floor(sec/60) + ":" + ("0"+(sec%60)).slice(-2); }
  function timeBoxes(it, r){
    var sec = tmSecOf(r); if(!(sec > 0)) return "";
    var pace = it.marks * 72, st = tmState(sec, it.marks), diff = Math.round(sec - pace), perMark = Math.round(sec / it.marks);
    var word = {ok:"On pace", warn:"A bit slow", bad:"Too slow"}[st];
    var h = "<div class='tbs' role='group' aria-label='Time result'>"+
      "<div class='tb "+st+"' title='"+(r.ms!=null?Math.round(r.ms)+" ms":"")+"'><b>"+tmFmt(sec)+"</b><span>Time spent · "+word+"</span></div>"+
      "<div class='tb info'><b>"+tmFmt(pace)+"</b><span>Exam pace for "+it.marks+(it.marks===1?" mark":" marks")+"</span></div>"+
      "<div class='tb "+st+"'><b>"+(diff<=0?"−":"+")+tmFmt(Math.abs(diff))+"</b><span>"+(diff<=0?"under":"over")+" the pace</span></div>"+
      "<div class='tb "+st+"'><b>"+perMark+" s</b><span>per mark (target 72 s)</span></div></div>";
    var note = "";
    if(sec < pace * 0.35 && r.awarded < r.marks) note = "Very quick and marks were lost. Read the question twice and write one point per mark before you press Mark.";
    else if(st === "bad") note = "Over time. In the exam this question would have eaten into the next one. Practise writing the same answer faster, with fewer words per point.";
    else if(st === "warn") note = "Slightly over the pace. Fine for learning, but aim to finish inside "+tmFmt(pace)+".";
    else note = "Inside the exam pace.";
    h += "<div class='tbn'>"+note+"</div>";
    var tries = attempts.filter(function(a){ return a.id === it.id && tmSecOf(a) > 0; }).sort(function(x,y){ return x.ts - y.ts; });
    if(tries.length > 1){
      h += "<div class='tries' aria-label='Time on each try'>"+tries.map(function(a,i){ var s = tmState(tmSecOf(a), a.marks); return "<span class='try "+s+(a.k===r.k?" cur":"")+"'>Try "+(i+1)+" · "+a.awarded+"/"+a.marks+" · "+tmFmt(tmSecOf(a))+"</span>"; }).join("")+"</div>";
    }
    return h;
  }

    if(!noNav) h += "<div class='row stick'><button class='btn' id='retry' title='Shortcut: R'>Try this question again</button><span class='grow'></span><button class='btn primary' id='nextq' title='Shortcut: N'"+(idx>=queue.length-1?" disabled":"")+">Next question (N)</button></div>";
    return h + "</div>";
  }

  /* ---------- marking ---------- */
  /* ---------- marker integrity: every quote is checked against the real answer ---------- */
  function mnorm(s){ return String(s||"").toLowerCase().replace(/<-/g,"←").replace(/[^a-z0-9←<>=+\-*\/&]/g,""); }
  function shapePts(it, r){
    return (r.points||[]).slice(0, it.criteria.length).map(function(p,i){
      return {point:(it.criteria[(typeof p.i==="number"?p.i:i)]||it.criteria[i]||{point:""}).point, credited:!!p.credited, evidence:String(p.evidence||""), why:String(p.why||"")};
    });
  }
  function evFrags(ev){ return String(ev||"").split(/\s*(?:\.\.\.|…|\|\||\n)\s*/).map(mnorm).filter(function(f){ return f.length>=1; }); }
  function evOk(A, ev){ var f = evFrags(ev); return f.length>0 && f.every(function(x){ return A.indexOf(x)>=0; }); }
  function slipQuote(s){ var m = String(s).match(/`([^`]{3,})`|[“"]([^”"]{3,})[”"]/); return m ? mnorm(m[1]||m[2]) : ""; }
  function auditPrompt(it, ans, issues, res){
    var L = [];
    L.push("You are an independent checker of ONE marked A-level Computer Science (9618 Paper 3 Advanced Theory) answer. A first marker made claims about what the student wrote, and some of those claims could not be verified in her text. Your job is to correct them.");
    L.push("Use ONLY the student's answer text below. Mark FAIRLY, as a Cambridge examiner would: give a mark when the answer clearly conveys the idea in the mark point, in any equivalent wording; do not invent words the student did not write; do not withhold a mark for an idea that is really there. Copy evidence character for character from the answer.");
    L.push("");
    L.push("QUESTION ("+it.marks+" mark"+(it.marks===1?"":"s")+"): "+it.prompt);
    L.push("");
    L.push("MARK SCHEME POINTS:");
    it.criteria.forEach(function(c,i){ L.push(i+". "+c.point+(c.key_terms&&c.key_terms.length?"   [exact terms: "+c.key_terms.join(" | ")+"]":"")); });
    if(it.rejects && it.rejects.length) L.push("NEVER CREDIT: "+it.rejects.join(" ; "));
    L.push("");
    L.push("STUDENT ANSWER:\n\"\"\"\n"+ans+"\n\"\"\"");
    L.push("");
    L.push("CHECK THESE CLAIMS:");
    issues.forEach(function(x){
      if(x.kind==="point"){ var p = res.points[x.i]; L.push("- Point "+x.i+": first marker said credited="+p.credited+", evidence: \""+p.evidence+"\" ("+x.why+")"); }
      else { L.push("- Slip "+x.n+": "+res.slips[x.n]+" ("+x.why+")"); }
    });
    L.push("");
    L.push("Reply with ONLY one JSON object: {\"points\":[{\"i\":0,\"credited\":true,\"evidence\":\"words copied exactly from the answer, or ''\",\"why\":\"1-2 sentences that quote only words really in the answer\"}],\"slips\":[{\"n\":0,\"real\":true,\"text\":\"the slip as `exact text from the answer` -> `correct version`, or ''\"}]}. Include an entry for every point and slip listed above and no others.");
    return L.join("\n");
  }
  function auditMarking(it, ans, res){
    if(DRAWKIND[it.id] || !String(ans||"").trim()) { res.audit = ""; return Promise.resolve(res); }
    var A = mnorm(ans), issues = [];
    res.points.forEach(function(p,i){
      var frags = evFrags(p.evidence), bad = frags.filter(function(f){ return A.indexOf(f)<0; });
      if(bad.length) issues.push({kind:"point", i:i, why:"some quoted words are not in the answer"});
      else if(p.credited && !frags.length) issues.push({kind:"point", i:i, why:"credited without quoting the student's words"});
    });
    res.slips.forEach(function(s,n){ var q = slipQuote(s); if(q && A.indexOf(q)<0) issues.push({kind:"slip", n:n, why:"the text it says she wrote is not in the answer"}); });
    if(!issues.length){ res.audit = "ok"; return Promise.resolve(res); }
    return sampleFn.json(auditPrompt(it, ans, issues, res), {modelTier:"default"}).then(function(a){
      var changed = 0;
      (a.points||[]).forEach(function(q){
        var i = q.i; if(typeof i!=="number" || !res.points[i] || !issues.some(function(x){ return x.kind==="point" && x.i===i; })) return;
        var p = res.points[i], cr = !!q.credited, ev = String(q.evidence||"");
        if(cr && !evOk(A, ev)){ cr = false; ev = ""; q.why = "No wording in your answer could be matched to this point."; }
        if(!cr && !evOk(A, ev)) ev = "";
        if(cr !== p.credited) changed++;
        p.credited = cr; p.evidence = ev; p.why = String(q.why||p.why);
      });
      var drop = {};
      (a.slips||[]).forEach(function(q){
        var n = q.n; if(typeof n!=="number" || !res.slips[n] || !issues.some(function(x){ return x.kind==="slip" && x.n===n; })) return;
        var t = String(q.text||""), sq = slipQuote(t);
        if(q.real && t && (!sq || A.indexOf(sq)>=0)){ if(t !== res.slips[n]) changed++; res.slips[n] = t; } else { drop[n] = 1; changed++; }
      });
      res.slips = res.slips.filter(function(s,n){ return !drop[n]; });
      // a slip that is still unverifiable after the second check is removed rather than shown
      res.slips = res.slips.filter(function(s){ var q = slipQuote(s); return !q || A.indexOf(q)>=0; });
      res.points.forEach(function(p){ if(p.evidence && !evOk(A, p.evidence)) p.evidence = ""; });
      res.audit = changed ? "fixed" : "ok"; res.changed = changed;
      return res;
    }).catch(function(){
      res.points.forEach(function(p){ if(p.evidence && !evOk(A, p.evidence)) p.evidence = ""; });
      res.slips = res.slips.filter(function(s){ var q = slipQuote(s); return !q || A.indexOf(q)>=0; });
      res.audit = "unchecked"; return res;
    });
  }
  function markJson(it, ans){
    return sampleFn.json(buildMarkPrompt(it, ans), {modelTier:"default"}).then(function(r){
      var res = {points:shapePts(it, r), slips:(r.slips||[]).map(String).slice(0,10), missed:(r.missed||[]).map(String), errors:(r.error_types||[]).filter(function(e){ return ERR[e]; }), next:String(r.next||""), model:String(r.model||"")};
      var raw = typeof r.awarded==="number" ? Math.round(r.awarded) : null;
      return auditMarking(it, ans, res).then(function(x){
        var credited = x.points.filter(function(p){ return p.credited; }).length;
        x.awarded = Math.max(0, x.changed ? Math.min(it.marks, credited) : Math.min(it.marks, credited, raw==null?credited:raw));
        return x;
      });

      "<p>Paper 3 is 75 marks in 90 minutes, all compulsory, no calculator, 72 seconds a mark. From the past papers on this site the marks fall roughly like this: <b>data representation and computational thinking about a fifth each</b>, hardware about 15%, further programming 13%, then communication, system software, AI and security. The same few question types come back every series, so learn the <i>methods</i> below (floating point, Karnaugh maps, RPN, stack and queue states, tree tables, TCP/IP layers, switching, encryption steps) until they are automatic. Then use Practice by chapter.</p>"+
      "<p><b>How Paper 3 marks work.</b> Most 'describe', 'explain' and 'state' parts are a list of mark points: write one separate, specific idea per mark and use the technical term. Calculations give a mark per step, so always show working. Diagram questions (Karnaugh maps, syntax diagrams, trees) are answered here in words or tables, as the site describes. If anything here differs from the syllabus or the Cambridge pseudocode guide, they win.</p>"+
      "<div class='jump'>"+[["g13","13 Data representation"],["g14","14 Communication"],["g15","15 Hardware"],["g16","16 System software"],["g17","17 Security"],["g18","18 AI"],["g19","19 Computational thinking"],["g20","20 Further programming"]].map(function(x){ return "<a class='btn' href='#"+x[0]+"' data-g='"+x[0]+"'>"+x[1]+"</a>"; }).join("")+"</div>";

    /* ---------------- 13 ---------------- */
    h += "<h2 id='g13'>13. Data representation (about 21%)</h2>"+
    "<h3>Floating point: the method that earns every mark</h3>"+
    "<p>A real number is stored as <b>mantissa x 2^exponent</b>. Both are two's complement. The mantissa has an implied binary point after its first (sign) bit, so a positive mantissa looks like <code>0.1xxxxxxxx</code> and a negative one like <code>1.0xxxxxxxx</code>. <b>Normalised</b> means the first two mantissa bits are different: <code>01...</code> for positive, <code>10...</code> for negative. Normalising gives the maximum precision and one unique pattern per number.</p>"+
    "<h3>Denary to floating point (worked: -102.75, 10-bit mantissa, 6-bit exponent)</h3>"+ul([
      "**1. Work with the positive value.** 102.75 = 1100110.11 in binary.",
      "**2. Move the point so it reads 0.1...** 1100110.11 = 0.110011011 x 2^7 (the point moved 7 places left, so the exponent is +7).",
      "**3. Fit the mantissa.** Sign bit 0, then the digits: 0 110011011 = `0110011011` (exactly 10 bits).",
      "**4. Exponent in 6-bit two's complement:** 7 = `000111`.",
      "**5. If the number is negative, two's complement the mantissa.** Invert `0110011011` to `1001100100`, add 1: `1001100101`. It must now start 10.",
      "**Answer:** mantissa `1001100101`, exponent `000111`. Show every step; the working earns marks even if the final bits slip.",
      "For a number less than 1 (like 0.0101 x 2^0) shift the point right until it reads 0.1... and make the exponent negative: moving the point right by 2 gives exponent -2 = `111110` in 6 bits."
    ])+
    "<h3>Floating point to denary (worked: mantissa 0100111100, exponent 001001)</h3>"+ul([
      "**Exponent first:** `001001` = 9, so the point moves 9 places right.",
      "**Mantissa:** 0.100111100. Write it as 0.100111100 x 2^9 and slide the point 9 places right: `100111100.0`.",
      "**Add up:** 256 + 32 + 16 + 8 + 4 = **316**.",
      "**Negative mantissa** (starts 1): either two's complement it first and put a minus on the answer, or give the first bit the weight -1 (for a 1.0xxx mantissa the first bit is -1, then 1/2, 1/4...).",
      "**Negative exponent:** the point moves LEFT. If it is `111110` it is -2, so divide by 4."
    ])+

      "**1. Fill the map from the truth table.** Put each output in the cell for that input row. The row and column headings use Gray code: `00 01 11 10` (only one bit changes between neighbours). Cells that are next to each other, including the left/right and top/bottom edges (they wrap), differ in one variable.",

      "**Process states:** ready (waiting for the CPU), running (on the CPU), blocked (waiting for an I/O event). A process moves ready to running when scheduled; running to ready when its time slice ends or a higher priority arrives; running to blocked when it needs I/O; blocked to ready when the I/O completes. The OS keeps each process's details in a **process control block**.",

    "<p>Each answer is marked by Claude acting as a strict examiner. It sees the question, every mark-scheme point, the exact terms the scheme needs, what is never credited, and your answer. It must give you a yes or no on every single point, quote the words of yours that earned it, and explain in a sentence or two why a point was lost.</p>"+
    "<p><b>Why it is strict.</b> A real examiner cannot guess what you meant. So:</p><ul>"+
    "<li>A point earns a mark only if you wrote that idea clearly. Vague versions earn nothing, because the scheme asks for the specific thing.</li>"+
    "<li>Where the scheme needs an exact term, your wording must use it or mean exactly the same, with no ambiguity.</li>"+
    "<li>No benefit of the doubt, and no credit for a correct point that you contradict in the next line.</li>"+
    "<li>Explain needs a reason or effect. A point true of both things in a comparison earns nothing.</li>"+
    "<li>The score is recomputed from the point-by-point list, so the total cannot be higher than the points shown.</li></ul>"+
    "<p><b>What it cannot do.</b> It is an AI marker working from a mark scheme written in our own words. It can be stricter or looser than a person on borderline wording. If a result looks wrong, open the official mark scheme from the link under the feedback and check. Parts marked with lower confidence had a mark scheme that was harder to read.</p>"+
    "<h2>Colours</h2><p>Green means full marks on the first try. Teal green means full marks after you tried the question again, and each point you found on the retry is marked in teal too. Amber means some marks, red means none yet.</p>"+
    "<h2>Mock exam</h2><p>The Mock exam tab gives you a whole paper on one page with a 90 minute clock. Nothing is marked until you hand in (or the time runs out). Then every part is marked with the same strict rules as practice, you get a total out of 75, and the grade comes from the Cambridge thresholds for that paper where they are published. Because an AI marks it, treat the total as accurate to about plus or minus 5 marks.</p>"+
    "<h2>Saving your answers</h2><p>Everything you type is saved as you type, on this device, and also in the page store when it is connected. If you close the tab or refresh, your half-written answers come back. Every answer you submit is kept as its own attempt, even after you try the question again. The My answers tab lists them all with a search box, and Copy all as text gives you a plain copy. Your Mock exam answers are backed up the same way.</p>"+
    "<h2>AI tutor</h2><p>On the Practice tab, the Ask the AI tutor button opens a chat that knows the question you are on. Until you have tried a question it only gives hints, so you still do the thinking. Once you have had a go, or if you press Allow full answers, it can see the mark scheme and your marked answer and explain every mark you lost. Ask it anything about the topic too. Each question keeps its own chat in this browser. It is switched off in the Mock exam, because a real exam has no tutor. It is an AI, so for a disputed mark check the official mark scheme.</p>"+
    "<h2>Where the questions come from</h2>"+
    "<p>The "+ITEMS.length+" question parts cover "+codes.length+" Paper 3 papers (May/June 2024 to May/June 2026). The May/June 2024, May/June 2025, Oct/Nov 2025 and May/June 2026 papers were built from the real question papers and mark schemes you downloaded. The Oct/Nov 2024 papers were not on your computer, so they were built from web copies that could only be read as summaries: treat those parts with extra care. Drawing questions (Karnaugh map loops, syntax diagrams, trees, circuits) are answered and marked from a written description, so those are the least exact. Questions and mark schemes are written in our own words, because the originals are Cambridge's copyright. Every question links to the official paper and mark scheme.</p>"+
    "<p><b>Parts that depended on an earlier part.</b> In the real paper some parts say things like your answer to part (a). Because you can practise by topic, those parts now carry the information they need in their own wording, so every part can be answered on its own. The marks and the mark scheme are unchanged.</p>"+
    "<p><b>Be careful with the confidence label.</b> The mark points were written from the real mark schemes you downloaded. High means the points match the scheme exactly. Medium means the scheme was unclear, gave every candidate the mark, or the answer is a drawing that is marked from a description of the drawing, so the wording of a point may differ slightly from Cambridge's. Low-confidence parts are hidden unless you tick the box. Before you rely on a result, open the official mark scheme from the link under the feedback. Model answers for code are one valid answer, not the only one.</p>"+

  function aiMd(s){
    var out = [], parts = String(s||"").split(/```[A-Za-z]*\n?/), liRe = /^\s*[-*•]\s+/, olRe = /^\s*\d+[.)]\s+/;
    parts.forEach(function(seg, i){
      if(i%2===1){ out.push("<pre><code>"+esc(seg.replace(/\n+$/,""))+"</code></pre>"); return; }
      var lines = seg.split("\n"), j = 0;
      while(j < lines.length){
        var ln = lines[j];
        if(liRe.test(ln)){ var li=[]; while(j<lines.length && liRe.test(lines[j])){ li.push("<li>"+aiFmt(lines[j].replace(liRe,""))+"</li>"); j++; } out.push("<ul>"+li.join("")+"</ul>"); continue; }
        if(olRe.test(ln)){ var ol=[]; while(j<lines.length && olRe.test(lines[j])){ ol.push("<li>"+aiFmt(lines[j].replace(olRe,""))+"</li>"); j++; } out.push("<ol>"+ol.join("")+"</ol>"); continue; }
        if(!ln.trim()){ j++; continue; }
        var para = [];
        while(j<lines.length && lines[j].trim() && !liRe.test(lines[j]) && !olRe.test(lines[j])){ para.push(aiFmt(lines[j].replace(/^#+\s*/,""))); j++; }

    });

  }

  function uRender(){
    var e = $("#uchip"); if(!e) return; var on = uActive(), td = UD[uDay(Date.now())]||0;
    e.innerHTML = "<i class='udot"+(on?" on":"")+"'></i><span class='ul'>Today</span> <b>"+uHMS(td)+"</b><span class='u2'><span class='ul'> · All time</span> <b>"+uHM(uTotal())+"</b></span>"+(on?"":"<span class='ul'>paused</span>");
  }
  function uTick(){
    var now = Date.now(), dt = uLast ? now - uLast : 0; uLast = now;
    if(dt > 0 && uActive()){ var k = uDay(now); UD[k] = (UD[k]||0) + Math.min(dt, 5000); }
    if(now - uSaved > 5000) uPersist();
    uRender();
    var c = $("#uCard"); if(c && tab==="progress") c.innerHTML = uCardInner();
  }
  function uCardInner(){
    var now = Date.now(), days = [], i;
    for(i=13;i>=0;i--){ var ts = now - i*86400000, k = uDay(ts); days.push({k:k, ms:UD[k]||0, wd:["S","M","T","W","T","F","S"][new Date(ts).getDay()], today:i===0}); }
    var week = days.slice(7).reduce(function(s,d){ return s+d.ms; },0), prev = days.slice(0,7).reduce(function(s,d){ return s+d.ms; },0);
    var keys = Object.keys(UD).filter(function(k){ return UD[k] >= 60000; }), best = 0, bestK = "";
    keys.forEach(function(k){ if(UD[k] > best){ best = UD[k]; bestK = k; } });
    var streak = 0; for(i=0;i<400;i++){ var kk = uDay(now - i*86400000); if((UD[kk]||0) >= 10*60000) streak++; else if(i===0) continue; else break; }
    var mx = Math.max.apply(null, days.map(function(d){ return d.ms; }).concat([60000]));
    var avg = keys.length ? uTotal()/keys.length : 0, td = UD[uDay(now)]||0;
    var h = "<div class='stats'>"+
      "<div class='stat'><b>"+uHMS(td)+"</b><span>today"+(uActive()?" (counting)":" (paused)")+"</span></div>"+
      "<div class='stat'><b>"+uHM(week)+"</b><span>last 7 days"+(prev?" · the 7 days before: "+uHM(prev):"")+"</span></div>"+
      "<div class='stat'><b>"+uHM(uTotal())+"</b><span>all time on this site</span></div>"+
      "<div class='stat'><b>"+streak+" day"+(streak===1?"":"s")+"</b><span>study streak (10+ min a day)</span></div>"+
      "<div class='stat'><b>"+(best?uHM(best):"—")+"</b><span>best day"+(bestK?" · "+bestK:"")+"</span></div>"+
      "<div class='stat'><b>"+(avg?uHM(avg):"—")+"</b><span>average on a day you studied</span></div></div>"+
      "<div class='note' style='margin:14px 0 0'>Last 14 days</div><div class='ubars' role='img' aria-label='Study time per day, last 14 days'>"+days.map(function(d){
        var hgt = Math.max(2, Math.round(96*d.ms/mx));
        return "<div class='ubar"+(d.today?" today":"")+(d.ms<60000?" zero":"")+"' title='"+d.k+": "+uHM(d.ms)+"'><em>"+(d.ms>=60000?(d.ms>=3600000?(d.ms/3600000).toFixed(1)+"h":Math.round(d.ms/60000)+"m"):"")+"</em><i style='height:"+hgt+"px'></i><span>"+d.wd+"</span></div>";
      }).join("")+"</div>"+
      "<div class='note'>Counts only while this page is open and you are active. It pauses when you switch tab or leave it idle. Stored in this browser only, so another phone or computer keeps its own total.</div><div style='height:14px'></div>";
    return h;
  }
  function uCardHtml(){ return "<h2>Study time</h2><div id='uCard'>"+uCardInner()+"</div>"; }
  function uInit(){
    uLoad(); uLast = Date.now(); uAct = Date.now();
    ["pointerdown","keydown","touchstart","wheel","scroll","input"].forEach(function(ev){ document.addEventListener(ev, function(){ uAct = Date.now(); }, {passive:true, capture:true}); });
    document.addEventListener("visibilitychange", function(){ if(document.hidden){ uPersist(); } else { uLoad(); uLast = Date.now(); uAct = Date.now(); uRender(); } });
    window.addEventListener("pagehide", uPersist);
    var ch = $("#uchip"); if(ch) ch.onclick = function(){ if(tab!=="progress"){ if(tab==="practice" && queue[idx]) drCheck(queue[idx]); tab="progress"; try{ history.replaceState(null,"","#progress"); }catch(e){} renderAll(); window.scrollTo(0,0); } };
    uRender(); setInterval(uTick, 1000);
  }


  /* ---------- my plan ---------- */
  function startDay(d, id){
    if(tab==="practice" && queue[idx]) drCheck(queue[idx]);
    F.plan = true; F.day = d; F.chapter = 0; F.sub = ""; F.session = ""; F.status = "all"; F.shuffle = false; buildQueue();
    idx = 0;
    if(id){ for(var i=0;i<queue.length;i++){ if(queue[i].id===id){ idx=i; break; } } }
    else { for(var j=0;j<queue.length;j++){ if(!latest(queue[j].id)){ idx=j; break; } } }
    tab = "practice"; try{ history.replaceState(null,"","#practice"); }catch(e){}
    renderAll(); window.scrollTo(0,0);
  }
  function renderPlan(){
    var main = $("#main"), ex = new Date(2026,9,21,9,0,0), left = Math.round((new Date(2026,9,21) - new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()))/86400000);
    var totBudget = 0, totSpent = 0, totDone = 0, totN = PLAN.ids.length, totAw = 0, totTried = 0;
    var h = "<div class='pl'><div class='card'><h1>Your 6-hour plan for Paper 3</h1>"+
      "<p style='margin:0 0 8px'>"+(left>0 ? "<b>"+left+" day"+(left===1?"":"s")+"</b> to Paper 3 on Wed 21 Oct." : "Paper 3 is on Wed 21 Oct.")+" The "+totN+" questions below are what is left after the repeats were removed. About <b>4 hours 15 minutes</b> of questions over four days, then a <b>90 minute mock</b> and a short fix session. That is the whole six hours.</p>"+
      "<div id='plTot'></div></div>";
    PLAN.sessions.forEach(function(s, d){
      var done = 0, aw = 0, mk = 0, spent = 0, tried = 0;
      s.ids.forEach(function(id){ var it = byId(id), a = latest(id); mk += it.marks; spent += tmMs(id); if(a){ done++; aw += a.awarded; tried += it.marks; } });
      totBudget += s.min; totSpent += spent; totDone += done; totAw += aw; totTried += tried;
      var sm = Math.round(spent/60000);
      h += "<section class='sess"+(done===s.ids.length?" done":"")+"'><div class='sh'><h3>Day "+(d+1)+" · "+esc(s.day)+" · "+esc(s.title)+"</h3><button class='btn primary' data-day='"+d+"'>"+(done===0?"Start":done===s.ids.length?"Review":"Continue")+"</button></div>"+
        "<div class='meta'>"+s.ids.length+" questions · "+s.marks+" marks · plan "+s.min+" min · done "+done+"/"+s.ids.length+(tried?" · scored "+aw+"/"+tried+" ("+Math.round(100*aw/tried)+"%)":"")+" · time used "+sm+" min</div>"+
        "<div class='tbar' title='Done'><i style='width:"+(100*done/s.ids.length)+"%'></i></div><ol>"+
        s.ids.map(function(id){ var it = byId(id), a = latest(id), lv = level(a);
          return "<li data-q='"+esc(id)+"' data-d='"+d+"'><span class='dot "+(lv==="new"?"":lv)+"' title='"+lv+"'></span><span class='tx'>"+esc(it.prompt.replace(/\s+/g," ").slice(0,90))+(it.prompt.length>90?"...":"")+"<small>"+esc(it.subtopic)+" · "+esc(PAPERS[it.session+"-"+it.variant].code)+" Q"+esc(it.q)+"</small></span><span class='mk'>"+(a?a.awarded+"/":"")+it.marks+"</span></li>"; }).join("")+"</ol></section>";
    });
    var mockDone = false; try{ mockDone = attempts.some(function(a){ return a.mock; }); }catch(e){}
    h += "<section class='sess'><div class='sh'><h3>Day 5 · Tue 20 Oct · Timed mock and fixes</h3><button class='btn primary' id='plMock'>Open the mock</button></div>"+
      "<div class='meta'>90 min mock + about 30 min to read the marking and fix errors</div>"+
      "<ul class='rules'><li>Sit the mock at the default paper (May/June 2026 variant 32). It is not in the question list above, so it is fresh. Use the timer and do not pause it.</li><li>After it, open <b>My weak spots</b>. Fix only the top two error types it shows. Do not start new topics.</li><li>Wed 21 Oct, before the exam: read the Master guide for floating point, K-maps and your two weakest topics for 30 minutes. No new questions.</li></ul></section>";
    h += "<div class='card'><h2>How to do each question</h2><ol class='rules' style='list-style:decimal;display:block;padding-left:22px'>"+
      "<li>Answer under the timer: 72 seconds a mark. Do not look at anything.</li>"+
      "<li>Mark it, then read every missed point. Do not just look at the score.</li>"+
      "<li>Scored full marks: move on. Scored 0 or 1 below full: read the fix, then redo it once now.</li>"+
      "<li>If you are behind plan, skip the 2-mark and 3-mark questions in the evening session, not the calculations, K-maps or pseudocode.</li></ol></div>";
    h += "<div class='card'><h2>What was cut, and why</h2><p>The question bank has "+fullPool().length+" parts. I grouped parts that ask for the same thing, kept the most recent, highest-confidence one from each group, and then spent your time in proportion to the marks each topic carries. 1-mark parts, repeated wording and one-off oddities were dropped. The May/June 2026 variant 32 paper is held back for the mock.</p>"+
      "<div class='wrapt'><table><tr><th>Topic</th><th class='n'>In bank</th><th class='n'>Marks</th><th class='n'>Kept</th><th class='n'>Cut</th></tr>"+
      PLAN.cut.map(function(c){ return "<tr><td>"+esc(c.group)+"</td><td class='n'>"+c.bank+"</td><td class='n'>"+c.marks+"</td><td class='n'>"+c.kept+"</td><td class='n'>"+(c.bank-c.kept)+"</td></tr>"; }).join("")+"</table></div>"+
      "<p class='note'>Be careful: this is a choice based on how often and how heavily each type of question has appeared in 14 papers, not a promise. Topics with only one or two kept questions (hashing, flip-flops, quantum cryptography, SSL) can still come up. If you finish early, press the button below and take the next topic from your weak list.</p>"+
      "<button class='btn' id='plAll'>Show all "+fullPool().length+" questions</button></div></div>";
    main.innerHTML = h;
    var tt = Math.round(totSpent/60000);
    $("#plTot").innerHTML = "<div class='meta'>Done "+totDone+"/"+totN+" · question time used "+tt+" of "+totBudget+" min"+(totTried?" · scored "+totAw+"/"+totTried+" so far ("+Math.round(100*totAw/totTried)+"%)":"")+"</div><div class='tbar'><i style='width:"+Math.min(100,100*totDone/totN)+"%'></i></div>";
    main.querySelectorAll("[data-day]").forEach(function(b){ b.onclick = function(){ startDay(+b.getAttribute("data-day")); }; });
    main.querySelectorAll("li[data-q]").forEach(function(li){ li.onclick = function(){ startDay(+li.getAttribute("data-d"), li.getAttribute("data-q")); }; });
    $("#plMock").onclick = function(){ tab = "mock"; try{ history.replaceState(null,"","#mock"); }catch(e){} renderAll(); window.scrollTo(0,0); };
    $("#plAll").onclick = function(){ F.plan = false; F.day = -1; F.chapter = 0; buildQueue(); idx = 0; tab = "practice"; try{ history.replaceState(null,"","#practice"); }catch(e){} renderAll(); window.scrollTo(0,0); };
  }

  function renderAll(){
    var sy0 = window.scrollY;
    document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", String(t.getAttribute("data-t")===tab)); });
    mkStop(); if(tab!=="practice") aiHide();
    $("#grid").style.gridTemplateColumns = (tab==="practice") ? "" : "minmax(0,1fr)";
    $("#rail").style.display = (tab==="practice") ? "" : "none";
    if(tab==="practice"){ renderRail(); renderPractice(); }
    else if(tab==="mock"){ stopTimer(); renderMock(); if(MK.phase==="exam") window.scrollTo(0,sy0); }
    else { stopTimer(); if(tab==="plan") renderPlan(); else if(tab==="answers") renderAnswers(); else if(tab==="progress") renderProgress(); else if(tab==="guide") renderGuide(); else if(tab==="grades") renderGrades(); else renderAbout(); }
  }
  document.querySelectorAll(".tab").forEach(function(t){ t.onclick=function(){ if(tab==="practice" && queue[idx]) drCheck(queue[idx]); tab=t.getAttribute("data-t"); try{ history.replaceState(null,"","#"+tab); }catch(e){} renderAll(); window.scrollTo(0,0); }; });
  var h0=(location.hash||"").replace("#",""); if(h0==="plan"||h0==="practice"||h0==="answers"||h0==="progress"||h0==="about"||h0==="guide"||h0==="grades"||h0==="mock") tab=h0;
  loadLocal(); tmLoad(); uInit(); mkLoad(); drHydrate(); buildQueue();
  // start on the first question not yet tried
  for(var i=0;i<queue.length;i++){ if(!latest(queue[i].id)){ idx=i; break; } }
  renderAll();

  if(window.claude && window.claude.use){
    window.claude.use("sample").then(function(s){ if(s){ sampleFn=s; } sampleSettled=true; if(!(tab==="mock"&&MK.phase==="exam"&&MK.start+MK.dur>Date.now()/1000)) renderAll(); }).catch(function(){ sampleSettled=true; if(!(tab==="mock"&&MK.phase==="exam"&&MK.start+MK.dur>Date.now()/1000)) renderAll(); });
    window.claude.use("db").then(function(d){ if(d){ DB=d; pullDb(); drPull(); } }).catch(function(){});
  }
})();
</script>
</body></html>
