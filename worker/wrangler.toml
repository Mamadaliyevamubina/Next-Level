name = "next-level-ai-marker"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Pages allowed to call the marker (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://mamadaliyevamubina.github.io,http://localhost:5173,http://localhost:8000"
# Where the question images are served from.
SITE_URL = "https://mamadaliyevamubina.github.io/Next-Level/"

# At most 20 marking requests per minute from one visitor.
[[ratelimits]]
name = "MARK_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# The API key is a secret, not a var: run  npx wrangler secret put ANTHROPIC_API_KEY
