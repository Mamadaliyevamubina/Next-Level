# Serves the built React app. Every address that is not a real file gets index.html,
# so refreshing a page such as /paper/1 or /competition works.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 'ok'; }

  # Built files have a hash in their name, so they can be cached for a long time.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /figures/ { expires 30d; try_files $uri =404; }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
