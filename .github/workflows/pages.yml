# Builds the React app (client/) and publishes it to GitHub Pages (next-level.uz) on every push to main.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          # The API (next-level-backend) for logins, AI marking, assignments and the competition.
          VITE_API_URL: https://next-level-api.dombit.uz
      # GitHub Pages serves 404.html for unknown addresses: make it the app, so /paper/1 and old links work.
      - run: cp client/dist/index.html client/dist/404.html && cp CNAME client/dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
